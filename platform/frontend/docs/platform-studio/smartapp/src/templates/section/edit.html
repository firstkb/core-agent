<style>
    .is-sticky {
        border-bottom: 1px solid var(--bs-gray-300);
    }

    #img-big .modal-body {
        padding: 0px !important;
    }

    #img-big .modal-body img {
        width: 100%;
        max-width: 100%;
        max-height: 100%;
    }

    #panel-photo .progress {
        margin-top: 10px;
    }

    .field-required input,
    .field-required textarea {
        border-left: 2px solid orange;
    }

    .field-required .select2-container--bootstrap5.select2-container--focus:not(.select2-container--disabled) .form-select:not(.form-select-solid):not(.form-select-transparent),
    .field-required .select2-container--bootstrap5.select2-container--open:not(.select2-container--disabled) .form-select:not(.form-select-solid):not(.form-select-transparent) {
        border-left: 2px solid orange;
    }

    .field-required .select2-container--bootstrap5 .select2-selection--single {
        border-left: 2px solid orange;
    }

    .field-uniq.conflict input,
    .field-uniq.conflict textarea {
        border: 2px solid rgb(255, 85, 0);
    }

    .field-uniq.conflict .select2-container--bootstrap5.select2-container--focus:not(.select2-container--disabled) .form-select:not(.form-select-solid):not(.form-select-transparent),
    .field-uniq.conflict .select2-container--bootstrap5.select2-container--open:not(.select2-container--disabled) .form-select:not(.form-select-solid):not(.form-select-transparent) {
        border: 2px solid rgb(255, 85, 0);
    }

    .field-uniq.conflict .select2-container--bootstrap5 .select2-selection--single {
        border: 2px solid rgb(255, 85, 0);
    }

    .survey>p {
        cursor: pointer;
    }

    .survey>div {
        display: none;
    }

    .field-required label.btn {
        border-left: 2px solid orange !important;
    }

    .field-required.need-fill input,
    .field-required.need-fill textarea {
        border-left: 2px solid red !important;
    }

    .field-required.need-fill .select2-container--bootstrap5 .select2-selection--single {
        border-left: 2px solid red !important;
    }

    .field-required.need-fill .select2-container--bootstrap5.select2-container--focus:not(.select2-container--disabled) .form-select:not(.form-select-solid):not(.form-select-transparent),
    .field-required.need-fill .select2-container--bootstrap5.select2-container--open:not(.select2-container--disabled) .form-select:not(.form-select-solid):not(.form-select-transparent) {
        border-left: 2px solid red !important;
    }

    .field-required.need-fill label.btn {
        border-left: 2px solid red !important;
    }

    .blinking-text {
        animation: blink 2s linear infinite;
    }

    @keyframes blink {

        0%,
        100% {
            color: #000;
        }

        50% {
            color: #CCC;
        }
    }

    .ai-loader {
        width: 48px;
        height: 48px;
        border: 5px solid #e1e3ea;
        border-bottom-color: #3498db;
        border-radius: 50%;
        display: inline-block;
        box-sizing: border-box;
        animation: rotation 1s linear infinite;
    }

    .ai-loader.ai-loader-small {
        width: 20px;
        height: 20px;
    }

    #ai-last-text h1,
    #ai-last-text h2,
    #ai-last-text h3 {
        display: inline-block !important;
        width: 100%;
    }

    .signature-pad {
        border: 1px solid #e1e3ea;
        border-radius: 10px;
        width: 100%;
        height: 200px;
    }

    .jodit-container {
        background: #fff !important;
        border-color: #d9d9d9 !important;
        color: #000 !important;
    }

    .jodit-container .jodit-toolbar__box,
    .jodit-container .jodit-status-bar {
        background: #f8f9fa !important;
        border-color: #d9d9d9 !important;
        color: #000 !important;
    }

    .jodit-container .jodit-workplace,
    .jodit-container .jodit-wysiwyg,
    .jodit-container .jodit-source {
        background: #fff !important;
        color: #000 !important;
    }

    @keyframes rotation {
        0% {
            transform: rotate(0deg);
        }

        100% {
            transform: rotate(360deg);
        }
    }
</style>

<script>
    var page = {
        config: {},
        fields_results: {},
        ai_count: 0,
        ai_show: false,
        objNew: { guid: '', fileds: {} },
        init: function () {
            app.rec_new = "";
            if (app.rec == "new") {
                var objNew = remmeber.getNewFieldsObj();
                if (objNew && typeof objNew.guid !== "undefined" && objNew.guid != "") {
                    page.objNew = objNew;
                    app.rec_new = objNew.guid;
                } else {
                    app.rec_new = uuidv4();
                }
                $("#form-title")
                    .html('<b>New Form</b><br>This form won’t be created until you complete all required fields and click Finish.')
                    .addClass('text-danger');
                $("#card-form").addClass("new-rec");
            }

            page.getConfigEdit();

            //app.openImgBig();
            $(window).off('resize').on('resize', function () {
                page.resizeAllCanvases();
            });
        },
        unload: function () {
            if (page.sendRequestAiTimeout) {
                clearTimeout(page.sendRequestAiTimeout);
                page.sendRequestAiTimeout = null;
            }
            if (typeof page.config.addons !== "undefined" && typeof page.config.addons['voiceInspectionUrl'] !== "undefined" && page.config.addons['voiceInspectionUrl'] != '') {
                voiceHelper.destroy();
            }
        },
        getConfigEdit: function () {
            app.apiGET("/ezdata/edit?part=" + app.part + "&rec=" + app.rec + "&rec_new=" + app.rec_new, function (data) {

        aiParceText: function (text) {
            let html = text.replace(/\\n/g, "<br>"); /*replace(/\n/g, "<br>")*/
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*(.*?)\*/g, '<strong>$1</strong>');
            html = html.replace(/####(.*?)####/g, '<h3>$1</h3>');
            html = html.replace(/###(.*?)###/g, '<h2>$1</h2>');
            /*html = html.replace(/####\s*(.*?)\s*(?=<br>|$)/g, '<h3>$1</h3>');
            html = html.replace(/###\s*(.*?)\s*(?=<br>|$)/g, '<h2>$1</h2>');*/
            html = html.replace(/\\\"/g, '"');

            return html;

                                } else {

                        val.last_type = "";

                            val.last_type = val.type;

                        /*if (val.type === "2012" && val.value > '') {

                                }
                                $(insert).append(ejs.render(tpl.innerHTML, val));
                                //console.log(val.type);
                            }
                            continue;
                        }

                        if (val.type === "90" && val.fields_results !== "") {
                            let arr = JSON.parse(val.fields_results);
                            let f_id = "ExtDB" + val.param + "_id";
                            val.fields_results = {};
                            val.fields_results_origin = arr;
                            $.each(arr, function (key, val_f) {
                                val.fields_results[val_f[f_id]] = val_f;
                            });
                            page.fields_results[val.param] = val.fields_results;
                            val['encode'] = encode;
                        }
                        if (val.form_type === "SOR") {
                            val.type = "sor";
                            val['encode'] = encode;

                            var field = val["fields"][0]["field"];
                            var fieldsResults = val["fields_results"];
                            var lists = [];

                            if (fieldsResults) {
                                Object.entries(fieldsResults).forEach(([key, result]) => {
                                    if (result[field]) {
                                        lists.push(result[field]);
                                    }
                                });
                            }
                            val['sor_lists'] = lists;

                        } else if (val.form_type === "CHECKLIST") {
                            val.type = "checklist";
                            val['encode'] = encode;
                            checklist.result = val.fields_results;
                        } else if (val.form_type === "CA") {
                            val.type = "ca";
                        }

                        if (val.type === "checklist" || val.type === "30") {
                            page.ai_show = true;

                            val['subform'] = subform;

                                val['lookup'] = app.lookup[val.field_id];

                                        val['field_note'] = val_f.field;
                                    } else if (val_f.form_type === "CA") {

                            } else if (val.type === "90" || val.type === "ca") {
                                page.renderFields(val.fields, "#modal-" + val.field_id + " .modal-fields", true, 3);
                            }
                        }

        renderTabs: async function (fields, insert = "#fieldBody", subform = false, level = 1) {
            const tabs = page.groupFieldsByTabs(fields);
            if (tabs.length === 1) {
                return page.renderFields(tabs[0].fields, insert, subform, level);
            }

            if (tabs[0].id === "tab_default") {
                await page.renderFields(tabs[0].fields, insert, subform, level);
                tabs.shift();
                if (!tabs.length) return;
            }

            let tabParam = new URLSearchParams(window.location.search).get('tab');
            if (!tabParam && window.location.hash) tabParam = window.location.hash.substring(1);
            let activeIdx = 0;
            if (tabParam) {
                const idx = tabs.findIndex(t => t.id === tabParam);
                if (idx >= 0) activeIdx = idx;
            }

            const $nav = $(`
                    <div class="mt-5 hover-scroll-x nav-tabs-wrap">
                    <div class="d-grid">
                        <ul class="nav nav-tabs flex-nowrap text-nowrap"></ul>
                    </div>
                    </div>
                `);
            const $content = $('<div class="tab-content mb-5" style="padding: 15px 20px 5px 20px;border: 1px solid var(--bs-text-gray-400);border-top: 0px;border-bottom-left-radius: 4px;border-bottom-right-radius: 4px;"></div>');

            $(insert).append($nav).append($content);
            page._suspendInitFields = true;
            try {
                for (let i = 0; i < tabs.length; i++) {
                    const tab = tabs[i];
                    const isActive = (i === activeIdx);
                    const activeTitle = isActive ? "active" : "";
                    const active = isActive ? "active show" : "";
                    const $link = $(`
                    <li class="nav-item">
                        <a class="nav-link btn btn-color-gray-600
                                btn-active-color-white btn-active-info rounded-bottom-0 fw-bold no-ajax ${activeTitle}"
                        data-bs-toggle="tab" href="#${tab.id}">${tab.title}</a>
                    </li>
                    `);
                    const $pane = $(`<div class="tab-pane fade mb-5 ${active}" id="${tab.id}" role="tabpanel"></div>`);

                    $nav.find("ul").append($link);
                    $content.append($pane);

                    await page.renderFields(tab.fields, `#${tab.id}`, subform, level);
                }

            } finally {
                page._suspendInitFields = false;
                if (page._pendingInit) {
                    page._pendingInit = false;
                    page.init_fields(false);
                }
                page._installTabScrollUX($nav);
                page._afterTabsMounted($nav[0]);
            }
        },
        _installTabScrollUX: function ($nav) {
            const $list = $nav.find('.nav-tabs');
            if (!$list.length) return;

            const NS = '.tabux';
            $list.off(NS);
            $(window).off('resize' + NS);

            const el = $list[0];

            const updateHints = () => {
                const max = el.scrollWidth - el.clientWidth;
                const sl = el.scrollLeft;
                $nav.toggleClass('has-left', sl > 0);
                $nav.toggleClass('has-right', sl < max - 1);
            };

            $list.on('shown.bs.tab' + NS, 'a[data-bs-toggle="tab"]', function () {
                const scroller = page._getHorizontalScroller($nav);
                if (scroller) page._centerTab(scroller, this);
                updateHints();

                const href = this.getAttribute('href');
                const id = href && href.startsWith('#') ? href.slice(1) : null;
                if (id) {
                    const url = new URL(location.href);
                    url.searchParams.set('tab', id);
                    history.replaceState(null, '', url);
                }
            });

            $list.on('scroll' + NS, updateHints);
            $(window).on('resize' + NS, updateHints);

            requestAnimationFrame(updateHints);
            updateHints();
        },
        _afterTabsMounted: function (navEl) {
            const scroller = page._getHorizontalScroller($(navEl));
            const active = navEl.querySelector('.nav-link.active');
            if (!scroller || !active) return;

            const centerNow = () => page._centerTab(scroller, active);

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    centerNow();
                    setTimeout(centerNow, 80);
                    setTimeout(centerNow, 180);
                });
            });

            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(centerNow).catch(() => { });
            }
            if (scroller.clientWidth === 0) {
                setTimeout(centerNow, 120);
            }
        },
        _getHorizontalScroller: function ($nav) {
            const cands = [
                $nav.find('.nav-tabs')[0],
                $nav.closest('.hover-scroll-x')[0],
                $nav[0],
                $nav.find('.hover-scroll-x')[0],
                document.querySelector('[data-kt-scroll="true"] .nav-tabs')
            ].filter(Boolean);

            for (const el of cands) {
                const cs = getComputedStyle(el);
                const canScroll = /(auto|scroll)/.test(cs.overflowX) && el.scrollWidth > el.clientWidth + 1;
                if (canScroll) return el;
            }
            return cands.sort((a, b) => (b.scrollWidth - b.clientWidth) - (a.scrollWidth - a.clientWidth))[0] || null;
        },
        _centerTab: function (scroller, link, smooth = true) {
            const s = scroller.getBoundingClientRect();
            const t = link.getBoundingClientRect();
            const leftInScroller = (t.left - s.left) + scroller.scrollLeft;
            const target = leftInScroller - (scroller.clientWidth - t.width) / 2;
            const clamped = Math.max(0, Math.min(target, scroller.scrollWidth - scroller.clientWidth));
            scroller.scrollTo({ left: clamped, behavior: smooth ? 'smooth' : 'auto' });
        },
        groupFieldsByTabs: function (fields) {
            const tabs = [];
            const head = [];
            let current = null;

                        title: f.title || `Tab ${tabs.length + 1}`,

            });

                    title: "General",
                    fields: head
                });
            }

            return tabs;

        validateEmailFields: function ($scope) {
            let emailRe = /^(?:[A-Za-z0-9!#$%&'*+/=?^_`{|}~-]+(?:\.[A-Za-z0-9!#$%&'*+/=?^_`{|}~-]+)*)@(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,}$/;

            var $fields = $scope
                ? $scope.find('input.fld[type="email"], input.fld[data-email-list]')
                : $('input.fld[type="email"], input.fld[data-email-list]');

            $fields.removeClass('invalid');

            var errors = [];
            var firstBad = null;

            $fields.each(function () {
                var $el = $(this);
                var raw = $.trim($el.val());
                if (!raw) return;

                var isList = $el.is('[data-email-list]');
                var parts = isList ? raw.split(/[,\s;]+/) : [raw];

                var bad = parts.filter(function (v) { return v && !emailRe.test(v); });
                if (bad.length) {
                    var labelTxt = $el.closest('.field-uniq, .form-group, .row, div, li').find('label:first').text().trim();
                    var label = labelTxt ? (labelTxt + ': ') : '';
                    errors.push(label + bad.join(', '));
                    $el.addClass('invalid');
                    if (!firstBad) firstBad = $el;
                }
            });

            if (errors.length) {
                var msg = 'Incorrect email:\n' + errors.join('\n');
                app.alert(msg);
                if (firstBad) firstBad.focus();
                return false;
            }
            return true;
        },

            }

            const result = template.replace(/\{(\w+)\}/g, (fullMatch, varName) => {

            return true;

        checkRequiredFields: function (form = '#actFrm', options = {}) {
            var opts = options || {};
            var skipSubforms = !!opts.skipSubforms;
            var allFieldsFilled = true;
            var processedRadioNames = new Set();

            $(form + ' :input[required]').each(function () {
                if (form === '#actFrm' && ($(this).hasClass("fld") || $(this).hasClass("fldch"))) {

                    // --- FIX: radio group required ---
                    if ($(this).attr('type') === 'radio') {
                        const name = $(this).attr('name');
                        if (processedRadioNames.has(name)) {
                            return;
                        }
                        processedRadioNames.add(name);

                        if (!$(`${form} input[name="${name}"]:checked`).length) {
                            allFieldsFilled = false;
                            $(this).closest("div.field-required").addClass("need-fill");

                            let message = "Please fill all required fields";
                            if (typeof $(this).attr("title") !== "undefined") {
                                message = "Please fill field: \"" + $(this).attr("title") + "\"";
                            }

                            var $el = $(this);
                            var $pane = $el.closest('.tab-pane');

                            var doScrollFocus = function () {
                                $('html, body').animate({ scrollTop: $el.offset().top - 210 }, 'slow');
                                $el.focus();
                                app.alert(message);
                            };

                            if ($pane.length && !$pane.hasClass('active')) {
                                var paneId = '#' + $pane.attr('id');

                                var $tabLink =
                                    $pane.closest('.tab-content').prev().find('a[data-bs-toggle="tab"][href="' + paneId + '"]').first();
                                if (!$tabLink.length) {
                                    $tabLink = $('a[data-bs-toggle="tab"][href="' + paneId + '"]').first();
                                }

                                try {
                                    if (window.bootstrap && bootstrap.Tab) {
                                        $tabLink.one('shown.bs.tab', doScrollFocus);
                                        bootstrap.Tab.getOrCreateInstance($tabLink[0]).show();
                                    } else if (typeof $tabLink.tab === 'function') {
                                        $tabLink.one('shown.bs.tab', doScrollFocus).tab('show');
                                    } else {
                                        $tabLink.trigger('click');
                                        setTimeout(doScrollFocus, 200);
                                    }
                                } catch (e) {
                                    setTimeout(doScrollFocus, 200);
                                }
                            } else {
                                doScrollFocus();
                            }
                            return false;
                        } else {
                            $(this).closest("div.field-required").removeClass("need-fill");
                            return;
                        }
                    }

                    if ($(this).val() === '' || $(this).val() == "0" || $(this).val() == null) {
                        allFieldsFilled = false;
                        $(this).closest("div.field-required").addClass("need-fill");
                        let message = "Please fill all required fields";
                        if (typeof $(this).attr("title") !== "undefined") {
                            message = "Please fill field: \"" + $(this).attr("title") + "\"";
                        }

                        var $el = $(this);
                        var $pane = $el.closest('.tab-pane');

                        var doScrollFocus = function () {
                            $('html, body').animate({ scrollTop: $el.offset().top - 210 }, 'slow');
                            $el.focus();
                            app.alert(message);
                        };

                        if ($pane.length && !$pane.hasClass('active')) {
                            var paneId = '#' + $pane.attr('id');

                            var $tabLink =
                                $pane.closest('.tab-content').prev().find('a[data-bs-toggle="tab"][href="' + paneId + '"]').first();
                            if (!$tabLink.length) {
                                $tabLink = $('a[data-bs-toggle="tab"][href="' + paneId + '"]').first();
                            }

                            try {
                                if (window.bootstrap && bootstrap.Tab) {
                                    $tabLink.one('shown.bs.tab', doScrollFocus);
                                    bootstrap.Tab.getOrCreateInstance($tabLink[0]).show();
                                } else if (typeof $tabLink.tab === 'function') {
                                    $tabLink.one('shown.bs.tab', doScrollFocus).tab('show');
                                } else {
                                    $tabLink.trigger('click');
                                    setTimeout(doScrollFocus, 200);
                                }
                            } catch (e) {
                                setTimeout(doScrollFocus, 200);
                            }
                        } else {
                            doScrollFocus();
                        }
                        return false;
                    }
                } else if (form !== '#actFrm') {
                    if ($(this).attr("type") == 'radio') {
                        if (!$(`input[name="${$(this).attr('name')}"]:checked`).length) {
                            allFieldsFilled = false;
                            $(this).closest("div.field-required").addClass("need-fill");
                            let message = "Please fill all required fields";
                            let text = $(this).closest("div.field-required").find("label:first");
                            if (typeof text !== "undefined") {
                                message = "Please fill field: \"" + text.text() + "\"";
                            }
                            app.alert(message);
                            return false;
                        }
                    } else if ($(this).val() === '') {
                        allFieldsFilled = false;
                        $(this).closest("div.field-required").addClass("need-fill");
                        let message = "Please fill all required fields";
                        if (typeof $(this).attr("title") !== "undefined") {
                            message = "Please fill field: \"" + $(this).attr("title") + "\"";
                        }
                        //element.focus();
                        app.alert(message);
                        return false;
                    }
                } else {
                    $(this).closest("div.field-required").removeClass("need-fill");
                }
            });

            if (allFieldsFilled && form === '#actFrm' && !skipSubforms) {
                var $sfIndicators = $('.js-req-indicator');
                if ($sfIndicators.length) {
                    var $first = $sfIndicators.first();
                    var $pane = $first.closest('.tab-pane');

                    var doScroll = function () {
                        $first.addClass('flash');
                        setTimeout(function () { $first.removeClass('flash'); }, 2000);

                        $('html, body').animate({ scrollTop: $first.offset().top - 210 }, 'slow');
                    };

                    app.alert("Please check Sub Forms: some required fields are missing.");

                    if ($pane.length && !$pane.hasClass('active')) {
                        var paneId = '#' + $pane.attr('id');

                        var $tabLink =
                            $pane.closest('.tab-content').prev().find('a[data-bs-toggle="tab"][href="' + paneId + '"]').first();
                        if (!$tabLink.length) {
                            $tabLink = $('a[data-bs-toggle="tab"][href="' + paneId + '"]').first();
                        }

                        if ($tabLink.length) {
                            try {
                                if (window.bootstrap && bootstrap.Tab) {
                                    $tabLink.one('shown.bs.tab', doScroll);
                                    bootstrap.Tab.getOrCreateInstance($tabLink[0]).show();
                                } else if (typeof $tabLink.tab === 'function') {
                                    $tabLink.one('shown.bs.tab', doScroll).tab('show');
                                } else {
                                    $tabLink.trigger('click');
                                    setTimeout(doScroll, 200);
                                }
                            } catch (e) {
                                setTimeout(doScroll, 200);
                            }
                        } else {
                            doScroll();
                        }
                    } else {
                        doScroll();
                    }

                    return false;
                }
            }


            if (!allFieldsFilled) {
                return false;
            }

            if (form === '#actFrm' && typeof page.config.table !== "undefined" && ($("[name=" + page.config.table.field_status + "]").val() === "" || $("[name=" + page.config.table.field_status + "]").val() === null || $("[name=" + page.config.table.field_status + "]").val() === "Removed")) {
                $form = $("#actFrm");
                var formTop = $form.offset().top;

                $('html, body').animate({
                    scrollTop: formTop - 210
                }, 'slow');

                $form.find('input:visible, textarea:visible, select:visible').first().focus();

                let message = "Please change or add information to any field!";
                app.alert(message);
                return false;
            }

            if (form === '#actFrm' && typeof page.config.addons !== "undefined" && typeof page.config.addons['ExtDBpg_filesreg'] !== "undefined" && page.config.addons['ExtDBpg_filesreg'] == 1) {
                var fileType = page.config.addons['ExtDBpg_filesreg_format'] || "photo";
                var fileQty = page.config.addons['ExtDBpg_filesreg_qty'] || 1;
                var fileCount = 0;
                $(".filesAll a").each(function () {
                    if (fileType === "photo") {
                        if ($(this).find("img").length > 0) {
                            fileCount++;
                        }
                    } else if (fileType === "file") {
                        if ($(this).find("img").length === 0) {
                            fileCount++;
                        }
                    } else {
                        fileCount++;
                    }
                });
                if (fileCount < fileQty) {
                    allFieldsFilled = false;
                    app.alert("Please upload at least " + fileQty + " " + fileType + "(s).");
                    return false;
                }

            }
            return allFieldsFilled;
        },

        deleteSubFormItem: function (obj, id, sub_id = 0, table_id = '') {
            Swal.fire({
                text: 'Remove this Item?',

                buttonsStyling: false,

                confirmButtonText: "OK",
                cancelButtonText: 'Cancel',
                customClass: {
                    confirmButton: "btn btn-danger",
                    cancelButton: 'btn btn-success'
                }

                if (result.isConfirmed) {

                    arr['part'] = app.part;

                            obj.closest("tr").remove();

        initializeSignaturePads: function () {
            $('.signature-block').each(function () {
                const canvas = $(this).find('.signature-pad')[0];
                const signaturePad = new SignaturePad(canvas);
                page.resizeCanvas(canvas);
                $(canvas).data('signaturePad', signaturePad);
                const dataURL = $(this).find('.signature-data').val();
                if (dataURL) {
                    signaturePad.fromDataURL(dataURL);
                }
                signaturePad.addEventListener('endStroke', function () {
                    const dataURL = signaturePad.toDataURL();
                    $(canvas).closest('.signature-block').find('.signature-data').val(dataURL);
                    $(canvas).closest('.signature-block').find('.signature-data').trigger("change");
                });
            });

            $('.signature-block').off('click', '.clear');
            $('.signature-block').on('click', '.clear', function () {
                const signatureBlock = $(this).closest('.signature-block');
                const canvas = signatureBlock.find('.signature-pad')[0];
                const signaturePad = $(canvas).data('signaturePad');
                signaturePad.clear();
                const signatureData = signatureBlock.find('.signature-data');
                signatureData.val(' ');
                signatureData.trigger("change");
            });

        },
        resizeCanvas: function (canvas) {
            const ratio = Math.max(window.devicePixelRatio || 1, 1);
            canvas.width = canvas.offsetWidth * ratio;
            canvas.height = canvas.offsetHeight * ratio;
            canvas.getContext('2d').scale(ratio, ratio);
        },
        resizeAllCanvases: function () {
            $('.signature-block').each(function () {
                const canvas = $(this).find('.signature-pad')[0];
                const signaturePad = $(canvas).data('signaturePad');
                const dataURL = signaturePad.toDataURL();
                page.resizeCanvas(canvas);
                signaturePad.clear();
                signaturePad.fromDataURL(dataURL);
            });
        },

                $(editor.editor).on('focusout', function () {

            if (!$("div").is(".load-files")) {
                return;

            var obj = $(".load-files");

            arr['parent_tableid'] = obj.attr("data-tableid");

        statusReplacement: function (trigger) {
            if (!page.config?.addons?.statusReplacement) {
                return;
            }

            var statusField = page.config.table?.field_status;
            if (!statusField) {
                return;
            }
            var $statusInput = $("[name='" + statusField + "']");
            var currentStatus = $statusInput.val();

            var rules = Array.isArray(page.config.addons.statusReplacement)
                ? page.config.addons.statusReplacement
                : [page.config.addons.statusReplacement];

            $.each(rules, function (_, rule) {
                console.log(rule.trigger, trigger, rule.from, currentStatus);
                if (rule.trigger === trigger && (rule.from === currentStatus || rule.from === "*")) {
                    console.log(true);
                    $statusInput
                        .addClass("fld")
                        .val(rule.to)
                        .trigger("change");

                    //if (trigger === "onFormOpen") {
                    page.saveMain();
                    //}

                    return false;
                }
            });
        },
        encodeUTF8ToBase64: function (str) {
            return btoa(encodeURIComponent(str));
        },
        decodeBase64ToUTF8: function (encodedStr) {
            try {
                return decodeURIComponent(atob(encodedStr));
            } catch (e) {
                //console.error("Error decode base64:", e);
                return "";
            }
        }

    var remmeber = {
        formSelector: null,
        storageKey: null,
        storageKeyNew: 'newTopFields_' + app.part + '_' + app.config.user.users_id,
        excludeKeys: ['id', 'guid'],
        init() {
            remmeber.formSelector = '#actFrm';
            remmeber.storageKey = 'lastTopFields_' + app.part + '_' + app.config.user.users_id;
            remmeber.storageKeyNew = 'newTopFields_' + app.part + '_' + app.config.user.users_id;
            remmeber.excludeKeys = ['id', 'guid'];
        },
        getUrlParam: function (paramName) {
            var params = new URLSearchParams(window.location.search);
            return params.get(paramName);
        },
        rememberLastTopFields: function (arr) {
            var topLevelData = {};
            $.each(arr, function (key, val) {
                var fieldName = key;
                if (!remmeber.excludeKeys.includes(fieldName)) {
                    topLevelData[fieldName] = val;
                }
            });
            localStorage.setItem(remmeber.storageKey, JSON.stringify(topLevelData));
        },
        rememberNewTopFields: function (arr) {
            var topLevelData = {};
            var topLevelFields = {};
            $.each(arr, function (key, val) {
                var fieldName = key;
                if (!remmeber.excludeKeys.includes(fieldName)) {
                    topLevelFields[fieldName] = val;
                }
            });
            topLevelData["guid"] = app.rec_new;
            topLevelData["fields"] = topLevelFields;
            page.objNew = topLevelData;
            localStorage.setItem(remmeber.storageKeyNew, JSON.stringify(topLevelData));
        },
        clearNewTopFields: function () {
            localStorage.removeItem(remmeber.storageKeyNew);
        },
        getTopFieldsObj: function () {
            var storedData = localStorage.getItem(remmeber.storageKey);
            if (storedData) {
                return JSON.parse(storedData);
            }
            return false;
        },
        applyLastTopFields: function () {
            var storedData = localStorage.getItem(remmeber.storageKey);
            if (storedData) {
                var parsedData = JSON.parse(storedData);
                $.each(parsedData, function (key, value) {
                    if (!remmeber.excludeKeys.includes(key)) {
                        $(remmeber.formSelector).find('[name="' + key + '"]').val(value);
                    }
                });
            }
        },
        getNewFieldsObj: function () {
            var storedData = localStorage.getItem(remmeber.storageKeyNew);
            if (storedData) {
                return JSON.parse(storedData);
            }
            return false;
        }
    }

    var geo = {
        gpsInput: null,
        mapBtn: null,
        mapBtnDisabledText: "Map",
        init: function () {
            if ($("#GPS-location").length) {
                geo.init_fields();
                geo.obtainCoordinates();
            }
        },
        init_fields: function () {
            geo.gpsInput = $('#GPS-location');
            geo.mapBtn = $('#GPS-map-btn');
            geo.mapBtnDisabledText = geo.mapBtn.text();
        },
        logMessage: function (message, type = 'info') {
            if (type === 'error') {
                console.error(message);
            } else if (type === 'success') {
                console.log(`%c${message}`, 'color: green;');
            } else if (type === 'info') {
                console.log(`%c${message}`, 'color: blue;');
            } else {
                console.log(message);
            }
        },
        showLoading: function () {
            geo.mapBtn.text('Loading...').prop('disabled', true);
        },
        hideLoading: function () {
            geo.mapBtn.text(geo.mapBtnDisabledText).prop('disabled', true);
        },
        getBrowserGeolocation: function () {
            return new Promise(function (resolve, reject) {
                if (!navigator.geolocation) {
                    reject('Geolocation is not supported by your browser.');
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    function (position) {
                        var latitude = position.coords.latitude;
                        var longitude = position.coords.longitude;
                        geo.logMessage('Successfully obtained coordinates using Geolocation API.', 'success');
                        resolve({ latitude: latitude, longitude: longitude });
                    },
                    function (error) {
                        var message = '';
                        switch (error.code) {
                            case error.PERMISSION_DENIED:
                                message = 'User denied the request for Geolocation.';
                                break;
                            case error.POSITION_UNAVAILABLE:
                                message = 'Location information is unavailable.';
                                break;
                            case error.TIMEOUT:
                                message = 'The request to get user location timed out.';
                                break;
                            default:
                                message = 'An unknown error occurred.';
                                break;
                        }
                        geo.logMessage(`Geolocation API Error: ${message}`, 'error');
                        reject(message);
                    }
                );
            });
        },
        getIPGeolocation: function () {
            return new Promise(function (resolve, reject) {
                $.ajax({
                    url: "https://ipapi.co/json/",
                    method: 'GET',
                    success: function (data) {
                        if (data.latitude && data.longitude) {
                            var latitude = parseFloat(data.latitude);
                            var longitude = parseFloat(data.longitude);
                            geo.logMessage('Successfully obtained coordinates using IP-based geolocation (ipapi.co).', 'success');
                            resolve({ latitude: latitude, longitude: longitude });
                        } else {
                            geo.logMessage('Could not determine coordinates from ipapi.co.', 'error');
                            reject('Could not determine coordinates from ipapi.co.');
                        }
                    },
                    error: function (jqXHR, textStatus, errorThrown) {
                        geo.logMessage(`IP Geolocation Error: ${textStatus}`, 'error');
                        reject(`IP Geolocation Error: ${textStatus}`);
                    }
                });
            });
        },
        activateMapButton: function (latitude, longitude) {
            var googleMapsURL = `https://www.google.com/maps/place/${latitude},${longitude}`;
            geo.mapBtn.attr('href', googleMapsURL);
            geo.mapBtn.prop('disabled', false);
            geo.logMessage('Map button activated with coordinates.', 'success');
        },
        obtainCoordinates: function () {
            geo.showLoading();

            if (geo.gpsInput.val().trim() !== '') {
                var coords = geo.gpsInput.val().match(/Latitude:\s*([-\d.]+),\s*Longitude:\s*([-\d.]+)/);
                if (coords && coords.length === 3) {
                    var latitude = parseFloat(coords[1]);
                    var longitude = parseFloat(coords[2]);
                    geo.activateMapButton(latitude, longitude);
                } else {
                    geo.logMessage('Invalid coordinates format in the input field.', 'error');
                    geo.mapBtn.prop('disabled', true);
                }
                geo.hideLoading();
                return;
            }

            if (typeof page !== "undefined" && typeof page.config.table["field_status"] !== "undefined") {
                let field_status = page.config.table["field_status"];
                let statusAttrValue = $(`[name="${field_status}"]`).attr("data-value");
                let statusValue = $(`[name="${field_status}"]`).val();
                if (statusAttrValue === 'Complete' || statusAttrValue === 'Completed' || statusValue === 'Complete' || statusValue === 'Completed') {
                    geo.logMessage('Form status: Complete', 'success');
                    geo.hideLoading();
                    return;
                }
            }

            geo.getBrowserGeolocation()
                .then(function (coords) {
                    geo.gpsInput.val(`Latitude: ${coords.latitude.toFixed(6)}, Longitude: ${coords.longitude.toFixed(6)}`);
                    geo.activateMapButton(coords.latitude, coords.longitude);
                })
                .catch(function (errorMessage) {
                    geo.logMessage('Falling back to IP-based geolocation.', 'info');
                    geo.getIPGeolocation()
                        .then(function (coords) {
                            geo.gpsInput.val(`Latitude: ${coords.latitude.toFixed(6)}, Longitude: ${coords.longitude.toFixed(6)}`);
                            geo.gpsInput.trigger("change");
                            geo.activateMapButton(coords.latitude, coords.longitude);
                        })
                        .catch(function (ipError) {
                            geo.logMessage(`IP Geolocation Error: ${ipError}`, 'error');
                            geo.mapBtn.prop('disabled', true);
                        });
                })
                .finally(function () {
                    geo.hideLoading();
                });
        }
    };
