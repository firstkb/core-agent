{{POPUP2_BEGIN}}

    <style>
        @media print {
            .no-print, button, nav, header, footer, .controls, .sidebar {
                display: none !important;
            }
            body {
                margin: 0;
                padding: 8mm;
                font-size: 12pt;
                height: auto !important;
                overflow: visible !important;
            }
            #listTable > tr > td, #listTable > tr > th, #PopUpContent > .table-striped > tbody > tr:nth-child(odd) > td {
                background: white !important;
                background-color: white !important;
            }
            #listTable > tbody > tr > td {
                background: white !important;
                background-color: white !important;
            }
            #PopUpContent {
                padding: 0px;
                height: auto                !important;
                max-height: none            !important;
                min-height: 0               !important;  /* sometimes needed */
                overflow: visible           !important;
                overflow-y: visible         !important;
            }
            * {
                color: black !important;
                background: white !important;
            }
        }    
    </style>
    <button id='printBtn' style="background:#2c7be5; color:white; border:none; padding:6px 14px; border-radius:6px; font-size:15px; display:flex; align-items:center; gap:8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zM9 19H7v-4h2v4zm10-4h-2v4h-2v-4H9v4H7v-4H5v-6c0-.55.45-1 1-1h12c.55 0 1 .45 1 1v6zM7 5h10v2H7z"/></svg>
        Print
    </button>
    <script>
        document.getElementById('printBtn').addEventListener('click', () => {
            const btn = document.getElementById('printBtn');
            btn.disabled = true;
            window.print();
            setTimeout(() => {
                btn.disabled = false;
            }, 800);
        });
    </script>

<style>
	div.htmlField {
		border:1px solid rgb(220,220,220);
		background:rgb(250,250,250);
		padding:2px;
		margin:-2px;
		height:80px;
		overflow:auto;
	}
	#table-toolbar {
		display:none !important;
	}
	#PopUpContent {
		padding: 20px;
	}
	#PopUpContent > .table-striped>tbody>tr:nth-of-type(odd) {
		background-color: rgba(242, 244, 247, 0.9)!important;
	}
	#PopUpContent > .table-striped > tbody > tr:nth-child(odd) > td, #PopUpContent > .table-striped > tbody > tr:nth-child(odd) > th, #PopUpContent > .table-hover > tbody > tr:hover > td, #PopUpContent > .table-hover > tbody > tr:hover > th {
		background-color: rgba(242, 244, 247, 0.9)!important;
	}
	.table-striped > tbody > tr > td {
		border: none;
	}
</style>

<script>
	var DataList = new jsDataList("default.asp?action=list&table={{TABLE}}&param={{ID}}", "#listTable");
</script>

	<TABLE id="listTable" data-src="#DataList" data-repeat="no" style="width:100%" ALIGN="center" class='table table-striped table-view'>
	<!-- BEGIN tROW -->
	<TR>
        <TD class="t_hd" NOWRAP width='30%'><B>{{tFIELD_NAME}}:</B></TD>
        <TD class="t_td" style='max-width: 650px;overflow: auto;'>{{SPAN}}&nbsp;<span style="margin-left:50px;">{{tBUTTON}}</span></TD>
    </TR>
    <!-- END tROW -->
  </TABLE>

	<SCRIPT LANGUAGE="JavaScript">
		document.body.onload = function(){window.scrollTo(0,0);}
		window.status = "{{SITE_NAME}}";
	</SCRIPT>

{{POPUP2_END}}
