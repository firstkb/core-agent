{{POPUP2_BEGIN}}

<style>
	#Views { width:90%; text-align:left; padding:10px;}
	#Views .item { padding:10px;}
	#Views b{ color:#000000;}
	#Views .line0 { background-color: rgb(250,250,250); border:1px solid silver; padding: 10px;}
	#Views .line1 { background-color: rgb(250,250,250); border:1px solid silver; padding: 10px;}
</style>

<label style="padding: 10px;"><b>Additional Actions</b></label>

<div id='Views' style="display: none;"></div>

<center>
	<form name=editFrm>
		<input type="hidden" name="action" value="edit">
		<input type="hidden" name="table" value="PgViewEdit">
		<input type="hidden" name="page" value="PgViewEdit">
		<input type="hidden" name="param" value="new">
		<input type="hidden" name="ExtDBview_ExtDBpg_id" value="{{ID}}">
		<button class='btn btn-success' onclick="addNewView();">Add New Action</button>
	</form>
</center>

<script>
	function addNewView(){
		document.editFrm.param.value="new";
		document.editFrm.submit();
	}
	function EditView(valParam){
		document.editFrm.param.value=valParam;
		document.editFrm.submit();
	}
	function DeleteView(valParam){
		document.editFrm.action.value="delete";
		document.editFrm.param.value=valParam;
		document.editFrm.submit();
	}
</script>

<script>
	$(document).ready(function() {
		jQuery('#Views').html( $("#itemTemplate").render( [{{ViewsList}}] ) );
		$('#Views').css('overflow','auto').show();
	});
</script>

<script id="itemTemplate" type="text/x-jsrender">
	<div class='item'>
		<div class='line{{:#index % 2}}'>
			<input type=hidden name=view_id value="{{>id}}">
			<span style='width:300px;margin-right: 20px;'><b>{{>title}}</b></span> 
			<button class='btn btn-xs btn-info' style='font:menu;' onclick="EditView('{{>id}}')">Edit</button> &nbsp;&nbsp;
			<button class='btn btn-xs btn-warning' style='font:menu;' onclick="DeleteView('{{>id}}')">Delete</button>
			<div style='text-align:right'>link : <b>{{>link}}</b></div> 
		</div>
	</div>
</script>

{{POPUP2_END}}
