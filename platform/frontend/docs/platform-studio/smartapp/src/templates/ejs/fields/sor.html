<div class="table-responsive">
    <table class="table table-striped gs-7 gy-5 table table-row-bordered table-row-gray-300">
        <thead id="fieldHeader">
            <tr>
                <td></td>
                <td>Item</td>
                <td>Type</td>
                <td>Status</td>
            </tr>
        </thead>
        <tbody id="listBody">
            <tr>
                <td colspan="20" align="center" style="background-color: #FFF!important;">
                    <div class="edit-loader">
                        <svg version="1.1" id="L7" xmlns="http://www.w3.org/2000/svg"
                            style="width: 120px; height: 120px;" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px"
                            y="0px" viewBox="0 0 100 100" enable-background="new 0 0 100 100" xml:space="preserve">
                            <path fill="#22314b4f" d="M31.6,3.5C5.9,13.6-6.6,42.7,3.5,68.4c10.1,25.7,39.2,38.3,64.9,28.1l-3.1-7.9c-21.3,8.4-45.4-2-53.8-23.3
                        c-8.4-21.3,2-45.4,23.3-53.8L31.6,3.5z">
                                <animateTransform attributeName="transform" attributeType="XML" type="rotate" dur="2s"
                                    from="0 50 50" to="360 50 50" repeatCount="indefinite" />
                            </path>
                            <path fill="#22314b4f" d="M42.3,39.6c5.7-4.3,13.9-3.1,18.1,2.7c4.3,5.7,3.1,13.9-2.7,18.1l4.1,5.5c8.8-6.5,10.6-19,4.1-27.7
                        c-6.5-8.8-19-10.6-27.7-4.1L42.3,39.6z">
                                <animateTransform attributeName="transform" attributeType="XML" type="rotate" dur="1s"
                                    from="0 50 50" to="-360 50 50" repeatCount="indefinite" />
                            </path>
                            <path fill="#22314b4f" d="M82,35.7C74.1,18,53.4,10.1,35.7,18S10.1,46.6,18,64.3l7.6-3.4c-6-13.5,0-29.3,13.5-35.3s29.3,0,35.3,13.5
                        L82,35.7z">
                                <animateTransform attributeName="transform" attributeType="XML" type="rotate" dur="2s"
                                    from="0 50 50" to="360 50 50" repeatCount="indefinite" />
                            </path>
                        </svg>
                    </div>
                </td>
            </tr>

        </tbody>
    </table>
</div>

<script>
    var rec = '<%- rec %>';
    var parentTableId = '<%- table_id %>';
    var tableId = '<%- fields[0]["table_id"] %>';
    var field = '<%- fields[0]["field"] %>';
    var param = '<%- fields[0]["param"] %>';
    var fieldsResults = '<%- JSON.stringify(sor_lists) %>';
    var data = {
        part: app.part, rec, parentTableId, tableId, field, param, results: fieldsResults
    }

    var btnSOR = '';
    var part = '';
    var btnCA = '';
    var partCA = '';

    app.apiPOST('/ezdata/sor', data, function (dataRes) {
        //dataRes = JSON.parse(dataRes);
        $("#listBody").html('');
        if (dataRes.results) {
            aiComment.init(dataRes.table_name, dataRes.AI);
            part = dataRes.part;
            partCA = dataRes.partCA;
            if (!$(".menu-part-" + part).length) {
                part = undefined;
            }
            if (!$(".menu-part-" + partCA).length) {
                partCA = undefined;
            }
            $.each(dataRes.results, function (key, val) {
                if (typeof part != "undefined") {
                    btnSOR = '<a href="/web/?act=edit&part=' + part + '&rec=' + val["guid"] + '" type="button" class="btn btn-sm btn-primary ajaxify">edit</a>';
                }
                $("#listBody").append('<tr><td>' + btnSOR + '</td><td>' + val["item"] + '</td><td>' + val["type"] + '</td><td>' + val["status"] + '</td></tr>');

                if (val.childs != null && val.childs.length > 0) {
                    var tbody = '';
                    $.each(val.childs, function (keyCA, valCA) {
                        if (typeof partCA != "undefined") {
                            btnCA = '<a href="/web/?act=edit&part=' + partCA + '&rec=' + valCA["guid"] + '" type="button" class="btn btn-sm btn-warning ajaxify">edit</a>';
                        }
                        tbody += '<tr><td>' + (btnCA || '') + '</td>' +
                            '<td>' + (valCA["status"] && valCA["status"] !== "null" ? valCA["status"] : '') + '</td>' +
                            '<td>' + (valCA["name"] && valCA["name"] !== "null" ? valCA["name"] : '') + '</td>' +
                            '<!--<td>' + (valCA["req"] && valCA["req"] !== "null" ? valCA["req"] : '') + '</td>-->' +
                            '<td>' + (valCA["notes"] && valCA["notes"] !== "null" ? valCA["notes"] : '') + '</td></tr>';

                    });
                    var tableHTML = `<table class="table table-striped gs-7 gy-5 table table-row-bordered table-row-gray-300">
                        <thead><tr><th></th><th>CA Status</th><th>CA Assignee</th><!--<th>Verif. Req.</th>--><th>CA Description</th></tr></thead>
                        <tbody>${tbody}</tbody>
                        </table>`;
                    $("#listBody").append('<tr><td colspan="20">' + tableHTML + '</td></tr>');
                } else {
                    $("#listBody").append('<tr><td colspan="20" style="text-align:center; font-style:italic">No Corrective Actions</td></tr>');
                }

            });
        } else {
            $("#listBody").html('<tr><td colspan="20" style="text-align:center; font-style:italic">No records found</td></tr>')
        }
    });

    var aiComment = {
        btn: null,
        textarea: null,
        AI: "",
        init: function (table_name, AI) {
            aiComment.AI = AI;
            if (app.system_id == '1047' && table_name != "POR") {
                return;
            }
            var label = $('label:contains("Comments")');
            aiComment.textarea = label.closest("div.row").find("textarea");
            //if (aiComment.textarea.text() == "") {
            label.closest("div.row").find("textarea").parent().prepend('<img src="/web/assets/media/ai-logo.svg" id="btn-comment-ai" onclick="aiComment.getRequestAi($(this))" style="height: 30px;cursor: pointer;"> ');
            aiComment.btn = $("#btn-comment-ai");
            //}
            var content = aiComment.textarea.val().trim();
            if (content.length > 0) {
                aiComment.textarea.animate({
                    height: '300px'
                }, 300);
            }
        },
        getRequestAi: function () {
            aiComment.getRequestAiDialog()
        },
        getRequestAiDialog: function () {
            if ($.trim(aiComment.textarea.val()) != "") {
                app.alert("You can only send one request per form!");
            } else {
                Swal.fire({
                    text: 'Do you want to request AI Assistant?',
                    icon: "info",
                    buttonsStyling: false,
                    showCancelButton: true,
                    confirmButtonText: "Request",
                    cancelButtonText: 'Cancel',
                    customClass: {
                        confirmButton: "btn btn-success",
                        cancelButton: 'btn btn-info'
                    }
                }).then((result) => {
                    if (result.isConfirmed) {
                        aiComment.getRequestAiStart();
                    }
                });
            }
        },
        getRequestAiStart: function () {
            aiComment.btn.prop("disabled", true);
            aiComment.textarea.val('Please Wait...');
            app.startPageLoading();
            aiComment.sendRequestAi(true);
        },
        sendRequestAiTimeout: null,
        textAI: "",
        sendRequestAi: function (first = false) {
            console.log("sendRequestAi", first);
            var first_text = first ? 'yes' : 'no';
            var last_response_len = false;
            aiComment.textAI = "";

            let data = {}
            data["AI"] = aiComment.AI;

            $.ajax({
                url: app.local.aspUrl + '/smart/web/api/?act=ai_request_comment&part=' + app.part + '&rec=' + encode(app.rec_id) + '&first=' + first_text + '&aspKey=' + app.local.aspKey,
                type: "POST",
                dataType: "html",
                data: data,
                xhrFields: {
                    onprogress: function (e) {
                        var this_response, response = e.currentTarget.response;
                        if (last_response_len === false) {
                            this_response = response;
                            last_response_len = response.length;
                        }
                        else {
                            this_response = response.substring(last_response_len);
                            last_response_len = response.length;
                        }
                        aiComment.textAI += this_response.replace(/\\n/g, "\n");
                        this_response_AI = aiComment.textAI;
                        aiComment.textarea.val(this_response_AI.replace(/\\n/g, "\n"));

                        aiComment.autoExpand(aiComment.textarea);

                    }
                }
            })
                .done(function (data) {
                    app.stopPageLoading();
                    aiComment.btn.css("display", "inline-block");
                    aiComment.textarea.trigger("change");
                })
                .fail(function (data) {
                    console.log('Error: ', data);
                });

        },
        autoExpand: function (textarea) {
            textarea.css('height', 'auto');
            textarea.css('height', textarea.prop('scrollHeight') + 'px');
        }
    }
</script>
