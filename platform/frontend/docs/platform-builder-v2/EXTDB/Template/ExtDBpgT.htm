{{POPUP2_BEGIN}}

<SCRIPT LANGUAGE="JavaScript">
	var DataList = new jsDataList("default.asp?action=select&table=ExtDBpgT&id={{ID}}&PAGESLIST=ON&usefilter=", "#listTable");
	DataList.onload(function(){
		$('select[name=OnOff]').each(function (){
			$(this).hide().closest('td').find("i[type='btn-toggle']").click(function(){
				if($(this).hasClass('icon-checkbox-unchecked')){
					$(this).removeClass('icon-checkbox-unchecked').addClass('icon-checkbox-checked');
					$(this).parent().find('select[name=OnOff]').val('Yes').trigger('change');
				}else{
					$(this).removeClass('icon-checkbox-checked').addClass('icon-checkbox-unchecked');
					$(this).parent().find('select[name=OnOff]').val('No').trigger('change');
				}
			})
			if($(this).val()=='Yes'||$(this).val()=='Y'){
				$(this).closest('td').find("i[type='btn-toggle']").removeClass('icon-checkbox-unchecked').addClass('icon-checkbox-checked');
			}
		});
	});
</SCRIPT>
<style>
	.icon-checkbox-unchecked,.icon-checkbox-checked {cursor:pointer;}
</style>

  <TABLE class='table table-striped table-bordered' id="listTable" data-src="#DataList" ALIGN="center" WIDTH="100%" style="display:none;">
  <THEAD>
	<TR>
        <th WIDTH="1"></th>
        <th FIELD="OnOff" style="cursor:pointer" onclick="Sort(this)" NOWRAP>Enable</th>
        <th FIELD="jobtype_name" style="cursor:pointer" onclick="Sort(this)" NOWRAP>Title</th>
        <th><INPUT onclick="_globalCheck(this)" id=globalCheck type=checkbox value="" name=globalCheck></th>
    </TR>
  </THEAD>
  <TBODY>
      <TR>
        <TD ALIGN="center" VALIGN="middle" NOWRAP WIDTH=10>
        </TD>
          <TD NOWRAP ALIGN="center" style='padding:0px !important;text-align:center;'>
			<INPUT TYPE="hidden" DATAFLD="jobtype_id" class='jobtype_id'>
		    <span class='onoff_save'></span>
			<select name="OnOff" DATAFLD="OnOff" class='onoff' onchange='saveOnOf(this,{{ID}})'>
				<option style='background:silver;' value='No'>-</option><option style='background:yellow;' value='Yes'>Yes</option></select>
				<i class='icon-checkbox-unchecked icon-2x' type='btn-toggle'></i>
		  </TD>          
          <TD NOWRAP ALIGN=""><div DATAFLD="jobtype_name"></div></TD>
          <TD NOWRAP ALIGN="center"><INPUT id=mCheck_v dataFld=jobtype_id type=hidden name=mCheck_v><INPUT id=mCheck type=checkbox name=mCheck></TD>
      </TR>
  </TBODY>
  </TABLE>

<SCRIPT LANGUAGE="JavaScript">
	$('#page-toolbar').append("<li><a  href='javascript:void(0);' data-toggle='tooltip' data-placement='bottom' onclick='mOnOff()' title='Multiple On/Off'><i class='icon-switch'></i></a></li>");
	function _globalCheck(obj){
		$("input[name=mCheck]").prop('checked', obj.checked )
	}
	function mOnOff(){
		var arr_del = [];
		var arr_ins = [];
		var rec_id = {{ID}};
		var el = document.all.mCheck;
		var el2 = document.all.OnOff;
		if (el!=null){
			$("input[name=mCheck]").each(function(i){
				if(this.checked){
					if( $("select[name=OnOff]:eq("+i+")").val()=="Yes" ){
						arr_del.push($(this).parent().find("input[name=mCheck_v]").val());
					}else{
						arr_ins.push($(this).parent().find("input[name=mCheck_v]").val());
					}
				}
			})
			if(arr_del.length>0||arr_ins.length>0){
				$.ajax({
				  type: "POST",
				  url: "default.asp",
				  cache: false,
				  data: { action: "save", table: 'ExtDBpgT', rec_id: rec_id, jobtype_ids_del: arr_del.join(','), jobtype_ids_ins: arr_ins.join(',') }
				}).done(function( msg ) {
					if(msg!='SAVED'){
						alert( "ERROR: " + msg );
					}else{
						DataList.DataURL = DataList.DataURL;
						DataList.Reset();
					}
				});
			}
		}
	}
	function saveOnOf(obj,id){
		$(obj).parent().parent().find('.onoff_save').html('send');
		var obj_onoff = $(obj).parent().parent().find('select.onoff');
		var jobtype_id = $(obj).parent().find('.jobtype_id').val();
		$.ajax({
		  type: "POST",
		  url: "default.asp",
		  cache: false,
		  data: { action: "save", table: 'ExtDBpgT', jobtype_id: jobtype_id, rec_id: id, onoff: obj_onoff.val() }
		}).done(function( msg ) {
			if(msg!='SAVED'){
				alert( "ERROR: " + msg );
			}else{
				$(obj).parent().parent().find('.onoff_save').html('saved');
			}
		});
	}
</SCRIPT>

{{POPUP2_END}}
