 <input type=hidden id='crossTable' value='{{TABLE}}'>
 
 <TABLE BORDER="0" id="listTableCross" data-src="#DataListCross" ALIGN="center" WIDTH="100%" style="display:none_;">
  <THEAD>
		<TR>
        <TD class="t_hd" WIDTH="1"></TD>
      <!-- BEGIN tHEADER -->
        <TD class="t_hd" FIELD="{{tFIELD}}" style="cursor:pointer" onclick="crossSort(this)" NOWRAP>{{tFIELD_NAME}}</TD>
      <!-- END tHEADER -->
    </TR>
  </THEAD>
  <TBODY>
      <TR ondblclick="TRdbl(this)">
        <TD class="t_td" ALIGN="center" VALIGN="middle" NOWRAP WIDTH=10>
		<div nowrap>
          <INPUT TYPE="hidden" DATAFLD="{{TABLE}}_id">
          <IMG onclick="javascript:el=this.parentNode.firstChild.value;View('{{TABLE}}');" SRC="data:image/gif;base64,R0lGODlhAQABAJH/AP///wAAAMDAwAAAACH5BAEAAAIALAAAAAABAAEAAAICVAEAOw==" class=icon_view TITLE="View Record" style="display:{{iView}};cursor:pointer" HSPACE="1" VSPACE="0" BORDER="0" ALIGN="left">
          <IMG onclick="javascript:el=this.parentNode.firstChild.value;Edit('{{TABLE}}');" SRC="data:image/gif;base64,R0lGODlhAQABAJH/AP///wAAAMDAwAAAACH5BAEAAAIALAAAAAABAAEAAAICVAEAOw==" class=icon_edit TITLE="Edit Record" style="display:{{iEdit}};cursor:pointer" HSPACE="1" VSPACE="0" BORDER="0" ALIGN="left">
          <IMG onclick="javascript:el=this.parentNode.firstChild.value;Delete('{{TABLE}}');" SRC="data:image/gif;base64,R0lGODlhAQABAJH/AP///wAAAMDAwAAAACH5BAEAAAIALAAAAAABAAEAAAICVAEAOw==" class=icon_delete TITLE="Delete Record" style="display:{{iDelete}};cursor:pointer" HSPACE="1" VSPACE="0" BORDER="0" ALIGN="left">
        <!-- BEGIN tAction -->
					{{tTOOL}}
        <!-- END tAction -->
		</div>
		</TD>
        <!-- BEGIN tROW -->
          <TD class="t_td" NOWRAP ALIGN="{{tALIGN}}">{{SPAN}}</TD>
        <!-- END tROW -->
      </TR>
  </TBODY>
</TABLE>
