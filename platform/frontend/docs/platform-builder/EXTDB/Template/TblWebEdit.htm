{{POPUP_BEGIN}}

<script>
	window.dialogWidth = "950px";
</script>

<link href="/Scripts/note/summernote-lite.css" rel="stylesheet">
<script type="text/javascript" src="/Scripts/note/summernote-lite.min.js"></script>

<style>
	td {width:auto; font:menu;}
	th {width:auto; font:menu;}
	input {width:auto; font:menu;}
	select {width:auto; font:menu;}
	table {width:auto; font:menu;}
	div {width:auto; font:menu;}
</style>

<SCRIPT>
	function SetAction(obj){
		obj.action = "default.asp?action=save&table="+obj.table.value+"&param="+obj.param.value;
	}
    function WebTplFileManager(table){
      var obj = new Object; obj.opener = self;
      win = new top.ModalDialog("?action=page&page=WebTplFileManager", obj, "dialogWidth:750px;dialogHeight:500px;center:yes;edge:sunken;help:no;resizable:yes;scroll:no;status:no");
    }
</SCRIPT>

<FORM METHOD="post" ACTION="default.asp" TARGET="actFrame" onfocusout="clearStyle(event.srcElement);" onsubmit="window.returnValue = true;SetAction(this);if(validateForm(this,0,0,0,0)){prepareUpload(this)}else{return false;};" NAME="editForm">
  <INPUT TYPE="hidden" NAME="table" VALUE="ExtDBweb">
  <INPUT TYPE="hidden" NAME="ExtDBweb_ExtDBtbl_id" VALUE="{{ExtDBweb_ExtDBtbl_id}}">
  <INPUT TYPE="hidden" NAME="ExtDBweb_share" VALUE="{{ExtDBweb_share}}">
  <INPUT TYPE="hidden" NAME="ExtDBweb_act" VALUE="1">
  <INPUT TYPE="hidden" NAME="param" VALUE="{{ID}}">

  <TABLE id="listTable" style="width:100%" ALIGN="center" CELLPADDING="2" CELLSPACING="0" BORDER="0" WIDTH="100%">
    <TR>
		<TD class="t_hd" >
			<center>
			<B>Title</B> <INPUT type=text NAME="ExtDBweb_title" TITLE="Title" VALUE="{{ExtDBweb_title}}" ALT='blank'> &nbsp;&nbsp;&nbsp;
			<B>CSS Style</B>
				<select name="ExtDBweb_css" alt="selecti|-1">
					<option value='bootstrap'>Bootstrap</option>
					<option value='ligth'>Light</option>
					<option value='ligth_width'>Light with Full width</option>
				</select>
				<B>Attachments:</B> <select title='File Attachments' NAME=ExtDBweb_files style='width:40px;' ALT="selecti|-1"><option value=0>No</option><option value=1>Yes</option></select>
				<script>
					document.editForm.ExtDBweb_files.value="{{ExtDBweb_files}}";
				</script>
			</center>
		</TD>
    </TR>
    <TR id="customTplRow">
        <TD class="t_td"><textarea id=ExtDBweb_tpl name="ExtDBweb_tpl">{{ExtDBweb_tpl}}</textarea></TD>
    </TR>
    <TR>
      <TD ALIGN="center">
		<div style='text-align:left;'>
			<li>Use '203' type as READONLY field
		</div>
		<p></p>
        <INPUT ID=Btn class='btn btn-success' TYPE="submit" VALUE="Submit" NAME="submit">
       </TD>
    </TR>
  </TABLE>

</FORM>

<style>
.el-rte .toolbar ul li.FIELDS {
    background:url('elements/icon_fieldtype_title.png') no-repeat;
	width:36px;height:12px;
	margin-top:5px;
}
</style>
<script>
	var FIELDS_LIST = "{{FIELDS_LIST}}";
	$("select[name=ExtDBweb_css]").val("{{ExtDBweb_css}}");
	if($('#ExtDBweb_tpl').val()==''){
		var fieldsList = [];
		$.each(FIELDS_LIST.split('^'),function(index, value){
			params = value.split('~');
			fieldsList.push( "<p><b>"+params[0]+":</b> " +'<input value="[['+params[0]+'~'+params[1]+'~'+params[2]+'~'+params[4]+']]"/></p>' );
		});
		$('#ExtDBweb_tpl').val( fieldsList.join('') );
	}
	$(function() {
		$('#ExtDBweb_tpl').summernote({height: 250});
	});
	function doSelection(){}
</script>

{{POPUP_END}}
