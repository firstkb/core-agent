<SCRIPT LANGUAGE="JavaScript">
	var cdate = new Date().getTime();
	var dl = [];
	$( document ).ready(function() {
		$('#ReportResult').append( $('#page_tpl').html().replace(/CURPAGE/gi,"1") );
		dl['dl_1'] = new jsDataList("osha300CAL.asp?action=list&yearSelect={{TARGET_YEAR}}&PAGESLIST=5", "#listTable1");
		dl['dl_1'].oninit(function(){
			$("#toolbar").append( $("<button type='button' style='float:right' onclick='Export2PDF()'>Export to PDF</button>") );
			init(this);
			if(this.recordset.pPAGES>1){
				for(var p=2;p<=this.recordset.pPAGES;p++){
					$('#ReportResult').append( $("<div class='page_break'>&nbsp;</div>") );
					$('#ReportResult').append( $('#page_tpl').html().replace(/CURPAGE/gi,p) );
				}
				for(var p=2;p<=this.recordset.pPAGES;p++){
					dl['dl_'+p] = new jsDataList("osha300CAL.asp?action=list&yearSelect={{TARGET_YEAR}}&PAGESLIST=5&pPageCurrent="+p, "#listTable"+p);
					dl['dl_'+p].oninit(function(){
						init(this);
					});
				}
			}
		});
	});		

  function init(obj){
		var pPAGES = parseInt(obj.recordset.pPAGES);
		var pPAGE  = parseInt(obj.recordset.pPAGE);
		$(obj.target).find('.pageInfo').text(pPAGE);
		$(obj.target).find('.pagesInfo').text(pPAGES);
  
		var G = 0;
		var H = 0;
		var I = 0;
		var J = 0;
  		var K = 0;
  		var L = 0;
  		var M1 = 0;
  		var M2 = 0;
  		var M3 = 0;
  		var M4 = 0;
  		var M5 = 0;
  		var M6 = 0;
		obj.recordset.MoveFirst();
      for ( i=1;i<=obj.recordset.recordCount;i++) {
        
		if ( obj.recordset.Fields("fatal")=="x" ) {
			G += 1;
			obj.recordset.setFields("return","");
			obj.recordset.setFields("d31","");
			obj.recordset.setFields("severity","");
		}else{
			if ( obj.recordset.Fields("return")=="x" ) {
				H += 1;
				obj.recordset.setFields("d31","");
				obj.recordset.setFields("severity","");
			}else{
				if ( obj.recordset.Fields("d31")=="x" ) {
					I += 1;
					obj.recordset.setFields("severity","");
				}else{
					if ( obj.recordset.Fields("severity")=="x" ) {
						J += 1; obj.recordset.setFields("away",0);
					}
				}
			
			}
		}
		
        if ( obj.recordset.Fields("M1")=="x" ) {M1 += 1;}
        if ( obj.recordset.Fields("M2")=="x" ) {M2 += 1;}
        if ( obj.recordset.Fields("M3")=="x" ) {M3 += 1;}
        if ( obj.recordset.Fields("M4")=="x" ) {M4 += 1;}
        if ( obj.recordset.Fields("M5")=="x" ) {M5 += 1;}
        if ( obj.recordset.Fields("M6")=="x" ) {M6 += 1;}
		var max = 180;
		if ( obj.recordset.Fields("away") > 180 ) {
			obj.recordset.setFields("away",180); K += 180; max = 0;
		}else{
			if(obj.recordset.Fields("away")>""){K += parseInt(obj.recordset.Fields("away"));max = 180-parseInt(obj.recordset.Fields("away"));}else{K += 0;max = 180;}
		}
		var transfer = 0;
		if ( obj.recordset.Fields("transfer") > "" ) { 
			transfer = parseInt(obj.recordset.Fields("transfer"));
			if ( transfer > max ) { transfer = max; }
		}
		obj.recordset.setFields("transfer",transfer);L += transfer;
        obj.recordset.MoveNext();
      }
	  
	  $('#s_fatal',$(obj.target)).html( G );
	  $('#s_return',$(obj.target)).html( H );
	  $('#s_I',$(obj.target)).html( I );
	  $('#s_J',$(obj.target)).html( J );
	  $('#s_K',$(obj.target)).html( K );
	  $('#s_L',$(obj.target)).html( L );
	  $('#s_M1',$(obj.target)).html( M1 );
	  $('#s_M2',$(obj.target)).html( M2 );
	  $('#s_M3',$(obj.target)).html( M3 );
	  $('#s_M4',$(obj.target)).html( M4 );
	  $('#s_M5',$(obj.target)).html( M5 );
	  $('#s_M6',$(obj.target)).html( M6 );
  }
</SCRIPT>
