<script>
	var DataListSurvey[[FLD]];
</script>

<TABLE id="listTableSurvey[[FLD]]" data-src="#DataListSurvey[[FLD]]" style="width:100%;display:none_;" ALIGN="center" class='table table-striped table-bordered'>
	<THEAD>
		<TR>
			<Td class=hd ALIGN=center WIDTH="80%"><B>Item</B></Td>
			<Td class=hd ALIGN=center WIDTH="15%"><B>Answer</B></Td>
			<Td class=hd ALIGN=right WIDTH="5%">&nbsp;</Td>
		</TR>
	</THEAD>
	<TBODY>
		<TR class='survItems'>
			<TD class=td ALIGN=left>
				<input type=hidden DATAFLD="ExtDBsrv_id" NAME="ExtDBsrv_id">
				<input type=hidden NAME="ExtDBsrv_table" VALUE="[[TBL]]surv[[FLD]]">
				<input type=hidden DATAFLD="[[TBL]]surv[[FLD]]_id" NAME="[[TBL]]surv[[FLD]]_id">
				<DIV DATAFLD="ExtDBsrv_title" nowrap></DIV>
			</TD>
			<TD class='td place001' ALIGN=left></TD>
			<SCRIPT language="JavaScript">
				if(arrSurvey[[FLD]]){
					//CS@Yes~pass|No~fail^Of^Of>>new~item 1^new~item 2^new~item 3
					var cfg = arrSurvey[[FLD]].split('^');
					var variant = cfg[0].split('@')[0];
					var list = "";
					switch (variant) {
						case "YN":
							list = "<option value='Yes'>Yes</option><option value='No'>No</option>"
							break;
						case "OC":
							list = "<option value='Open'>Open</option><option value='Closed'>Closed</option>"
							break;
						case "OF":
							list = "<option value='On'>On</option><option value='Off'>Off</option>"
							break;
						case "CS":
							var variant = cfg[0].split('@')[1].split('|');
							for(rec in variant){
								var param = variant[rec];
								list = list + "<option value=\""+param.split('~')[0]+"\">"+param.split('~')[0]+"</option>";
							}
							break;
					}						
					$('.place001',"#listTableSurvey[[FLD]]").append("<select DATAFLD='[[TBL]]surv[[FLD]]_answer' name='[[TBL]]surv[[FLD]]_answer' style='width:auto;'><option value=''></option>"+list+"</select>");
				}
			</SCRIPT>
			<TD class='td place002' ALIGN=right></TD>
			<SCRIPT language="JavaScript">
				if(arrSurvey[[FLD]]){
					//CS@Yes~pass|No~fail^Of^Of>>new~item 1^new~item 2^new~item 3
					var cfg = arrSurvey[[FLD]].split('>>')[0];
					var p_files = cfg.split('^')[1];
					var p_notes = cfg.split('^')[2];
					if(p_notes=='On'){
						$('.place002',"#listTableSurvey[[FLD]]").append("<IMG title='Edit Notes' onclick='surv_notes(this);' SRC='data:image/gif;base64,R0lGODlhAQABAJH/AP///wAAAMDAwAAAACH5BAEAAAIALAAAAAABAAEAAAICVAEAOw==' class=icon_edit HSPACE='1' VSPACE='0' BORDER='0' ALIGN='left'>");
					}
					if(p_files=='On'){
						$('.place002',"#listTableSurvey[[FLD]]").append("<IMG title='Attach Files' onclick='surv_files(this);' SRC='data:image/gif;base64,R0lGODlhAQABAJH/AP///wAAAMDAwAAAACH5BAEAAAIALAAAAAABAAEAAAICVAEAOw==' class=icon_fm HSPACE='1' VSPACE='0' BORDER='0' ALIGN='left'>");
					}
				}
			</SCRIPT>
		</TR>
	</TBODY>
</TABLE>
	<SCRIPT language="JavaScript">
		if(arrSurvey[[FLD]]){
			//CS@Yes~pass|No~fail^Of^Of>>new~item 1^new~item 2^new~item 3
			var cfg = arrSurvey[[FLD]].split('>>')[0];
			var p_files = cfg.split('^')[1];
			var p_notes = cfg.split('^')[2];
			if(p_notes=='On'){
				$('tbody',"#listTableSurvey[[FLD]]").append("<TR class=survNotes style='display:none;'><TD width='100%' colspan=3 align=right><div class='notesDialog'><input type=hidden DATAFLD='ExtDBsrv_id' id='ExtDBsrv_id'><b>Notes:</b><textarea datafdl=[[TBL]]surv[[FLD]]_notes name=[[TBL]]surv[[FLD]]_notes></textarea></div></TD></TR>");
			}else{
				$('tbody',"#listTableSurvey[[FLD]]").append("<TR class=survNotes style='display:none;'><TD width='100%' colspan=3 align=right><input type=hidden DATAFLD='ExtDBsrv_id' id='ExtDBsrv_id'><input type=hidden datafdl=[[TBL]]surv[[FLD]]_notes name=[[TBL]]surv[[FLD]]_notes></TD></TR>");
			}
			if(p_files=='On'){
				$('tbody',"#listTableSurvey[[FLD]]").append("<TR class=survFiles style='display:none;'><TD width='100%' colspan=3 align=right><input type=hidden DATAFLD='ExtDBsrv_id' id='ExtDBsrv_id'><div class='filesDialog'><b>Attach Files:</b><br/><a onclick='viewSurvFiles(this)'  href='javascript:void(0);' style='color:navy'><b>Files List</b></a><a  href='javascript:void(0);' class='button'><span class='icon icon3'></span></a><br/></div></TD></TR>");
			}
		}
	</SCRIPT>
</DIV>
<SCRIPT language="JavaScript">
	if("[[FLD]]">""){
		DataListSurvey[[FLD]] = new jsDataList("default.asp?action=list&table=ExtDBsrv&param=[[ID]]&srv=[[FLD]]&tbl=[[TBL]]", "#listTableSurvey[[FLD]]");
	}
	$(".filesDialog a.button").on("click",function(){
		var item = $(this).parent("div").parent("td").find("input[id=ExtDBsrv_id]").val();
		$(this).parent("div").append($("<input type=hidden name='[[TBL]]surv[[FLD]]_files[srv]' value='[[FLD]]'>"));
		$(this).parent("div").append($("<input type=hidden name='[[TBL]]surv[[FLD]]_files[item]' value='"+item+"'>"));
		$(this).parent("div").append($("<input type=file class=files name=[[TBL]]surv[[FLD]]_files>"));
	})
	function viewSurvFiles(obj){
		var item = $(obj).closest("td").find("input[id=ExtDBsrv_id]").val();
		var win = openWin(800,550,"default.asp?action=page&page=SurvFiles&param={{ID}}&tbl=[[TBL]]&srv=[[FLD]]&item="+item);
	}
	function surv_files(obj){
		var id = $("#listTableSurvey[[FLD]] tr.survItems").index($(obj).parent("td").parent("tr")); 
		var tr = $("#listTableSurvey[[FLD]] tr.survFiles:eq("+id+")").toggle();
	}
	function surv_notes(obj){
		var id = $("#listTableSurvey[[FLD]] tr.survItems").index($(obj).parent("td").parent("tr")); 
		var tr = $("#listTableSurvey[[FLD]] tr.survNotes:eq("+id+")").toggle();
	}
</SCRIPT>
