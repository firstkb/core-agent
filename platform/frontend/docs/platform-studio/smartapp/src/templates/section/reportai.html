<style>
    /* ====== Общий контейнер отчёта ====== */
    #report-root {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 150px) !important;
        min-height: 300px;
        font-size: 0.95rem;
        /* чуть крупнее общий текст */
    }

    #report-root>.card-body {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding: 1.25rem 1.5rem;
    }

    /* ====== Smart Reports page ====== */
    .dq-page {
        display: flex;
        flex-direction: column;
        height: 100%;
        gap: 0.75rem;
    }

    .dq-card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.75rem;
    }

    .dq-card-title-wrap {
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
    }

    .dq-title-main {
        font-size: 1.2rem;
        font-weight: 600;
        color: var(--bs-text-primary);
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
    }

    .dq-title-main i {
        opacity: .8;
    }

    .dq-subtitle {
        font-size: 0.9rem;
        color: var(--bs-gray-600);
    }

    .dq-status {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.35rem 0.9rem;
        border-radius: 50rem;
        font-size: 0.8rem;
        font-weight: 500;
        border: 1px dashed rgba(25, 135, 84, .4);
        background: rgba(25, 135, 84, .04);
        color: var(--bs-success);
        white-space: nowrap;
    }

    .dq-status-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--bs-success);
        box-shadow: 0 0 0 0 rgba(25, 135, 84, .45);
        animation: dq-pulse 1.6s infinite;
    }

    @keyframes dq-pulse {
        0% {
            box-shadow: 0 0 0 0 rgba(25, 135, 84, .45);
        }

        70% {
            box-shadow: 0 0 0 8px rgba(25, 135, 84, 0);
        }

        100% {
            box-shadow: 0 0 0 0 rgba(25, 135, 84, 0);
        }
    }

    /* ====== Основной layout ====== */
    .dq-layout {
        position: relative;
        display: flex;
        flex: 1 1 auto;
        min-height: 0;
        gap: 1rem;
    }

    /* ====== Левая колонка (список чатов) ====== */
    .dq-sidebar {
        width: 280px;
        max-width: 100%;
        border-radius: 1rem;
        border: 1px solid var(--bs-border-color);
        background: var(--bs-body-bg);
        padding: 0.75rem 0.75rem 0.5rem;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        overflow: hidden;
        background: var(--bs-secondary);
        box-shadow: 0 18px 45px rgba(15, 23, 42, .08);
    }

    .dq-sidebar-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.35rem;
        font-size: 0.8rem;
        font-weight: 600;
        padding: 0 .25rem 0.25rem;
    }

    .dq-sidebar-header span {
        /*text-transform: uppercase;*/
        letter-spacing: .06em;
    }

    .dq-chat-list {
        flex: 1 1 auto;
        overflow-y: auto;
        padding-right: 0.25rem;
        padding-top: 0.35rem;
        padding-bottom: 0.35rem;
    }

    .dq-chat-list-empty {
        font-size: 0.85rem;
        color: var(--bs-gray-600);
        padding: 0.5rem 0.25rem;
    }

    .dq-chat-item {
        width: 100%;
        border: 0;
        background: transparent;
        border-radius: 0.75rem;
        padding: 0.55rem 0.7rem;
        margin-bottom: 0.25rem;
        /* больше воздуха между чатами */
        text-align: left;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        transition:
            background 0.12s ease,
            transform 0.08s ease,
            box-shadow 0.12s ease,
            color 0.12s ease;
        color: var(--bs-gray-800);
    }

    .dq-chat-item:hover {
        background: var(--bs-gray-100);
        transform: translateY(-1px);
        box-shadow: none;
        /* убираем тень */
        color: var(--bs-gray-900);
    }

    .dq-chat-item--active {
        background: rgba(var(--bs-primary-rgb, 13, 110, 253), .08);
        border: 1px solid rgba(var(--bs-primary-rgb, 13, 110, 253), .35);
        color: var(--bs-primary);
        box-shadow: none;
    }

    .dq-chat-item--active:hover {
        background: rgba(var(--bs-primary-rgb, 13, 110, 253), .12);
        color: var(--bs-primary);
    }

    .dq-chat-item-title {
        font-size: 0.9rem;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 235px;
    }

    .dq-chat-item-meta {
        font-size: 0.8rem;
        opacity: 0.75;
        margin-top: 0.15rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* ====== Правая колонка (чат) ====== */
    .dq-chat {
        flex: 1 1 auto;
        min-width: 0;
        border-radius: 1rem;
        border: 1px solid var(--bs-border-color);
        background: var(--bs-body-bg);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: none;
        box-shadow: 0 18px 45px rgba(15, 23, 42, .08);
    }

    .dq-chat-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.75rem 1rem;
        background: var(--bs-card-bg);
        border-bottom: 1px solid var(--bs-border-color);
    }

    .dq-chat-header-main {
        display: flex;
        align-items: center;
        gap: 0.6rem;
    }

    .dq-chat-avatar {
        width: 32px;
        height: 32px;
        border-radius: 999px;
        background: var(--bs-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.95rem;
        font-weight: 600;
        color: #ffffff;
        box-shadow: 0 0 0 4px rgba(53, 92, 153, .15);
    }

    .dq-chat-header-titles {
        display: flex;
        flex-direction: column;
        gap: 0.1rem;
    }

    .dq-chat-name {
        font-size: 1rem;
        font-weight: 600;
        color: var(--bs-text-primary);
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
    }

    .dq-chat-desc {
        font-size: 0.8rem;
        color: var(--bs-gray-600);
    }

    .dq-chat-actions {
        display: flex;
        gap: 0.4rem;
        align-items: center;
    }

    .dq-burger {
        display: none;
        border: none;
        background: var(--bs-gray-100);
        border-radius: 999px;
        width: 32px;
        height: 32px;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background 0.12s ease, transform 0.08s ease;
    }

    .dq-burger:hover {
        background: var(--bs-gray-200);
        transform: translateY(-1px);
    }

    .dq-burger span {
        font-size: 1.1rem;
        line-height: 1;
    }

    .dq-main-content {
        display: flex;
        flex-direction: column;
        flex: 1 1 auto;
        min-height: 0;
        position: relative;
    }

    .dq-messages {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 0.9rem 1rem 0.5rem;
        /* Prevent width jumps when scrollbar appears/disappears (charts may resize/reanimate) */
        scrollbar-gutter: stable;
        /* leave room for floating typing indicator */
        padding-bottom: 2.4rem;
    }

    .dq-input {
        display: flex;
        gap: 0.65rem;
        padding: 0.65rem 1rem 0.75rem;
        background: var(--bs-card-bg);
        border-top: 1px solid var(--bs-border-color);
    }

    .dq-textarea {
        flex: 1;
        resize: none;
        border-radius: 0.75rem;
        border: 1px solid var(--bs-border-color);
        padding: 0.6rem 0.75rem;
        font-size: 0.85rem;
        /* + */
        min-height: 52px;
        max-height: 160px;
        outline: none;
        background: var(--bs-body-bg);
        color: var(--bs-text-primary);
    }

    .dq-textarea::placeholder {
        color: var(--bs-gray-500);
    }

    .dq-textarea:focus {
        border-color: var(--bs-primary);
    }

    /* ====== Пустое состояние ====== */
    .dq-empty-state {
        flex: 1 1 auto;
        padding: 2rem 1.5rem 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .dq-empty-title {
        font-size: 1.05rem;
        font-weight: 600;
        margin-bottom: 0.2rem;
        color: var(--bs-text-primary);
    }

    .dq-empty-text {
        font-size: 0.85rem;
        color: var(--bs-gray-600);
        max-width: 380px;
    }

    .dq-empty-input-wrap {
        width: 100%;
        max-width: 520px;
        display: flex;
        gap: 0.6rem;
        margin-top: 0.4rem;
    }

    .dq-empty-input-wrap textarea {
        flex: 1;
    }

    /* ====== Кнопки ====== */
    .dq-send-btn .dq-send-icon {
        font-size: 0.7rem;
        transform: translateY(1px);
    }

    /* ====== Сообщения ====== */
    .chat-message {
        margin-bottom: 0.65rem;
        display: flex;
    }

    .chat-message-inner-wrap {
        max-width: 80%;
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
    }

    .chat-message-assistant .chat-message-inner-wrap {
        max-width: 100%;
    }

    .chat-message-inner {
        padding: 0.5rem 0.8rem;
        border-radius: 0.9rem;
        font-size: 0.85rem;
        /* + */
        white-space: pre-wrap;
        word-wrap: break-word;
    }

    .chat-message-user {
        justify-content: flex-end;
    }

    .chat-message-user .chat-message-inner {
        background: var(--bs-secondary);
        color: var(--bs-text-primary);
        border-bottom-right-radius: 0.35rem;
    }

    .chat-message-assistant {
        justify-content: flex-start;
    }

    .chat-message-assistant .chat-message-inner {
        color: var(--bs-text-primary);
        border-bottom-left-radius: 0.35rem;
        padding: 0;
    }

    .chat-message-meta {
        font-size: 0.7rem;
        color: var(--bs-gray-500);
    }

    /* ====== typing indicator ====== */
    .dq-typing {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.25rem 1rem 0.6rem;
        font-size: 0.8rem;
        color: var(--bs-gray-600);
        background: transparent;
        /* Do not affect layout (reduces chart "twitch" on send) */
        position: absolute;
        left: 0;
        right: 0;
        bottom: 72px;
        /* above input area */
        pointer-events: none;
    }

    .dq-typing-dots {
        display: inline-flex;
        gap: 0.2rem;
    }

    .dq-typing-dot {
        width: 4px;
        height: 4px;
        border-radius: 999px;
        background: var(--bs-gray-500);
        animation: dq-bounce 1s infinite;
    }

    .dq-typing-dot:nth-child(2) {
        animation-delay: 0.15s;
    }

    .dq-typing-dot:nth-child(3) {
        animation-delay: 0.3s;
    }

    /* Chat-friendly table container */
    .dq-table-scroll {
        max-height: 280px;
        /* можно 240-320, под вкус */
        overflow: auto;
        /* и X и Y */
        border: 1px solid rgba(0, 0, 0, .06);
        border-radius: 10px;
        background: #fff;
    }

    /* Dark theme tweaks for tables */
    html[data-bs-theme="dark"] .dq-table-scroll,
    body[data-bs-theme="dark"] .dq-table-scroll {
        background: rgba(17, 24, 39, .65);
        border-color: rgba(255, 255, 255, .10);
    }

    html[data-bs-theme="dark"] .dq-table-scroll .table,
    body[data-bs-theme="dark"] .dq-table-scroll .table {
        color: var(--bs-body-color);
    }

    html[data-bs-theme="dark"] .dq-table-scroll .table thead th,
    body[data-bs-theme="dark"] .dq-table-scroll .table thead th {
        color: rgba(255, 255, 255, .82);
        background: rgba(255, 255, 255, .04);
        border-bottom-color: rgba(255, 255, 255, .10);
    }

    html[data-bs-theme="dark"] .dq-table-scroll .table th,
    html[data-bs-theme="dark"] .dq-table-scroll .table td,
    body[data-bs-theme="dark"] .dq-table-scroll .table th,
    body[data-bs-theme="dark"] .dq-table-scroll .table td {
        color: var(--bs-body-color);
    }

    html[data-bs-theme="dark"] .dq-table-scroll .table tbody tr,
    body[data-bs-theme="dark"] .dq-table-scroll .table tbody tr {
        border-bottom: 1px dashed rgba(255, 255, 255, .10);
    }

    /* Group header row (rendered with bg-light/text-primary) - override for dark */
    html[data-bs-theme="dark"] .dq-table-scroll .table-group-row td,
    body[data-bs-theme="dark"] .dq-table-scroll .table-group-row td {
        background: rgba(59, 130, 246, .14) !important;
        color: rgba(191, 219, 254, .95) !important;
        border-bottom: 1px solid rgba(255, 255, 255, .08);
    }

    html[data-bs-theme="dark"] .dq-table-scroll .table-group-row .badge,
    body[data-bs-theme="dark"] .dq-table-scroll .table-group-row .badge {
        background: rgba(255, 255, 255, .07) !important;
        border-color: rgba(255, 255, 255, .12) !important;
        color: rgba(255, 255, 255, .85) !important;
    }

    /* Compact look */
    .dq-table-scroll .table {
        margin-bottom: 0;
    }

    /* Smaller font & tighter padding */
    .dq-table-scroll .table th,
    .dq-table-scroll .table td {
        padding: 0.35rem 0.5rem !important;
        /* компактнее */
        font-size: 0.8525rem;
        /* ~13px */
        line-height: 1.2;
        vertical-align: top;
    }

    /* Header чуть читабельнее */
    .dq-table-scroll .table thead th {
        font-weight: 600;
        white-space: nowrap;
    }

    /* Чтобы широкие таблицы не ломали чат */
    .dq-table-scroll .table td {
        white-space: nowrap;
        /* можно убрать, если хочешь переносы */
    }

    /* Опционально: тонкие разделители */
    .dq-table-scroll .table tbody tr {
        border-bottom: 1px dashed rgba(0, 0, 0, .06);
    }

    @keyframes dq-bounce {

        0%,
        80%,
        100% {
            transform: translateY(0);
            opacity: .4;
        }

        40% {
            transform: translateY(-3px);
            opacity: 1;
        }
    }

    /* ====== Мобильный сайдбар ====== */
    .dq-sidebar-backdrop {
        display: none;
    }

    @media (max-width: 991.98px) {
        .dq-layout {
            flex-direction: column;
        }

        /* делаем как offcanvas поверх всего, чтобы точно появлялся */
        .dq-sidebar {
            position: fixed;
            top: 72px;
            left: 0.75rem;
            right: 0.75rem;
            bottom: 0.75rem;
            max-width: none;
            max-height: calc(100vh - 96px);
            z-index: 1050;
            transform: translateX(-110%);
            opacity: 0;
            pointer-events: none;
            transition:
                transform .18s ease,
                opacity .18s ease;
        }

        .dq-sidebar.is-open {
            transform: translateX(0);
            opacity: 1;
            pointer-events: auto;
        }

        .dq-sidebar-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, .35);
            opacity: 0;
            pointer-events: none;
            transition: opacity .18s ease;
            display: block;
            z-index: 1040;
        }

        .dq-sidebar-backdrop.is-active {
            opacity: 1;
            pointer-events: auto;
        }

        .dq-burger {
            display: inline-flex;
        }
    }

    @media (max-width: 575.98px) {
        .dq-card-header {
            flex-direction: column;
            align-items: flex-start;
            gap: 0.5rem;
        }

        .dq-status {
            align-self: flex-start;
        }

        .dq-status {
            padding: 4px;
        }

        .dq-status span:nth-child(2) {
            display: none;
        }
    }

    .dq-sidebar-header {
        border-bottom: 1px solid rgba(15, 23, 42, .05);
    }

    .dq-sidebar {
        background: var(--bs-light);
    }

    .dq-chat-item--active {
        position: relative;
        padding-left: 0.9rem;
    }

    /* ====== Query meta (table/chart header) ====== */
    .dq-qmeta {
        border: 1px solid rgba(15, 23, 42, .08);
        background: rgba(248, 250, 252, .9);
        border-radius: 12px;
        padding: 0.65rem 0.75rem;
        margin-bottom: 0.6rem;
    }

    .dq-qmeta summary {
        cursor: pointer;
        list-style: none;
        display: flex;
        align-items: center;
        gap: .5rem;
        font-weight: 600;
        color: rgba(15, 23, 42, .8);
        user-select: none;
    }

    .dq-qmeta summary::-webkit-details-marker {
        display: none;
    }

    .dq-qmeta .dq-qmeta-hint {
        font-weight: 500;
        color: rgba(15, 23, 42, .55);
    }

    .dq-qmeta-grid {
        margin-top: .6rem;
        display: grid;
        grid-template-columns: 1fr;
        gap: .35rem;
    }

    @media (min-width: 768px) {
        .dq-qmeta-grid {
            grid-template-columns: 1fr 1fr;
            gap: .45rem .75rem;
        }
    }

    .dq-qmeta-kv {
        display: flex;
        gap: .5rem;
        align-items: baseline;
        min-width: 0;
    }

    .dq-qmeta-k {
        flex: 0 0 auto;
        font-size: .85rem;
        color: rgba(15, 23, 42, .55);
    }

    .dq-qmeta-v {
        flex: 1 1 auto;
        min-width: 0;
        font-size: .9rem;
        color: rgba(15, 23, 42, .85);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .dq-qmeta-list {
        margin: .35rem 0 0;
        padding-left: 1.1rem;
    }

    .dq-qmeta-list li {
        margin: .15rem 0;
        color: rgba(15, 23, 42, .85);
    }

    .dq-qmeta-badges .badge {
        border: 1px solid rgba(15, 23, 42, .12);
        background: rgba(255, 255, 255, .85);
        color: rgba(15, 23, 42, .8);
        font-weight: 600;
    }

    /* Dark theme tweaks for query meta block */
    html[data-bs-theme="dark"] .dq-qmeta,
    body[data-bs-theme="dark"] .dq-qmeta {
        background: rgba(17, 24, 39, .55);
        border-color: rgba(255, 255, 255, .12);
    }

    html[data-bs-theme="dark"] .dq-qmeta summary,
    body[data-bs-theme="dark"] .dq-qmeta summary {
        color: rgba(255, 255, 255, .88);
    }

    html[data-bs-theme="dark"] .dq-qmeta .dq-qmeta-hint,
    body[data-bs-theme="dark"] .dq-qmeta .dq-qmeta-hint {
        color: rgba(255, 255, 255, .70);
    }

    html[data-bs-theme="dark"] .dq-qmeta-k,
    body[data-bs-theme="dark"] .dq-qmeta-k {
        color: rgba(255, 255, 255, .65);
    }

    html[data-bs-theme="dark"] .dq-qmeta-v,
    body[data-bs-theme="dark"] .dq-qmeta-v {
        color: rgba(255, 255, 255, .88);
    }

    html[data-bs-theme="dark"] .dq-qmeta-list li,
    body[data-bs-theme="dark"] .dq-qmeta-list li {
        color: rgba(255, 255, 255, .88);
    }

    html[data-bs-theme="dark"] .dq-qmeta summary .badge,
    html[data-bs-theme="dark"] .dq-qmeta-badges .badge,
    body[data-bs-theme="dark"] .dq-qmeta summary .badge,
    body[data-bs-theme="dark"] .dq-qmeta-badges .badge {
        border-color: rgba(255, 255, 255, .14);
        background: rgba(255, 255, 255, .08);
        color: rgba(255, 255, 255, .88);
    }
</style>

<div id="report-root" class=" card-flush border-0">
    <div class="dq-page">

        <div id="chat-layout" class="dq-layout">
            <div id="chat-sidebar-backdrop" class="dq-sidebar-backdrop"></div>

            <aside id="chat-sidebar" class="dq-sidebar">
                <div class="dq-sidebar-header fw-bold">
                    <span style="color: var(--bs-gray-600);">CHATS</span>
                    <button id="chat-main-new" type="button" class="btn btn-link btn-sm btn-text-blue fw-semibold">
                        <i class="fa fa-plus-square me-1"></i>
                        <span>New chat</span>
                    </button>
                </div>
                <div id="chat-list" class="dq-chat-list">
                    <div class="dq-chat-list-empty">
                        Loading chats…
                    </div>
                </div>
            </aside>

            <section id="chat-main" class="dq-chat">
                <div class="dq-chat-header">
                    <div class="dq-chat-header-main">
                        <button id="chat-sidebar-toggle" type="button" class="dq-burger">
                            <span class="fs-1">☰</span>
                        </button>
                        <div class="dq-chat-avatar">AI</div>
                        <div class="dq-chat-header-titles">
                            <div id="chat-current-title" class="dq-chat-name">
                                New conversation
                            </div>
                            <!--<div id="chat-current-subtitle" class="dq-chat-desc">
                                    Try asking: “Show SOR count by status for this month”.
                                </div>-->
                        </div>
                    </div>
                    <div class="dq-chat-actions">
                        <div class="dq-status">
                            <span class="dq-status-dot"></span>
                            <span>Assistant is ready</span>
                        </div>
                    </div>
                </div>

                <div id="chat-empty" class="dq-empty-state">
                    <div>
                        <div class="dq-empty-title">
                            Start a conversation with Smart Reports
                        </div>
                        <div class="dq-empty-text">
                            Ask about SOR, inspections, incidents, or anything else.
                        </div>
                    </div>
                    <div class="dq-empty-input-wrap">
                        <textarea id="chat-empty-input" class="dq-textarea"
                            placeholder="Example: Show SOR count by status for this month"></textarea>
                        <button id="chat-empty-send" type="button" class="btn btn-sm btn-primary dq-send-btn">
                            <span class="dq-send-icon">➤</span>
                            <span>Send</span>
                        </button>
                    </div>
                </div>

                <div id="chat-main-content" class="dq-main-content d-none">
                    <div id="chat-messages" class="dq-messages"></div>

                    <div id="chat-typing" class="dq-typing d-none">
                        <span class="text-muted">Assistant is thinking...</span>
                        <span class="dq-typing-dots">
                            <span class="dq-typing-dot"></span>
                            <span class="dq-typing-dot"></span>
                            <span class="dq-typing-dot"></span>
                        </span>
                    </div>

                    <form class="dq-input" onsubmit="return false;">
                        <textarea id="chat-input" class="dq-textarea"
                            placeholder="Type your question here..."></textarea>
                        <button id="chat-send" type="button" class="btn btn-sm btn-primary dq-send-btn">
                            <span class="dq-send-icon">➤</span>
                            <span>Send</span>
                        </button>
                    </form>
                </div>
            </section>
        </div>
    </div>

</div>

<script>
    var page = (function () {
        const LAST_CHAT_STORAGE_KEY = 'reportAI:lastChatId';

        let state = {
            chats: [],
            currentChatId: null,
            messages: [],
            isSending: false,
            waitChatId: null,
            waitTimer: null,
            lastUserPrompt: '',
            lastMessageId: 0,
            pollTimer: null,
            pollActive: false,
            pollStep: 0
        };

        let dom = {};

        function $(selector) {
            return window.jQuery(selector);
        }

        // ========= DOM cache =========
        function cacheDom() {
            dom.$root = $('#report-root');
            dom.$layout = $('#chat-layout');
            dom.$sidebar = $('#chat-sidebar');
            dom.$sidebarToggle = $('#chat-sidebar-toggle');
            dom.$sidebarBackdrop = $('#chat-sidebar-backdrop');
            dom.$chatList = $('#chat-list');

            dom.$newChatBtn = $('#chat-new-chat');
            dom.$mainNewBtn = $('#chat-main-new');

            dom.$main = $('#chat-main');
            dom.$emptyState = $('#chat-empty');
            dom.$emptyInput = $('#chat-empty-input');
            dom.$emptySend = $('#chat-empty-send');

            dom.$mainContent = $('#chat-main-content');
            dom.$messages = $('#chat-messages');
            dom.$typing = $('#chat-typing');
            dom.$input = $('#chat-input');
            dom.$sendBtn = $('#chat-send');
            dom.$currentTitle = $('#chat-current-title');
            dom.$currentSubtitle = $('#chat-current-subtitle');
        }

        // ========= helpers =========
        function bindEvents() {
            $(window).on('resize.report_ai', resizeLayout);

            dom.$sidebarToggle.on('click', toggleSidebarMobile);
            dom.$sidebarBackdrop.on('click', closeSidebarMobile);

            dom.$chatList.on('click', '.js-chat-item', onChatClick);

            dom.$newChatBtn.on('click', resetToNewChat);
            dom.$mainNewBtn.on('click', resetToNewChat);

            dom.$emptySend.on('click', function () {
                let text = dom.$emptyInput.val().trim();
                if (!text) return;
                startNewChatWithFirstMessage(text);
            });

            dom.$emptyInput.on('keydown', function (e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    dom.$emptySend.click();
                }
            });

            dom.$sendBtn.on('click', onSendMessage);
            dom.$input.on('keydown', function (e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    onSendMessage();
                }
            });

            // Action buttons (choose project)
            $(document).on('click', '.js-action-choose', onActionChoose);
            // Retry buttons (timeout)
            $(document).on('click', '.js-retry-send', onRetrySend);
        }

        function unbindEvents() {
            $(window).off('resize.report_ai');
            $(document).off('.report_ai');
        }

        function resizeLayout() {
            if (!dom.$root || !dom.$root.length) return;
            const rect = dom.$root[0].getBoundingClientRect();
            const viewportH = window.innerHeight || document.documentElement.clientHeight;
            const targetH = Math.max(420, viewportH - rect.top - 16);
            dom.$root.css('height', targetH + 'px');

            // when switching to desktop, close the mobile offcanvas
            const isDesktop = window.matchMedia('(min-width: 992px)').matches;
            if (isDesktop) {
                closeSidebarMobile();
            }
        }

        function toggleSidebarMobile() {
            dom.$sidebar.addClass('is-open');
            dom.$sidebarBackdrop.addClass('is-active');
        }

        function closeSidebarMobile() {
            dom.$sidebar.removeClass('is-open');
            dom.$sidebarBackdrop.removeClass('is-active');
        }

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function cssVar(name) {
            try {
                return String(getComputedStyle(document.documentElement).getPropertyValue(name) || '').trim();
            } catch (_) {
                return '';
            }
        }

        function isDarkCssColor(color) {
            const c = String(color || '').trim();
            if (!c) return false;

            // rgb/rgba
            const m = c.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/i);
            if (m) {
                const r = Number(m[1]), g = Number(m[2]), b = Number(m[3]);
                const luminance = 0.2126 * r + 0.7152 * g + 0.0722 * b;
                return luminance < 128;
            }

            // hex #rgb or #rrggbb
            if (c[0] === '#') {
                let hex = c.slice(1);
                if (hex.length === 3) {
                    hex = hex.split('').map(ch => ch + ch).join('');
                }
                if (hex.length === 6) {
                    const r = parseInt(hex.slice(0, 2), 16);
                    const g = parseInt(hex.slice(2, 4), 16);
                    const b = parseInt(hex.slice(4, 6), 16);
                    const luminance = 0.2126 * r + 0.7152 * g + 0.0722 * b;
                    return luminance < 128;
                }
            }

            return false;
        }

        function isDarkTheme() {
            // Bootstrap 5 preferred attribute
            try {
                const attr = (document.documentElement && document.documentElement.getAttribute)
                    ? (document.documentElement.getAttribute('data-bs-theme') || document.documentElement.getAttribute('data-theme') || '')
                    : '';
                if (String(attr).toLowerCase() === 'dark') return true;
                if (String(attr).toLowerCase() === 'light') return false;
            } catch (_) { }

            // Heuristic: prefer --bs-body-bg (more reliable than container background)
            try {
                const bgVar = cssVar('--bs-body-bg');
                if (bgVar) return isDarkCssColor(bgVar);
            } catch (_) { }

            // Fallback: body background brightness
            try {
                const bg = getComputedStyle(document.body).backgroundColor || '';
                return isDarkCssColor(bg);
            } catch (_) { }

            return false;
        }

        // ========= Query meta (table/chart) =========
        function getQuerySpecObj(m) {
            if (!m) return null;
            let qs = m.querySpec || m.query_spec || null;
            if (!qs && m.content && typeof m.content === 'object' && (m.type || '').toLowerCase() === 'query_spec') {
                qs = m.content;
            }
            if (typeof qs === 'string') {
                try { qs = JSON.parse(qs); } catch (_) { qs = null; }
            }
            if (!qs || typeof qs !== 'object') return null;
            return qs;
        }

        function normalizeFilterList(filters) {
            if (!filters) return [];
            if (Array.isArray(filters)) return filters;
            if (typeof filters === 'object') return [filters];
            return [];
        }

        function normalizeSortList(sort) {
            if (!sort) return [];
            if (Array.isArray(sort)) return sort;
            if (typeof sort === 'object') return [sort];
            return [];
        }

        function getFieldLabelResolver(m) {
            const meta = (m && m.metadata) ? m.metadata : {};
            const t = meta.table || {};
            const c = meta.chart || {};
            const q = meta.query || {};

            const tableCols = Array.isArray(t.columns) ? t.columns : [];
            const colLabel = {};
            tableCols.forEach(function (col) {
                if (!col) return;
                const k = col.key || col.name || '';
                if (!k) return;
                colLabel[String(k)] = col.label || col.key || col.name || String(k);
            });

            const chartLabels = (c && typeof c.labels === 'object') ? c.labels : {};
            const queryLabels = (q && typeof q.fieldLabels === 'object') ? q.fieldLabels : {};

            return function (field) {
                const f = String(field || '').trim();
                if (!f) return '';
                if (colLabel[f]) return colLabel[f];
                if (chartLabels[f]) return chartLabels[f];
                if (queryLabels[f]) return queryLabels[f];
                return f;
            };
        }

        function formatOpEn(op, value) {
            const o = String(op || '').toLowerCase().trim();
            if (o === 'eq' || o === '=') return '=';
            if (o === 'neq' || o === '!=') return '≠';
            if (o === 'gte') return '≥';
            if (o === 'lte') return '≤';
            if (o === 'between') return 'between';
            if (o === 'in') return 'in';
            if (o === 'like') {
                // show "contains" when value uses %...%
                if (typeof value === 'string' && value.indexOf('%') !== -1) return 'contains';
                return 'like';
            }
            if (o === 'unknown_reference') return 'unknown';
            return o || '—';
        }

        function formatFilterValue(value, op) {
            if (value === null || value === undefined) return '';

            const o = String(op || '').toLowerCase().trim();

            // between formats: "YYYY-MM-DD,YYYY-MM-DD" | [a,b] | {from,to}
            if (o === 'between') {
                if (typeof value === 'string') {
                    const parts = value.split(',');
                    if (parts.length === 2) {
                        return parts[0].trim() + ' — ' + parts[1].trim();
                    }
                    return value;
                }
                if (Array.isArray(value) && value.length === 2) {
                    return String(value[0]) + ' — ' + String(value[1]);
                }
                if (typeof value === 'object' && value.from !== undefined && value.to !== undefined) {
                    return String(value.from) + ' — ' + String(value.to);
                }
            }

            // in formats: array | comma-separated string
            if (o === 'in') {
                if (Array.isArray(value)) {
                    return value.map(v => String(v)).filter(Boolean).join(', ');
                }
                if (typeof value === 'string') {
                    return value.split(',').map(s => s.trim()).filter(Boolean).join(', ');
                }
            }

            // like: strip % for user-friendly display
            if (o === 'like' && typeof value === 'string') {
                return value.replace(/%/g, '').trim();
            }

            if (typeof value === 'object') {
                try { return JSON.stringify(value); } catch (_) { return String(value); }
            }
            return String(value);
        }

        function formatUSDate(v) {
            // Supports: RFC3339, YYYY-MM-DD, Date
            if (v === null || v === undefined) return '';
            if (v instanceof Date && !isNaN(v.getTime())) {
                const mm = String(v.getUTCMonth() + 1).padStart(2, '0');
                const dd = String(v.getUTCDate()).padStart(2, '0');
                const yyyy = String(v.getUTCFullYear());
                return `${mm}/${dd}/${yyyy}`;
            }

            const s = String(v).trim();
            if (!s) return '';

            // YYYY-MM-DD
            const m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
            if (m) {
                return `${m[2]}/${m[3]}/${m[1]}`;
            }

            // RFC3339
            const d = new Date(s);
            if (!isNaN(d.getTime())) {
                const mm = String(d.getUTCMonth() + 1).padStart(2, '0');
                const dd = String(d.getUTCDate()).padStart(2, '0');
                const yyyy = String(d.getUTCFullYear());
                return `${mm}/${dd}/${yyyy}`;
            }

            return s;
        }

        function formatBetweenRangeUS(value) {
            // Returns "MM/DD/YYYY – MM/DD/YYYY" when possible, otherwise empty string.
            if (value === null || value === undefined) return '';

            // string: "a,b"
            if (typeof value === 'string') {
                const parts = value.split(',');
                if (parts.length === 2) {
                    const a = formatUSDate(parts[0].trim());
                    const b = formatUSDate(parts[1].trim());
                    if (a && b) return `${a} – ${b}`;
                }
                return '';
            }

            // array [a,b]
            if (Array.isArray(value) && value.length === 2) {
                const a = formatUSDate(value[0]);
                const b = formatUSDate(value[1]);
                if (a && b) return `${a} – ${b}`;
                return '';
            }

            // object {from,to}
            if (typeof value === 'object' && value.from !== undefined && value.to !== undefined) {
                const a = formatUSDate(value.from);
                const b = formatUSDate(value.to);
                if (a && b) return `${a} – ${b}`;
                return '';
            }

            return '';
        }

        function isEmptyFilterValue(value, op) {
            if (value === null || value === undefined) return true;
            const o = String(op || '').toLowerCase().trim();

            if (typeof value === 'string') {
                const v = value.trim();
                if (!v) return true;
                if (o === 'like' && v.replace(/%/g, '').trim() === '') return true;
                return false;
            }
            if (Array.isArray(value)) return value.length === 0;
            if (typeof value === 'object') {
                if (o === 'between') {
                    const hasFrom = value.from !== undefined && String(value.from).trim() !== '';
                    const hasTo = value.to !== undefined && String(value.to).trim() !== '';
                    return !(hasFrom && hasTo);
                }
                return Object.keys(value).length === 0;
            }
            return false;
        }

        function formatTimeUnitEn(u) {
            const v = String(u || '').toLowerCase().trim();
            if (!v || v === 'none' || v === 'auto') return '';
            if (v === 'day') return 'by day';
            if (v === 'week') return 'by week';
            if (v === 'month') return 'by month';
            if (v === 'quarter') return 'by quarter';
            if (v === 'year') return 'by year';
            return v;
        }

        function renderQueryMetaBlock(m, kind) {
            const qs = getQuerySpecObj(m);
            const meta = (m && m.metadata) ? m.metadata : {};
            const tableMeta = meta.table || {};
            const chartMeta = meta.chart || {};
            const queryMeta = meta.query || {};

            const labelOf = getFieldLabelResolver(m);

            const entity = qs ? (qs.entity || '') : '';
            const operation = qs ? (qs.operation || '') : '';
            const view = qs ? (qs.view || '') : '';
            const limit = (qs && qs.limit !== undefined && qs.limit !== null) ? Number(qs.limit) : null;

            const metricType = qs && qs.metric ? (qs.metric.type || '') : '';
            const metricField = qs && qs.metric ? (qs.metric.field || '') : '';

            const filters = qs ? normalizeFilterList(qs.filters) : [];
            const sort = qs ? normalizeSortList(qs.sort) : [];

            const groupFields =
                (qs && qs.group_by && Array.isArray(qs.group_by.fields)) ? qs.group_by.fields.filter(Boolean)
                    : (Array.isArray(tableMeta.groupBy) ? tableMeta.groupBy.filter(Boolean) : []);

            const timeUnit =
                (qs && qs.group_by && qs.group_by.time_unit) ? qs.group_by.time_unit
                    : (tableMeta.groupTimeUnit || chartMeta.timeUnit || '');

            const confidence = qs && qs.confidence !== undefined ? Number(qs.confidence) : null;

            // header hint
            const parts = [];
            const formLabel = queryMeta && queryMeta.formLabel ? String(queryMeta.formLabel) : '';
            const formTitle = formLabel || entity || '';

            const nonEmptyFilters = filters.filter(function (f) {
                const op = f.op || f.Op || '';
                const val = f.value !== undefined ? f.value : (f.Value !== undefined ? f.Value : null);
                return !isEmptyFilterValue(val, op);
            });

            if (formTitle) parts.push('Form: ' + formTitle);
            if (nonEmptyFilters.length) parts.push('Filters: ' + nonEmptyFilters.length);
            if (groupFields.length) parts.push('Group: ' + groupFields.length);
            if (sort.length) parts.push('Sort: ' + sort.length);

            const hint = parts.length ? parts.join(' • ') : 'Details';

            // If there is no QuerySpec, keep UI minimal (still show hint)
            let html = '';

            const typeBadge = kind ? ('<span class="badge rounded-pill">' + escapeHtml(kind.toUpperCase()) + '</span>') : '';

            html += '<details class="dq-qmeta">';
            // No extra title text here (mobile-friendly)
            // Keep only form name on the right
            html += '<summary>' + typeBadge + '<span class="dq-qmeta-hint ms-auto">' + escapeHtml(formTitle ? ('Form: ' + formTitle) : '') + '</span></summary>';

            html += '<div class="dq-qmeta-grid">';

            if (qs) {
                html += '<div class="dq-qmeta-kv"><span class="dq-qmeta-k">Form</span><span class="dq-qmeta-v">' + escapeHtml(formTitle || '—') + '</span></div>';
                html += '<div class="dq-qmeta-kv"><span class="dq-qmeta-k">Operation</span><span class="dq-qmeta-v">' + escapeHtml(operation || '—') + '</span></div>';
                html += '<div class="dq-qmeta-kv"><span class="dq-qmeta-k">View</span><span class="dq-qmeta-v">' + escapeHtml(view || kind || '—') + '</span></div>';

                const limitText = (limit === null || isNaN(limit)) ? '—' : (limit <= 0 ? 'no limit' : String(limit));
                html += '<div class="dq-qmeta-kv"><span class="dq-qmeta-k">Limit</span><span class="dq-qmeta-v">' + escapeHtml(limitText) + '</span></div>';

                const metricText = metricType
                    ? (metricType + (metricField ? ('(' + metricField + ')') : ''))
                    : '—';
                html += '<div class="dq-qmeta-kv"><span class="dq-qmeta-k">Metric</span><span class="dq-qmeta-v">' + escapeHtml(metricText) + '</span></div>';
            }

            // Grouping
            if (groupFields.length) {
                const gf = groupFields.map(function (f) { return labelOf(f); }).filter(Boolean).join(', ');
                const tu = formatTimeUnitEn(timeUnit);
                const grpText = gf + (tu ? (' • ' + tu) : '');
                html += '<div class="dq-qmeta-kv" style="grid-column: 1 / -1;"><span class="dq-qmeta-k">Grouping</span><span class="dq-qmeta-v">' + escapeHtml(grpText) + '</span></div>';
            }

            // Sorting
            if (sort.length) {
                const sText = sort.map(function (s) {
                    const f = s.field || s.Field || '';
                    const dir = String(s.direction || s.Direction || '').toLowerCase();
                    const dirRu = (dir === 'desc') ? '↓' : '↑';
                    return (labelOf(f) || f || '—') + ' ' + dirRu;
                }).join(', ');
                html += '<div class="dq-qmeta-kv" style="grid-column: 1 / -1;"><span class="dq-qmeta-k">Sorting</span><span class="dq-qmeta-v">' + escapeHtml(sText) + '</span></div>';
            }

            html += '</div>'; // grid

            // Filters list
            if (nonEmptyFilters.length) {
                html += '<div class="mt-2"><div class="small text-muted fw-semibold mb-1">Filters</div><ul class="dq-qmeta-list">';
                nonEmptyFilters.forEach(function (f) {
                    const field = f.field || f.Field || '';
                    const op = f.op || f.Op || '';
                    const val = f.value !== undefined ? f.value : (f.Value !== undefined ? f.Value : '');
                    const fieldLabel = labelOf(field) || String(field || '—');

                    // Special-case BETWEEN: show as "Date 01/01/2025 – 12/31/2025" (US format), without the word "between".
                    if (String(op || '').toLowerCase().trim() === 'between') {
                        const range = formatBetweenRangeUS(val);
                        const fallback = formatFilterValue(val, op);
                        const out = range || fallback;
                        html += '<li><strong>' + escapeHtml(fieldLabel) + '</strong> <span class="text-muted">' + escapeHtml(out) + '</span></li>';
                        return;
                    }

                    const opText = formatOpEn(op, val);
                    const valText = formatFilterValue(val, op);
                    html += '<li><strong>' + escapeHtml(fieldLabel) + '</strong> ' + escapeHtml(opText) + ' <span class="text-muted">' + escapeHtml(valText) + '</span></li>';
                });
                html += '</ul></div>';
            }

            html += '</details>';
            return html;
        }

        function pickArray(resp) {
            if (!resp) return [];

            if (resp.data) {
                if (Array.isArray(resp.data.sessions)) return resp.data.sessions;
                if (Array.isArray(resp.data.messages)) return resp.data.messages;
                if (Array.isArray(resp.data)) return resp.data;
            }

            if (Array.isArray(resp.sessions)) return resp.sessions;
            if (Array.isArray(resp.messages)) return resp.messages;
            if (Array.isArray(resp.items)) return resp.items;
            if (Array.isArray(resp)) return resp;

            return [];
        }

        function isUserMessage(m) {
            const roleRaw = (m && m.role) ? String(m.role).toLowerCase() : '';
            return roleRaw === 'user' || roleRaw === 'human';
        }

        function normalizeUserText(m) {
            if (!m) return '';
            if (typeof m.content === 'string') return m.content.trim();
            if (m.text) return String(m.text).trim();
            if (m.content && m.content.text) return String(m.content.text).trim();
            return '';
        }

        function addLocalUserMessage(text) {
            const tempId = -Date.now() - Math.floor(Math.random() * 1000);
            state.messages.push({
                id: tempId,
                role: 'user',
                content: text,
                __local: true
            });
            return tempId;
        }

        function removeMessageDomById(msgId) {
            const $box = dom.$messages;
            if (!$box || !$box.length) return;
            const id = String(msgId);
            if (!id) return;
            $box.find('[data-msg-id="' + id + '"]').remove();
        }

        function removeLocalMessage(tempId) {
            const before = state.messages.length;
            state.messages = state.messages.filter(function (m) {
                return getMsgId(m) !== tempId;
            });
            if (state.messages.length !== before) {
                removeMessageDomById(tempId);
                ensureScrollToBottom(true);
            }
        }

        function dropLocalEchoes(fresh) {
            const incomingUserTexts = fresh
                .filter(function (m) { return isUserMessage(m) && getMsgId(m) > 0; })
                .map(normalizeUserText)
                .filter(Boolean);

            if (!incomingUserTexts.length) return false;

            const textSet = new Set(incomingUserTexts);
            const before = state.messages.length;
            const removed = [];

            state.messages = state.messages.filter(function (m) {
                if (!isUserMessage(m)) return true;
                if (getMsgId(m) > 0) return true;
                const txt = normalizeUserText(m);
                const keep = !txt || !textSet.has(txt);
                if (!keep) {
                    removed.push(getMsgId(m));
                }
                return keep;
            });

            if (state.messages.length !== before) {
                removed.forEach(removeMessageDomById);
                return true;
            }
            return false;
        }

        function saveLastChatId(id) {
            /* saving is disabled by request
            try {
                if (id) {
                    window.localStorage.setItem(LAST_CHAT_STORAGE_KEY, String(id));
                } else {
                    window.localStorage.removeItem(LAST_CHAT_STORAGE_KEY);
                }
            } catch (e) {
                console.warn('LocalStorage error:', e);
            }*/
        }

        // ========= API =========
        function fetchChats() {
            if (!window.app || !app.apiGET) return;

            app.apiGET('/ezdata/chat/chats', function (resp) {
                state.chats = pickArray(resp);
                renderChatList();

                // chat is no longer opened by default
                resetToNewChat();
            }, function () {
                app.alert('Cannot load chat sessions.');
                state.chats = [];
                renderChatList();
                resetToNewChat();
            });
        }

        function fetchMessages(chatId, cb) {
            if (!window.app || !app.apiGET || !chatId) return;

            app.apiGET('/ezdata/chat/chats/' + chatId + '/messages', function (resp) {
                state.messages = pickArray(resp);
                renderMessages();
                scrollMessagesToBottom();
                if (typeof cb === 'function') cb(null);
            }, function () {
                app.alert('Cannot load chat messages.');
                if (typeof cb === 'function') cb(new Error('Cannot load chat messages'));
            });
        }

        function createChat(initialText, cb) {
            if (!window.app || !app.apiPOST) return;

            const title = (initialText || 'New chat').trim().substring(0, 80);
            const payload = { domain: 'chat', title: title };

            app.apiPOST('/ezdata/chat/chats', payload, function (chat) {
                if (!chat) return;
                const id = chat.id || chat.chatId || chat.uid;
                if (!id) return;

                state.chats.unshift(chat);
                renderChatList();
                if (typeof cb === 'function') cb(chat);
            }, function () {
                app.alert('Cannot create chat session.');
            });
        }

        function sendMessage(chatId, text, hooks) {
            if (!window.app || !app.apiPOST || !chatId) return;

            // Block input until assistant sends a final response (table/chart/summary/action).
            beginWaitForAssistant(chatId);

            app.apiPOST(
                '/ezdata/chat/chats/' + chatId + '/messages',
                { content: text },
                function () {
                    if (!state.pollActive) startPolling(chatId);

                    if (hooks && typeof hooks.onSuccess === 'function') hooks.onSuccess();
                },
                function () {
                    endWaitForAssistant();
                    if (hooks && hooks.localId) {
                        removeLocalMessage(hooks.localId);
                    }
                    if (hooks && typeof hooks.onError === 'function') hooks.onError();
                    app.alert('Cannot send message.');
                }
            );
        }

        // ========= render =========
        function renderChatList() {
            const $list = dom.$chatList;
            $list.empty();

            if (!state.chats.length) {
                $list.append(
                    '<div class="dq-chat-list-empty">No chats yet. Start a new conversation.</div>'
                );
                return;
            }

            state.chats.forEach(function (chat) {
                const id = chat.id || chat.chatId || chat.uid;
                const name = chat.title || chat.name || ('Chat #' + id);
                const last = escapeHtml(chat.lastMessagePreview || chat.summary || '');
                const isActive = String(id) === String(state.currentChatId);

                const html = [
                    '<button type="button" class="dq-chat-item js-chat-item',
                    (isActive ? ' dq-chat-item--active' : ''),
                    '" data-id="', escapeHtml(id), '">',
                    '<div class="dq-chat-item-title fs-5">', escapeHtml(name), '</div>',
                    last ? '<div class="dq-chat-item-meta">' + last + '</div>' : '',
                    '</button>'
                ].join('');

                $list.append(html);
            });
        }

        function renderMessages() {
            const $box = dom.$messages;
            $box.empty();

            if (!state.messages.length) {
                /*$box.append(
                    '<div class="text-muted small text-center mt-5">' +
                    'No messages yet. Ask a question 👋' +
                    '</div>'
                );*/
                return;
            }

            state.messages.forEach(function (m) {
                const html = renderSingleMessage(m);
                if (!html) return;
                $box.append(html);
            });
        }

        function formatTimestamp(value) {
            if (!value) return '';

            var d = new Date(value);
            if (isNaN(d.getTime())) return '';

            return d.toLocaleString(undefined, {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function scrollMessagesToBottom() {
            const el = dom.$messages && dom.$messages[0];
            if (!el) return;
            el.scrollTop = el.scrollHeight;
        }

        function isNearBottom() {
            const el = dom.$messages && dom.$messages[0];
            if (!el) return true;
            const threshold = 120;
            return (el.scrollHeight - el.scrollTop - el.clientHeight) < threshold;
        }

        function scrollMessagesToBottomSmart(force) {
            const el = dom.$messages && dom.$messages[0];
            if (!el) return;

            if (force || isNearBottom()) {
                el.scrollTop = el.scrollHeight;
            }
        }

        // give DOM/charts "to settle"
        function ensureScrollToBottom(force) {
            let tries = 0;

            function tick() {
                tries++;
                scrollMessagesToBottomSmart(force);

                // several attempts cover late chart rendering
                if (tries < 6) {
                    setTimeout(tick, 80);
                }
            }

            setTimeout(tick, 0);
        }

        function showEmptyState() {
            dom.$emptyState.removeClass('d-none');
            dom.$mainContent.addClass('d-none');
            dom.$emptyInput.focus();
        }

        function showMainContent() {
            dom.$emptyState.addClass('d-none');
            dom.$mainContent.removeClass('d-none');
            dom.$input.focus();
        }

        function updateCurrentChatHeader() {
            const chat = state.chats.find(function (c) {
                const id = c.id || c.chatId || c.uid;
                return String(id) === String(state.currentChatId);
            });

            if (!chat) {
                dom.$currentTitle.text('New conversation');
                dom.$currentSubtitle.text(
                    'Try asking: “Show SOR count by status for this month”.'
                );
                return;
            }

            dom.$currentTitle.text(
                chat.title || chat.name || ('Chat #' + (chat.id || chat.chatId || chat.uid))
            );
            dom.$currentSubtitle.text(chat.description || chat.summary || '');
        }

        function toggleInputDisabled(disabled) {
            dom.$input.prop('disabled', disabled);
            dom.$sendBtn.prop('disabled', disabled);
            dom.$emptyInput.prop('disabled', disabled);
            dom.$emptySend.prop('disabled', disabled);
        }

        function setTypingVisible(visible) {
            if (!dom.$typing) return;
            if (visible) {
                dom.$typing.removeClass('d-none');
            } else {
                dom.$typing.addClass('d-none');
            }
        }

        function beginWaitForAssistant(chatId) {
            state.isSending = true;
            state.waitChatId = chatId || state.currentChatId || null;
            toggleInputDisabled(true);
            setTypingVisible(true);

            if (state.waitTimer) {
                clearTimeout(state.waitTimer);
                state.waitTimer = null;
            }

            // Timeout: if no assistant response arrives, unblock and offer Retry.
            state.waitTimer = setTimeout(function () {
                if (!state.isSending) return;
                if (!state.waitChatId) return;
                if (String(state.waitChatId) !== String(state.currentChatId)) return;

                endWaitForAssistant();
                ensureRetryMessage(state.lastUserPrompt || '');
            }, 60000);
        }

        function endWaitForAssistant() {
            state.isSending = false;
            state.waitChatId = null;
            toggleInputDisabled(false);
            setTypingVisible(false);

            if (state.waitTimer) {
                clearTimeout(state.waitTimer);
                state.waitTimer = null;
            }
        }

        function ensureRetryMessage(lastPrompt) {
            // Avoid duplicates
            for (const m of state.messages) {
                if (!m) continue;
                if (String(m.role || '').toLowerCase() !== 'assistant') continue;
                if (String(m.type || '').toLowerCase() !== 'action') continue;
                let meta = m.metadata || {};
                if (typeof meta === 'string') {
                    try { meta = JSON.parse(meta); } catch (_) { meta = {}; }
                }
                const act = meta.action || {};
                if (String(act.type || '').toLowerCase() === 'retry') {
                    return;
                }
            }

            const tempId = -Date.now() - Math.floor(Math.random() * 1000);
            const msg = {
                id: tempId,
                role: 'assistant',
                type: 'action',
                content: { summary: 'Failed to get response.' },
                metadata: {
                    actionId: tempId,
                    action: { type: 'retry' },
                    retryText: String(lastPrompt || '')
                }
            };
            state.messages.push(msg);
            appendMessages([msg]);
            ensureScrollToBottom(true);
        }

        function removeRetryMessages() {
            const removed = [];
            state.messages = state.messages.filter(function (m) {
                if (!m) return true;
                if (String(m.role || '').toLowerCase() !== 'assistant') return true;
                if (String(m.type || '').toLowerCase() !== 'action') return true;
                let meta = m.metadata || {};
                if (typeof meta === 'string') {
                    try { meta = JSON.parse(meta); } catch (_) { meta = {}; }
                }
                const act = meta.action || {};
                const isRetry = String(act.type || '').toLowerCase() === 'retry';
                if (isRetry) {
                    removed.push(getMsgId(m));
                    return false;
                }
                return true;
            });
            removed.forEach(removeMessageDomById);
        }

        // ========= handlers =========
        function onChatClick() {
            const id = $(this).data('id');
            if (!id || String(id) === String(state.currentChatId)) {
                closeSidebarMobile();
                return;
            }
            setActiveChat(id);
            closeSidebarMobile();
        }

        function setActiveChat(chatId) {
            state.currentChatId = chatId;
            saveLastChatId(chatId);

            dom.$chatList
                .find('.js-chat-item')
                .removeClass('dq-chat-item--active')
                .filter('[data-id="' + chatId + '"]')
                .addClass('dq-chat-item--active');

            updateCurrentChatHeader();
            showMainContent();
            dom.$input.val('');
            endWaitForAssistant();
            fetchMessagesFull(chatId);
        }

        function resetToNewChat() {
            stopPolling();
            endWaitForAssistant();

            state.currentChatId = null;
            state.messages = [];
            state.lastMessageId = 0;

            saveLastChatId(null);
            dom.$input.val('');
            dom.$emptyInput.val('');

            updateCurrentChatHeader();
            showEmptyState();
            renderMessages();
        }

        function startNewChatWithFirstMessage(text) {
            if (!text || state.isSending) return;
            state.lastUserPrompt = text;

            createChat(text, function (chat) {
                const id = chat.id || chat.chatId || chat.uid;
                state.currentChatId = id;
                saveLastChatId(id);

                renderChatList();
                updateCurrentChatHeader();
                showMainContent();

                dom.$input.val('');
                dom.$emptyInput.val('');

                state.messages = [];
                const localId = addLocalUserMessage(text);
                renderMessages();
                ensureScrollToBottom(true);

                sendMessage(id, text, {
                    localId: localId,
                    onSuccess: function () {
                        dom.$input.focus();
                    }
                });
            });
        }

        function onSendMessage() {
            if (!state.currentChatId) {
                const textNew = dom.$input.val().trim();
                if (!textNew) return;
                startNewChatWithFirstMessage(textNew);
                return;
            }

            const text = dom.$input.val().trim();
            if (!text || state.isSending) return;

            dom.$input.val('');
            state.lastUserPrompt = text;

            const localId = addLocalUserMessage(text);
            appendMessages([state.messages[state.messages.length - 1]]);
            ensureScrollToBottom(true);

            sendMessage(state.currentChatId, text, { localId: localId });
        }

        function onActionChoose(e) {
            e.preventDefault();
            const $btn = $(this);
            const actionId = $btn.data('action-id');
            const sessionId = $btn.data('session-id') || state.currentChatId;
            const choice = Number($btn.data('choice')) || 0;
            if (!actionId || !sessionId || !choice) return;

            if (isActionStale(actionId, sessionId)) {
                app.alert('This action is no longer valid. Please refresh the chat.');
                fetchMessagesFull(sessionId);
                return;
            }

            const payload = { result: { choice: choice } };
            $btn.prop('disabled', true);

            beginWaitForAssistant(sessionId);
            app.apiPOST('/ezdata/chat/chats/' + sessionId + '/actions/' + actionId + '/resolve', payload,
                function () {
                    removeActionMessageById(actionId);
                    fetchMessages(sessionId, function () {
                        endWaitForAssistant();
                    });
                },
                function () {
                    app.alert('Cannot resolve action, please retry.');
                    $btn.prop('disabled', false);
                    endWaitForAssistant();
                }
            );
        }

        function onRetrySend(e) {
            e.preventDefault();
            if (state.isSending) return;

            const $btn = $(this);
            const retryId = $btn.data('retry-id');
            const retryText = String($btn.data('retry-text') || state.lastUserPrompt || '').trim();
            if (!retryText) return;

            // remove retry message from state + DOM
            if (retryId) {
                const rid = String(retryId);
                state.messages = state.messages.filter(function (m) {
                    return String(getMsgId(m)) !== rid;
                });
                removeMessageDomById(rid);
            } else {
                removeRetryMessages();
            }

            // Send again as a normal user message
            state.lastUserPrompt = retryText;
            const localId = addLocalUserMessage(retryText);
            appendMessages([state.messages[state.messages.length - 1]]);
            ensureScrollToBottom(true);
            sendMessage(state.currentChatId, retryText, { localId: localId });
        }

        function isActionStale(actionId, sessionId) {
            // If user switched chats, treat as stale.
            if (String(sessionId) !== String(state.currentChatId)) return true;

            const aid = String(actionId);
            let actionMsg = null;

            for (const m of state.messages) {
                if (!m) continue;
                const type = String(m.type || '').toLowerCase();
                if (type !== 'action') continue;

                let meta = m.metadata || {};
                if (typeof meta === 'string') {
                    try { meta = JSON.parse(meta); } catch (_) { meta = {}; }
                }
                const mid = String(m.actionId || (meta && meta.actionId) || '');
                if (mid && mid === aid) {
                    actionMsg = m;
                    break;
                }
            }
            if (!actionMsg) return true;

            let meta = actionMsg.metadata || {};
            if (typeof meta === 'string') {
                try { meta = JSON.parse(meta); } catch (_) { meta = {}; }
            }
            if (meta && meta.resolved === true) return true;

            const actionMsgId = getMsgId(actionMsg);

            // If there is any newer assistant message (non-query_spec), this action is stale.
            for (const m of state.messages) {
                if (!m) continue;
                const id = getMsgId(m);
                if (id <= actionMsgId) continue;
                const role = String(m.role || '').toLowerCase();
                if (role !== 'assistant') continue;
                const t = String(m.type || '').toLowerCase();
                if (t !== 'query_spec') return true;
            }

            return false;
        }

        function removeActionMessageById(actionId) {
            const before = state.messages.length;
            const removedMsgIds = [];
            state.messages = state.messages.filter(function (m) {
                if (!m || (m.type || '').toLowerCase() !== 'action') return true;
                const mid = m.actionId || (m.metadata && m.metadata.actionId) || m.id;
                const keep = String(mid) !== String(actionId);
                if (!keep) {
                    removedMsgIds.push(getMsgId(m));
                }
                return keep;
            });
            if (state.messages.length !== before) {
                removedMsgIds.forEach(removeMessageDomById);
            }
        }

        // ========= Messages =========
        function appendMessages(list) {
            const $box = dom.$messages;

            if (!$box || !$box.length) return;

            // If it was empty placeholder - clean
            if ($box.find('.js-empty-placeholder').length) {
                $box.empty();
            }

            list.forEach(function (m) {
                const html = renderSingleMessage(m);
                $box.append(html);
            });
        }

        function renderSingleMessage(m) {
            const roleRaw = (m.role || m.sender || '').toString().toLowerCase();
            const isUser = roleRaw === 'user' || roleRaw === 'human';

            const type = (m.type || 'text').toString().toLowerCase();
            const meta = m.metadata || {};

            if (type === 'action' && meta.resolved === true) {
                return '';
            }

            let created = formatTimestamp(m.createdAt || m.created_at || '');

            const roleClass = isUser ? 'chat-message-user' : 'chat-message-assistant';

            let innerHtml = '';

            if (isUser) {
                innerHtml = '<div class="chat-message-inner fs-6">' +
                    escapeHtml(m.content || m.text || '') +
                    '</div>';
            } else {
                // Assistant rendering by type

                if (type === 'table' || type === 'chart') {
                    // TODO: implement share function
                    /*innerHtml = '<div class="chat-message-inner fs-6">' + '<button type="button" class="btn btn-link btn-sm btn-text-blue fw-semibold js-share-qspec">' +
                        '<i class="fa fa-share-alt me-1"></i> Share' +
                        '</button>' +
                        '</div>';*/
                }

                if (type === 'summary') {
                    innerHtml = renderSummaryMessage(m);
                } else if (type === 'table') {
                    innerHtml += renderTableMessage(m);
                } else if (type === 'query_spec') {
                    innerHtml = renderQuerySpecMessage(m);
                    created = false;
                } else if (type === 'chart') {
                    innerHtml += renderChartMessage(m);
                } else if (type === 'action') {
                    innerHtml = renderActionMessage(m);
                } else {
                    // fallback text
                    const plain = (typeof m.content === 'string' ? m.content : (m.text || ''));
                    innerHtml = '<div class="chat-message-inner fs-6">' + escapeHtml(plain) + '</div>';

                    if (m.content && m.content.summary) {
                        innerHtml = '<div class="chat-message-inner fs-6 p-0">' + (m.content.summary || '') + '</div>';
                    }

                    // If your backend returns safe HTML in content.summary
                    if (m.content && m.content.summary) {
                        innerHtml = '<div class="chat-message-inner fs-6 p-0">' +
                            (m.content.summary || '') +
                            '</div>';
                    }
                }
            }

            let localWidthInner = "";
            if (type === 'chart') {
                localWidthInner = " style='width: 100%;'";
            }

            const msgId = getMsgId(m);

            return (
                '<div class="chat-message ' + roleClass + '" data-msg-id="' + escapeHtml(msgId) + '">' +
                '<div class="chat-message-inner-wrap"' + localWidthInner + '>' +
                innerHtml +
                (created
                    ? '<div class="chat-message-meta p-2">' + escapeHtml(created) + '</div>'
                    : ''
                ) +
                '</div>' +
                '</div>'
            );
        }

        function renderActionMessage(m) {
            const meta = m.metadata || {};
            const act = meta.action || m.action || {};
            const actionType = (act.type || '').toLowerCase();

            if (actionType === 'retry') {
                const msg = 'Failed to get response.';
                const retryText = (meta && meta.retryText) ? String(meta.retryText) : (state.lastUserPrompt || '');
                const retryId = meta.actionId || m.actionId || m.id || '';

                return '<div class="chat-message-inner fs-6">' +
                    '<div class="mb-2">' + escapeHtml(msg) + '</div>' +
                    '<button type="button" class="btn btn-sm btn-primary js-retry-send" ' +
                    'data-retry-id="' + escapeHtml(retryId) + '" ' +
                    'data-retry-text="' + escapeHtml(retryText) + '">' +
                    'Retry' +
                    '</button>' +
                    '</div>';
            }

            if (actionType === 'choose_project' || actionType === 'choose_user' || actionType === 'choose_company') {
                const opts = Array.isArray(act.options) ? act.options : [];
                if (!opts.length) {
                    const text = escapeHtml(m.content && m.content.summary || m.summary || 'No options provided.');
                    return '<div class="chat-message-inner fs-6">' + text + '</div>';
                }

                const buttons = '<ul class="list-unstyled">' + opts.slice(0, 10).map(function (o) {
                    const label = escapeHtml((o.num ? o.num + ' — ' : '') + (o.name || 'Project')) + (o.info ? ' (' + o.info + ')' : '');
                    return '<li><button type="button" class="btn btn-sm btn-outline btn-active-secondary me-2 mb-2 js-action-choose" ' +
                        'data-action-id="' + (meta.actionId || act.actionId || m.actionId || m.id || '') + '" ' +
                        'data-session-id="' + (m.sessionId || m.session_id || m.chatId || m.chat_id || '') + '" ' +
                        'data-choice="' + (o.index || 0) + '">' + label + '</button></li>';
                }).join('') + '</ul>';

                const summary = escapeHtml(m.content && m.content.summary || m.summary || 'Please choose a project');
                return '<div class="chat-message-inner fs-6">' +
                    '<div class="mb-2">' + summary + '</div>' +
                    '<div class="d-flex flex-wrap">' + buttons + '</div>' +
                    '</div>';
            }

            // fallback
            const plain = (typeof m.content === 'string' ? m.content : (m.text || ''));
            return '<div class="chat-message-inner fs-6">' + escapeHtml(plain) + '</div>';
        }

        function renderSummaryMessage(m) {
            const meta = (m.metadata || {});
            const textMeta = meta.text || {};
            const blocks = Array.isArray(textMeta.blocks) ? textMeta.blocks : [];
            const rawText = textMeta.raw || {};

            let htmlParts = [];

            // 1) Text part
            if (blocks.length) {
                blocks.forEach(function (b) {
                    const t = (b.type || '').toLowerCase();

                    if (t === 'paragraph') {
                        htmlParts.push('<p class="mb-2">' + escapeHtml(b.text || '') + '</p>');
                    }

                    if (t === 'list') {
                        const items = Array.isArray(b.items) ? b.items : [];
                        if (!items.length) return;

                        const li = items.map(function (it) {
                            const label = it.label || '';
                            const domain = it.domain || '';
                            const entity = it.entity || '';

                            return (
                                '<li class="mb-1">' +
                                '<strong>' + escapeHtml(domain || entity || 'Item') + '</strong>' +
                                (label ? ': ' + escapeHtml(label) : '') +
                                '</li>'
                            );
                        }).join('');

                        htmlParts.push('<ul class="mb-2 ps-4">' + li + '</ul>');
                    }
                });
            } else {
                // fallback: numeric aggregations or summary text
                let rendered = false;

                // Try to output numeric value from raw.rows
                if (rawText && Array.isArray(rawText.rows) && rawText.rows.length) {
                    const first = rawText.rows[0] || {};
                    const valueKey = rawText.valueKey || 'value';
                    const val = first[valueKey] !== undefined ? first[valueKey] : first.value;
                    if (val !== undefined) {
                        const title = textMeta.title || (m.content && m.content.summary) || '';
                        htmlParts.push(
                            '<div class="d-flex align-items-baseline gap-2 mb-2">' +
                            '<span class="fs-5 fw-bold">' + escapeHtml(val) + '</span>' +
                            '</div>'
                        );
                        rendered = true;
                    }
                }

                if (!rendered) {
                    // fallback text/HTML
                    const html =
                        (m.content && m.content.summary)
                            ? (m.content.summary || '')
                            : (typeof m.content === 'string' ? escapeHtml(m.content) : escapeHtml(m.text || ''));

                    // important: DO NOT return!
                    htmlParts.push('<div class="mb-1">' + html + '</div>');
                }
            }

            // 2) Chart if exists
            const chartMeta = meta.chart || (m.content && m.content.chart) || null;

            if (chartMeta && typeof chartMeta === 'object') {
                if (!meta.chart) {
                    m.metadata = m.metadata || {};
                    m.metadata.chart = chartMeta;
                }

                const chartId = 'dq-chart-' + (m.id || Math.random().toString(36).slice(2));
                htmlParts.push('<div id="' + chartId + '" class="mt-2"></div>');
                scheduleChartRender(m, chartId);
            }

            return '<div class="chat-message-inner fs-6">' + htmlParts.join('') + '</div>';
        }

        function renderTableMessage(m) {
            const meta = (m.metadata || {});
            const t = meta.table || {};
            const cols = Array.isArray(t.columns) ? t.columns : [];
            const rows = Array.isArray(t.rows) ? t.rows : [];
            const groupBy = Array.isArray(t.groupBy) ? t.groupBy.filter(Boolean) : [];
            const groupTimeUnit = String(t.groupTimeUnit || '').toLowerCase();

            if (!cols.length || !rows.length) {
                const sum = (m.content && m.content.summary) ? m.content.summary : 'No table data';
                return '<div class="chat-message-inner fs-6">' + escapeHtml(sum) + '</div>';
            }

            const visibleCols = cols.filter(c => c.visible !== false);
            const colLabelMap = {};
            cols.forEach(function (c) { colLabelMap[c.key] = c.label || c.key || ''; });

            const thead = visibleCols.map(function (c) {
                return '<th class="small text-muted fw-semibold">' + escapeHtml(c.label || c.key || '') + '</th>';
            }).join('');

            let tbody = '';

            if (groupBy.length) {
                const groups = new Map();

                function buildGroupKey(row) {
                    const parts = [];
                    const labels = [];
                    groupBy.forEach(function (f) {
                        const col = cols.find(c => c.key === f) || {};
                        const raw = row[f];
