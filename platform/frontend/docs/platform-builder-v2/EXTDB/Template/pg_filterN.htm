<script>
	var fld_name = "[{{FIELD_NAME}}]";
	var wObject = new Object();
	wObject = parent.wObject;
	window.returnValue = false;
	function setSelected(){
		if(document.filterFrm.field.value == ""){alert("Please fill Value.");return false;}
		wObject.FILTER = fld_name+" "+document.filterFrm.compare.value+" "+document.filterFrm.field.value+" ";
		window.returnValue = wObject.FILTER;
	    window.dialogClose();
	}
</script>

<form name="filterFrm">
<br>
<b>{{FIELD_TITLE}}</b>
<p>

<br>
<INPUT TYPE="text" TITLE="Column" style="width:100px" VALUE="{{FIELD_TITLE}}" READONLY>
&nbsp;
<select name='compare' style="width:100px" align="absmiddle">
	<option value="=">equal to</option>
	<option value=">">greater than</option>
	<option value="<">less than</option>
	<option value="<=">equal or less</option>
	<option value=">=">equal or greater</option>
	<option value="<>">not equal</option>
</select>
&nbsp;
<INPUT TYPE="text" NAME="field" TITLE="Value" style="width:100px">

<p><button class=Btn onclick="setSelected();">Set Selected</button>
</form>
