<script>
	function setSelected(){
		var val = new Array;
		if($("input[name=lookapFrm]:checked").length>0){
			var frm_id = $("input[name=lookapFrm]:checked").attr("tblid");
			var frm_tbl = $("input[name=lookapFrm]:checked").val();
			if($("input[name=lookupFld"+frm_id+"]:checked").length>0){
				for(var fld=0;fld<$("input[name=lookupFld"+frm_id+"]:checked").length;fld++){
					val.push($("input[name=lookupFld"+frm_id+"]:checked:eq("+fld+")").val())
				}
				parent.SettingsTarget.value = frm_tbl+"^"+val.join("|");
				parent.SettingsFilter.value = $("input[name=ExtDBfld_filter]").val();
				parent.saveFilter()
			}else{
				alert("Please select fields for LookupDisplay")
				return false;
			}
		}else{
				alert("Please select Ext.Form")
				return false;
		}
	}
</script>
