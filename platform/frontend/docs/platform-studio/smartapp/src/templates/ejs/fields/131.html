<div class="row mb-md-4 <% if (req == "Yes") { %>field-required<% } %>">
    <label class="col-sm-4 fs-6 fw-bold form-label mt-4"><%- title%>:</label>
    <div class="col-sm-8"><input type="text" class="form-control <% if (subform === false) { %>fld<% } %>" name="<%- field %>" value="<%- value %>" title="<%- title%>" inputmode="decimal" pattern="-?\d+(\.\d+)?" oninput="this.value=this.value.replace(/[^0-9-.]/g,'').replace(/(?!^)-/g,'').replace(/^(-?)0+(?=\d)/,'$1')" <% if (req == "Yes") { %>required<% } %>></div>
</div>
