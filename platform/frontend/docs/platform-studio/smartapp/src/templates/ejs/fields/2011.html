<% 
    var comment_count = 0;    
    if (value != '' && value != null) {
        var comments = value.split('font size=');
        comment_count = comments.length - 1;
    }

    if (comment_count < 0) {
        comment_count = 0;
    }
%>
<div class="row mb-md-4">
    <label class="col-sm-4 fs-6 fw-bold form-label mt-4">&nbsp</label>
    <div class="col-sm-8">
        <div class="accordion" id="kt_accordion_1">
            <div class="accordion-item">
                <h2 class="accordion-header" id="kt_accordion_1_header_1">
                    <button class="accordion-button fs-4 fw-semibold collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#kt_accordion_1_body_1" aria-expanded="true" aria-controls="kt_accordion_1_body_1">
                        <%- title%> History <span class="badge badge-circle badge-info ms-3"><%- comment_count %></span>
                    </button>
                </h2>
                <div id="kt_accordion_1_body_1" class="accordion-collapse collapse" aria-labelledby="kt_accordion_1_header_1" data-bs-parent="#kt_accordion_1">
                    <div class="accordion-body">
                        <%- value %> 
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="row mb-md-4 <% if (req == "Yes") { %>field-required<% } %>">
    <label class="col-sm-4 fs-6 fw-bold form-label mt-4"><%- title%>:</label>
    <div class="col-sm-8">
        <textarea class="form-control <% if (subform === false) { %>fld<% } %>" name="<%- field %>_update" title="<%- title%>" <% if (req == "Yes") { %>required<% } %>></textarea>
    </div>
</div>
