<script type="text/javascript">
    var _field = null;
    var _access = null;
    $(function() {
        $("#dialog").dialog("destroy");
        $("#dialog-form").dialog({
            autoOpen: false,
            height: 400,
            width: 300,
            modal: true,
            buttons: {
                'Create': function() {
                    var title = $('input[name=ext_title]').val();
                    var page = $('select[name=ext_list]').val();
                    if(page!=null&&title>""){
                        title = title.replace(/,/g,' ').replace(/'/g,'').replace(/"/g,'');
                        extPgNew(page,title);
                        $(this).dialog('close');
                    }
                },
                Cancel: function() {
                    $(this).dialog('close');
                }
            },
            open: function(event, ui) {
                $('input[name=ext_title]').val("new Page Title");
            }
        });
        $("#dialog-import").dialog({
            autoOpen: false,
            height: 500,
            width: 450,
            modal: true,
            buttons: {
                'Import': function() {
                    if($('textarea[name=ext_xml]').val()>""){
                        document.importFrm.submit();
                    }
                },
                Cancel: function() {
                    $(this).dialog('close');
                }
            },
            open: function(event, ui) {
                $('textarea[name=ext_xml]').val("");
                $('.ui-dialog-buttonpane').find('button').addClass('btn btn-info');
            }
        });
        $("#dialog-modules").dialog({
            autoOpen: false,
            height: 500,
            width: 450,
            modal: true,
            buttons: {
                'Import': function() {
                    if($('#mdl_list').val()>""){
                        document.importMdlFrm.submit();
                    }
                },
                Cancel: function() {
                    $(this).dialog('close');
                }
            },
            open: function(event, ui) {
                $('textarea[name=ext_xml]').val("");
                $('.ui-dialog-buttonpane').find('button').addClass('btn btn-info');
            }
        });
        $('#addForm').click(function() { $('#dialog-form').dialog('open'); });
        
        var savedValue = localStorage.getItem('PageMdlFilterValue');
        if (savedValue !== null) {
            $('#PageMdlFilter').val(savedValue);
            filterTable(savedValue.toLowerCase());
        }
        
        $('#PageMdlFilter').on('change', function(){
            var selected = $(this).val();
            localStorage.setItem('PageMdlFilterValue', selected);
            filterTable(selected.toLowerCase());
        });
    });
    
    function filterTable(selected) {
        var sel = (selected || "").trim().toLowerCase();

        $('#PageMdlFilter').closest("fieldset").next().find("tr").each(function () {
            var $tr = $(this);
            if ($tr.find('th').length) return;

            var $td = $tr.find('td:first');

            var base = $td.contents()
            .filter(function () { return this.nodeType === 3; })
            .first()
            .text()
            .trim()
            .toLowerCase();

            if (!base) {
            base = $td.text().split(/\s*\[/)[0].trim().toLowerCase();
            }

            $tr.toggle(!sel || base === sel);
        });
    }
</script>
