        <div class="card bgi-position-y-bottom bgi-position-x-end bgi-no-repeat bgi-size-cover min-h-250px bg-body mb-5 mb-xl-8"
            style="background-position: 100% 0px;background-image:url('/web/assets/media/bg.jpg')" dir="ltr">
            <div class="card-body d-flex flex-column justify-content-center ps-lg-12">
                <h3 class="text-dark fs-2qx fw-bold mb-7">
                    The power of early risk prevention
                </h3>
            </div>
        </div>

    </div>
    <div class="col-xl-12">
        <div id="dashboard-menu" class="row mb-5 mb-xl-8 g-5 g-xl-8">

        </div>
    </div>
</div>

<script>
    var dashboard = {
        init: function () {
        },
        getCount: function (first = true) {
            $(".js-part-count").each(function () {
                let obj = $(this);
                let ezdata = obj.data("ezdata");
                let part = obj.data("part");
                let url = "/web/api/?act=count&part=" + part;
                if (!first || (first && !ezdata) || $.trim(obj.text()) == "-") {
                    if (!ezdata) {
                        url = "/web/c/" + part + "/count.asp";
                    }
                    $.ajax({
                        url: url,
                        type: 'GET',
                        dataType: 'json',
                        cache: false,
                        success: function (data) {
                            if (typeof data.count !== "undefined") {
                                obj.html(data.count);
                            }
                        }
                    });
                }

            });
        }
    }
    dashboard.init();
</script>
