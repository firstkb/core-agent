{{POPUP_BEGIN}}

<style>
	td {width:auto; font:menu;}
	th {width:auto; font:menu;}
	input {width:auto; font:menu;}
	select {width:auto; font:menu;}
	table {width:auto; font:menu;}
	div {width:auto; font:menu;}
</style>

<SCRIPT>
	function SetAction(obj){
		obj.action = "default.asp?action=save&table="+obj.table.value+"&param="+obj.param.value;
	}
</SCRIPT>

<FORM METHOD="post" ACTION="default.asp" TARGET="actFrame" onfocusout="clearStyle(event.srcElement);" onsubmit="window.returnValue = true;SetAction(this);if(validateForm(this,0,0,0,0)){prepareUpload(this)}else{return false;};" NAME="editForm">
  <INPUT TYPE="hidden" NAME="table" VALUE="ExtDBview">
  <INPUT TYPE="hidden" NAME="ExtDBview_ExtDBpg_id" VALUE="{{ExtDBview_ExtDBpg_id}}">
  <INPUT TYPE="hidden" NAME="ExtDBview_act" VALUE="1">
  <INPUT TYPE="hidden" NAME="param" VALUE="{{ID}}">

  <TABLE id="listTable" style="width:100%" ALIGN="center" CELLPADDING="2" CELLSPACING="0" BORDER="0" WIDTH="100%">
    <TR>
		<TD class="t_hd" WIDTH="120" NOWRAP><B>Title</B></TD>
        <TD class="t_td"><INPUT class="form-control" type=text NAME="ExtDBview_title" TITLE="Title" VALUE="{{ExtDBview_title}}" ALT='blank'></TD>
    </TR>
    <TR>
		<TD class="t_hd" WIDTH="120" NOWRAP><B>Link</B></TD>
        <TD class="t_td"><INPUT class="form-control" type=text NAME="ExtDBview_tpl" TITLE="Link" VALUE="{{ExtDBview_tpl}}" ALT='blank'></TD>
    </TR>
    <TR>
      <TD COLSPAN="2" ALIGN="center">
        <INPUT ID=Btn TYPE="submit" VALUE="Submit" NAME="submit">
       </TD>
    </TR>
  </TABLE>
  <center>Use tag: [_id] as ID record</center>
  <center>Use next Types: PDF|, ASP|  <code>PDF|pdf.asp?id=[_id]</code></center>

</FORM>

{{POPUP_END}}
