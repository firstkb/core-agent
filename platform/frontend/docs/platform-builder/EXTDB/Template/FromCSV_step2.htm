{{POPUP_BEGIN}}

<style type="text/css">
	td,th { font:menu; }
	.t_hd { font:menu;text-align:center !important; }
	.delImg {cursor:pointer;}
</style>

<SCRIPT>
	var tree = {{TREE}};
	var fldType = "<option value='200'>TEXT (any symbol)</option>" +
				"<option value='202'>TEXT-SELECT (text as SelectBox)</option>" +
				"<option value='204'>READONLY-TEXT</option>" +
				"<option value='205'>READONLY-NUMERIC</option>" +
				"<option value='2030'>COMBOBOX (custom selections)</option>" +
				"<option value='2031'>COMBOBOX (Yes/No)</option>" +
				"<option value='201'>MEMO (big text)</option>" +
				"<option value='2011'>MEMO (with Updates)</option>" +
				"<option value='2012'>EDITOR (Rich Text Editor)</option>" +
				"<option value='135'>DATE (date type)</option>" +
				"<option value='136'>DATE TODAY (READONLY with current date)</option>" +
				"<option value='3'>NUMERIC (min:0 max:1999999999)</option>" +
				"<option value='131'>FLOAT (like 0.005)</option>" +
				"<option value='6'>MONEY (currency format)</option>" +
				"<option value='30'>DB LOOKUP (ext. Form)</option>" +
				"<option value='31'>DB FIELD (Project)</option>" +
				"<option value='32'>DB FIELD (Contact)</option>" +
				"<option value='33'>DB FIELD (Company)</option>";
	function fldPreview(img_obj,val){
		var img_src = 'icon_fieldtype_textinput.png';
		if(val=="200") img_src = 'icon_fieldtype_textinput.png';
		if(val=="202") img_src = 'icon_fieldtype_select.png';
		if(val=="204") img_src = 'icon_fieldtype_textinput.png';
		if(val=="205") img_src = 'icon_fieldtype_textinput.png';
		if(val=="2030") img_src = 'icon_fieldtype_combobox.png';
		if(val=="2031") img_src = 'icon_fieldtype_combobox.png';
		if(val=="2032") img_src = 'icon_fieldtype_comboboxR.png';
		if(val=="201") img_src = 'icon_fieldtype_textarea.png';
		if(val=="2011") img_src = 'icon_fieldtype_textarea.png';
		if(val=="2012") img_src = 'icon_fieldtype_textarea.png';
		if(val=="135") img_src = 'icon_fieldtype_date.png';
		if(val=="136") img_src = 'icon_fieldtype_date.png';
		if(val=="3") img_src = 'icon_fieldtype_textinput.png';
		if(val=="6") img_src = 'icon_fieldtype_textinput.png';
		if(val=="60") img_src = 'icon_fieldtype_survey.png';
		if(val=="70") img_src = 'icon_fieldtype_title.png';
		if(val=="71") img_src = 'icon_fieldtype_title.png';
		if(val=="72") img_src = 'icon_fieldtype_title.png';
		if(val=="80") img_src = 'icon_fieldtype_tabs.png';
		if(val=="90") img_src = 'icon_fieldtype_cross.png';
		if(val=="30") img_src = 'icon_fieldtype_select.png';
		if(val=="31") img_src = 'icon_fieldtype_select.png';
		if(val=="32") img_src = 'icon_fieldtype_select.png';
		if(val=="33") img_src = 'icon_fieldtype_select.png';
		img_obj.src = "elements/"+img_src;
	}
	var wObject = new Object();
	$(document).ready(function() {
		wObject = parent.wObject;
		for(var i in tree){
			tree[i].fldType = fldType;
			var newrow = jQuery('#list').append($("#itemTemplate").render(tree[i]));
			$("select[name=ExtDBfld_type]").last().val(tree[i].type);
			fldPreview($('img.prevImg').last(),tree[i].type);
		}
	});
	function replaceAll(searchFor, replaceWith, searchedString){
		try{
		    var tmp = searchedString || ((this === window)?(''):(this));
			var re  = new RegExp(searchFor,'g');
			return tmp.replace(re, replaceWith); 
		} catch(e) { return tmp; }
	};
	String.prototype.replaceAll = replaceAll;	
	function validTitle(obj){
		obj.value = $.trim(""+obj.value);
		obj.value = obj.value.replaceAll(",", "_");
		obj.value = obj.value.replaceAll("\"", "`");
		obj.value = obj.value.replaceAll("'", "`");
		obj.value = obj.value.replaceAll(";", ":");
	}
	function delRow(obj){
		$(obj.parentElement.parentElement).find('td').wrapInner('<div style="display: block;" />')
			.parent().find('td > div').slideUp(200, function(){ $(this).parent().parent().remove(); });
	}
	function appendAll(){
		var fields = [];
		for(var i=0;i<$('input[name=ExtDBfld_name]').length;i++){
			fields.push({name:$('input[name=ExtDBfld_name]')[i].value,type:$('select[name=ExtDBfld_type]')[i].value})
		}
		wObject.FIELDS=fields;
		parent.wObject = wObject;
		window.returnValue = wObject;
		window.dialogClose();
	}
    window.returnValue = false;
</SCRIPT>

<TABLE id="listTable" ALIGN="center" CELLPADDING="2" CELLSPACING="0" BORDER="0" WIDTH="95%" height="100%">
<TR>
	<TD class="t_hd" align=center style="background-color:rgb(240,240,240);">
		<center>
		
		<b>STEP2</b>
		
		<table >
		<thead><th class=t_hd>Field</th><th class=t_hd>Type</th><th class=t_hd></th><th class=t_hd></th></thead>
		<tbody id=list></tbody>
		</table>
		
		<p><INPUT ID=Btn TYPE="button" VALUE="Submit" NAME="submit" onclick="appendAll();">
		</center>
	</TD>
</TR>
</TABLE>

<script id="itemTemplate" type="text/x-jsrender">
	<tr>
		<td class=t_td><input type=text name=ExtDBfld_name value="{{>name}}" style='width:200px;' ALT="blank" title='Column Name' onchange="validTitle(this)"></td>
		<td class=t_td><SELECT NAME=ExtDBfld_type style='width:200px;' onchange="fldPreview(this.parentElement.parentElement.children(2).children(0),this.value)">{{:fldType}}</SELECT></td>
		<td class=t_td><img class='prevImg' src='elements/icon_fieldtype_textinput.png' align=absmiddle></td>
		<td class=t_td><img class='delImg' onclick="delRow(this)" src='/Template/images/delete.png' align=absmiddle></td>
	</tr>
</script>

{{POPUP_END}}
