<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1, maximum-scale=1">
	<link href="/Template/css/bootstrap.min.css" rel="stylesheet" type="text/css">
	<link href="/Template/css/app-theme.css" rel="stylesheet" type="text/css">
	<link href="/Template/css/app-styles.css" rel="stylesheet" type="text/css">
	<link href="/Template/css/app-touch.css" rel="stylesheet" type="text/css">
	<link href="/Template/css/icons.css" rel="stylesheet" type="text/css">
	<link href="/Template/css/select2.min.css" rel="stylesheet" type="text/css">
	<link href="/Template/css/jquery-ui.min.css" rel="stylesheet" type="text/css">
	<link href="/Template/css/multiselect.css" rel="stylesheet" type="text/css">
	<script type="text/javascript" src="/Template/js/jquery.min.js"></script>
	<script type="text/javascript" src="/Template/js/jquery-ui.min.js"></script>
	<script type="text/javascript" src="/Template/js/select2.min.js"></script>
	<script type="text/javascript" src="/Template/js/multiselect.js"></script>
	<script>
		$(document).ready(function() {
			$('#LoadingLayer').hide(); 
		});
	</script>
    <style>
        body {
            background: rgb(250,250,250);
            padding: 30px;
        }
        select {
            width: 100%;
        }
        .ui-multiselect input.search {
            height: auto;
            width: auto;
            opacity: 1;
        }
    </style>
</head>
<body SCROLL="yes" BOTTOMMARGIN="0" TOPMARGIN="0" RIGHTMARGIN="0" LEFTMARGIN="0" MARGINWIDTH="0" MARGINHEIGHT="0" >
<table style='position:absolute;color:black;background-color:white;filter:alpha(opacity=90);opacity:0.9;' id='LoadingLayer' width='100%' height='100%'><tr><td align=center><p><font size=2 id=text face="verdana"><b>Please wait.</b></font><p><img src='/Template/images/preloader.gif'></td></tr></table>

<script>
	function setSelected() {
		var values = [];
		var obj = $("form[name='filterFrm']").find("[name='filter']");
		var regex = /^[a-zA-Z0-9 .,#]+ ?$/;

		obj.each(function() {
			var $this = $(this);
            if($this.val()!=null){
                if ($this.val().toString() > "") {
                    if (!regex.test($this.val().toString())) {
                        alert("Filter for [" + $this.attr('title') + "] used wrong symbols!");
                        return false;
                    }
                    if ($this.attr('fld')) {
                        if($this.prop('multiple')==true){
                            values.push($this.attr('fld') + "^" + $this.val().join("~").toString() + "");
                        }else{
                            values.push($this.attr('fld') + "^" + $this.val().toString() + "");
                        }
                    }
                }
            }
		});

		parent.SettingsTarget.value = values.join("|");
		parent.saveFilter();
	}
    $( document ).ready(function() {
		$("select[fld]:not(.m2)").select2();
		$('select.m2').css('width','600px').css('height','200px');
		$('select.m2').multiselect({dividerLocation:0.49});
	});	

</script>

<form name="filterFrm">

  <TABLE id="listTable" ALIGN="center" CELLPADDING="0" CELLSPACING="0" BORDER="0" WIDTH="98%">
	<THEAD>
		<tr>
			<TD class="t_hd"><b>Field Title:</b>
			<TD class="t_hd"><b>Field Filter:</b></TD>
		</tr>
	</THEAD>
	<TBODY>
    <!-- BEGIN tLIST -->
	<TR>
			<TD class="t_td"><b>{{FIELD_TITLE}}:</b>
			<TD class="t_td">{{FIELD_SELECT}}</TD>
	</TR>
    <!-- END tLIST -->
	</TBODY>
  </TABLE>

	<center>
		<BUTTON title="Cancel" onclick='parent.hideSettings();'><i class="icon-remove2"></i> Cancel</BUTTON>
		&nbsp; 
		<BUTTON title="Save" onclick='setSelected()'><i class="icon-archive"></i> Save</BUTTON>
	</center>
  <br>
	
</form>
</body>
</html>
