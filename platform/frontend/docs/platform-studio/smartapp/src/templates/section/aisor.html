<style>
    .blinking-text {
        animation: blink 2s linear infinite;
    }

    @keyframes blink {

        0%,
        100% {
            color: #000;
        }

        50% {
            color: #CCC;
        }
    }

    .ai-loader {
        width: 48px;
        height: 48px;
        border: 5px solid #e1e3ea;
        border-bottom-color: #3498db;
        border-radius: 50%;
        display: inline-block;
        box-sizing: border-box;
        animation: rotation 1s linear infinite;
    }

    .ai-loader.ai-loader-small {
        width: 20px;
        height: 20px;
    }

    #ai-last-text-sor h1,
    #ai-last-text-sor h2,
    #ai-last-text-sor h3 {
        display: inline-block !important;
        width: 100%;
    }

    @keyframes rotation {
        0% {
            transform: rotate(0deg);
        }

        100% {
            transform: rotate(360deg);
        }
    }
</style>
<div class="card card-back-button">
    <div class="card-header d-block d-lg-none card-header-back-button js-sticky-back" data-top="60">
        <button onclick="page.backToList()" class="btn btn-sm" style="padding: 6px 5px 6px 0px;">
            <img src="/web/assets/media/back.svg" height="20" class="mb-0">
        </button>
    </div>
    <div class="card-body" style="min-height: 500px;">
        <div class="row display-desctop">
            <div class="col-sm-2">
                <button type="button" onclick="page.backToList()" class="btn btn-secondary">Back to List</button>
            </div>
        </div>

        <div id="fieldBody">

        </div>

    </div>
</div>
<script id="ai-assistant-sor" type="text/x-template">
    <blockquote class="mt-10" id="ai-main-block-sor">
        <div class="text-info">
            <div class="row mb-4">
                <div class="col-sm-12" style="line-height: 40px;">
                    <img src="/web/assets/media/ai-logo.svg" onclick="page.getRequestAi($(this))" style="height: 40px; cursor: pointer;">
                </div>
            </div>   
            <div class="text-lookup-div" style="color: #000;" id="ai-last-text-sor">
                    
            </div>
        </div>
    </blockquote>
</script>
<script>
    var page = {
        config: {},
        rec: encode("0"),
        ai_count: -2,
        init: function () {
            page.getListConfig();
        },
        unload: function () {
            if (page.sendRequestAiTimeout) {
                clearTimeout(page.sendRequestAiTimeout);
                page.sendRequestAiTimeout = null;
            }
        },
        getListConfig: function () {
            app.jsonGET("/web/api/?act=list_config&part=" + app.part, function (data) {

                page.config = data;
                if (typeof page.config['table']['add'] !== "undefined" && page.config['table']['add'] === "True") {
                    $(".js-add-button").show();
                }
                if (typeof app.config.system['ai'] !== "undefined" && app.config.system['ai']) {
                    page.getFormAi();
                }
            });
        },
        getFormAi: function () {
            if (typeof app.config.system['ai'] === "undefined" || !app.config.system['ai']) {
                return false;
            }

            console.log("AI form");
            $("#fieldBody").prepend(ejs.render(document.getElementById("ai-assistant-sor").innerHTML, page.config.table));
            page.getInfoFromDB();

        },
        getInfoFromDB: function () {
            $.ajax({
                url: '/web/api/?act=ai_html&table_id=' + page.config.table.table_id + '&rec=' + page.rec,
                type: 'GET',
                cache: false,
                success: function (response) {
                    if (response == "") {
                        $('#ai-last-text-sor').html("You haven't sent a request to AI Assistant yet.");
                    } else {
                        page.ai_count++;
                        $('#ai-last-text-sor').html(page.aiParceText(response));
                        $("#btn-ai-edit").css("display", "inline-block");
                    }

                },
                error: function (xhr, status, error) {
                    console.error('Error:', error);
                }
            });
        },
        getRequestAi: function () {
            page.getRequestAiDialog();
        },
        getRequestAiDialog: function () {
            if (page.ai_count > 0) {
                app.alert("You can only send one request per form!");
            } else {
                Swal.fire({
                    text: 'Do you want to request AI Assistant?',
                    icon: "info",
                    buttonsStyling: false,
                    showCancelButton: true,
                    confirmButtonText: "Request",
                    cancelButtonText: 'Cancel',
                    customClass: {
                        confirmButton: "btn btn-success",
                        cancelButton: 'btn btn-info'
                    }
                }).then((result) => {
                    if (result.isConfirmed) {
                        page.ai_count++;
                        page.getRequestAiStart();
                    }
                });
            }
        },
        getRequestAiStart: function () {
            $("#ai-btn-reauest").prop("disabled", true);
            $('#ai-last-text-sor').html('<p class="blinking-text">Please Wait...</p><div id="nprogress-container"><span class="ai-loader"></span></div>');
            app.startPageLoading();
            page.sendRequestAi(true);
        },
        sendRequestAiTimeout: null,
        textAI: "",
        sendRequestAi: function (first = false) {
            console.log("sendRequestAi", first);
            var first_text = first ? 'yes' : 'no';
            var last_response_len = false;
            page.textAI = "";

            $.ajax('/web/api/?act=ai_request&part=' + app.part + '&rec=' + page.rec + '&first=' + first_text, {
                xhrFields: {
                    onprogress: function (e) {
                        var this_response, response = e.currentTarget.response;
                        if (last_response_len === false) {
                            this_response = response;
                            last_response_len = response.length;
                        }
                        else {
                            this_response = response.substring(last_response_len);
                            last_response_len = response.length;
                        }
                        page.textAI += this_response;
                        $('#ai-last-text-sor').find("span.ai-loader").remove();
                        this_response_AI = page.aiParceText(page.textAI);
                        this_response_AI += ' <br><span class="ai-loader ai-loader-small"></span>';
                        $('#ai-last-text-sor').html(this_response_AI);
                        /*if (first) {
                            first = false;
                            $('#ai-last-text-sor').html($.trim(this_response));
                        } else {
                            $('#ai-last-text-sor').html(page.aiParceText($('#ai-last-text-sor').html()));
                            $('#ai-last-text-sor').append($.trim(this_response));
                        }*/

                    }
                }
            })
                .done(function (data) {
                    $('#ai-last-text-sor').find("span.ai-loader").remove();
                    $("#ai-btn-reauest").prop("disabled", false);
                    app.stopPageLoading();
                    $("#btn-ai-edit").css("display", "inline-block");
                    page.getInfoFromDB();
                })
                .fail(function (data) {
                    console.log('Error: ', data);
                });

        },
        aiParceText: function (text) {
            let html = text.replace(/\\n/g, "<br>"); /*replace(/\n/g, "<br>")*/
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*(.*?)\*/g, '<strong>$1</strong>');
            html = html.replace(/####(.*?)####/g, '<h3>$1</h3>');
            html = html.replace(/###(.*?)###/g, '<h2>$1</h2>');
            html = html.replace(/dic_/g, '');
            /*html = html.replace(/####\s*(.*?)\s*(?=<br>|$)/g, '<h3>$1</h3>');
            html = html.replace(/###\s*(.*?)\s*(?=<br>|$)/g, '<h2>$1</h2>');*/
            html = html.replace(/\\\"/g, '"');

            return html;
        },
        backToList: function (url = '/web/?act=list&part=' + app.part) {
            if (typeof page.config.table !== "undefined" && ($("[name=" + page.config.table.field_status + "]").val() === "" || $("[name=" + page.config.table.field_status + "]").val() === null || $("[name=" + page.config.table.field_status + "]").val() === "Removed")) {
                page.backToListDialog(url);
            } else {
                app.loadAjaxContent(url);
            }
        },
        backToHeader: function (table_id, rec) {
            page.backToList('/web/?act=edit&part=E' + table_id + '&rec=' + rec);
        }
    };
    page.init();

</script>
