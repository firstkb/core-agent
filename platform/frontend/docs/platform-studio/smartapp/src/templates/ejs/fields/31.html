<div class="row mb-md-4 <% if (req == 'Yes') { %>field-required<% } %>
        <% if (uniq=='Yes' ) { %>field-uniq<% } %>">
    <% var field_list="projects_num%7Cprojects_name" ; if (typeof system_id !="undefined" && (system_id==1026 ||
        system_id==1042)) { field_list="projects_name" ; } var filter_url="" ; if (filter !="" ) {
        filter_url="--EXTDB--" + field_id; } %>
        <label class="col-sm-4 fs-6 fw-bold form-label mt-4"><%- title%>:</label>
        <div class="col-sm-8">
            <select class="form-select form-control <% if (subform === false) { %>fld<% } %>" data-control="select2"
                data-table="projects" data-fieldname="<%- field_name %>" name="<%- field %>" data-ajax="true"
                data-url="/ezdata/dictionary?table=projects<%- filter_url %>&fields=<%- field_list %>&target=<%- field %>"
                data-placeholder="Select an option" title="<%- title%>" <% if (req=='Yes' ) { %>required<% } %>>
                    <option></option>
                    <% if (value !="" && value !="0" ) { %>
                        <option selected="selected" value="<%- value %>"><%- value_name %></option>
                        <% } %>
            </select>
        </div>
</div>
