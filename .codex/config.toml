#:schema https://developers.openai.com/codex/config-schema.json
# Repo-scoped Codex config for the active runtime.
# Keep user-specific approval, sandbox, and auth defaults in ~/.codex/config.toml.
project_root_markers = [".git"]
model = "gpt-5.5"

# Optional override used by /review.
# review_model = "gpt-5.5"

[features]
multi_agent = true

[agents]
max_depth = 1
max_threads = 4

[agents.maestro_vnext]
description = "Owner-facing adaptive Maestro vNext orchestrator for intent, routing, delegation, gates, evidence, and closeout."
nickname_candidates = ["maestro"]
config_file = "agents/maestro_vnext.toml"

[agents.research_charlie]
description = "Read-only research specialist for code/docs facts, dependencies, risks, and change points."
nickname_candidates = ["charlie"]
config_file = "agents/research_charlie.toml"

[agents.audit_grant]
description = "Plan, brief, risk, dependency, and acceptance audit specialist before approval or high-risk execution."
nickname_candidates = ["grant"]
config_file = "agents/audit_grant.toml"

[agents.implementation_mason]
description = "Scoped implementation specialist for bounded edits from a Maestro packet."
nickname_candidates = ["mason"]
config_file = "agents/implementation_mason.toml"

[agents.verification_scout]
description = "Verification and evidence specialist for tests, builds, browser checks, CI, and security evidence."
nickname_candidates = ["scout"]
config_file = "agents/verification_scout.toml"

[agents.review_lens]
description = "Read-only diff, evidence, acceptance, security, and residual-risk reviewer."
nickname_candidates = ["lens"]
config_file = "agents/review_lens.toml"

[agents.release_manager]
description = "Release/deploy specialist that runs only after explicit release approval."
nickname_candidates = ["release"]
config_file = "agents/release_manager.toml"

[agents.closeout_scribe]
description = "Closeout and evidence summary specialist for durable Maestro work records."
nickname_candidates = ["scribe"]
config_file = "agents/closeout_scribe.toml"

[agents.memory_archivist]
description = "Semantic docs and durable memory audit specialist."
nickname_candidates = ["archivist"]
config_file = "agents/memory_archivist.toml"

# Legacy module-orchestrator agents retained for old artifacts/<module>/ runs.
[agents.module_orchestrator]
description = "Legacy system agent for module-level orchestration under artifacts/<module>/. Prefer maestro_vnext for new work."
nickname_candidates = ["legacy_maestro", "module_orchestrator"]
config_file = "agents/module_orchestrator.toml"

[agents.research_codebase]
description = "Legacy codebase research agent for module_orchestrator stage artifacts. Prefer research_charlie for new work."
nickname_candidates = ["legacy_charlie", "research_codebase"]
config_file = "agents/research_codebase.toml"

[agents.brief_auditor]
description = "Legacy brief auditor for module_orchestrator briefs. Prefer audit_grant for new work."
nickname_candidates = ["legacy_grant", "brief_auditor"]
config_file = "agents/brief_auditor.toml"
