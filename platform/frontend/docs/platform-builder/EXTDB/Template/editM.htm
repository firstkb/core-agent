<SCRIPT>
    function SetAction(obj){
        obj.action = "default.asp?action=save&table="+obj.table.value+"&param="+obj.param.value;
    }
    function fieldError(obj){
        alert('Error: incorrect value in the field - ['+event.srcElement.title+']');
    }
    function prepareForm(vId){
        document.reloadForm.param.value = vId;
        document.reloadForm.submit();
    }
</SCRIPT>

<script>
    var DataList = new jsDataList("default.asp?action={{ACTION}}&table={{TABLE}}&param={{ID}}&type=form", "#listTable");
    DataList.onload(function(){
        initUI(this);
    });
</script>

<script>
    var related = [];
    {{relatedList}}
    var tooltips = [];
    {{tooltipList}}
    var filled = [];
    {{filledList}}
    function initUI(){ 
        for(var i=0;i<filled.length;i++){
            var value = filled[i].value;
            $("[name="+filled[i].field+"]").attr("dataFld",'').val(value);
        }
        for(var i=0;i<tooltips.length;i++){
            var fld = tooltips[i].field;
            var text = tooltips[i].text;
            $("[name="+tooltips[i].field+"]").attr("tooltip",text);
            $("[name="+tooltips[i].field+"]").tooltip({     
                content: function() {         
                    return $(this).attr("tooltip");
                },     
                showURL: false 
            });
        }
        for(var i=0;i<related.length;i++){
            var fld1 = related[i].field;
            var fld2 = related[i].field+"related";
            var arr = related[i].list.split("|");
            var target = $('select[name='+fld1+']');
            var target2 = $('select[name='+fld1+'related]');
            target.select2({theme:'bootstrap', containerCssClass : target.hasClass('field-required')?'field-required':''});
            target2.select2({theme:'bootstrap', containerCssClass : target.hasClass('field-required')?'field-required':''});
            $('option', target).remove();
            target.append('<option value="">&nbsp;</option>');
            for (let row = 0; row < arr.length; row++)
            {
                var val = arr[row].split("^");
                target.append('<option value="'+val[0]+'" list="'+i+'" row="'+row+'">'+val[0]+'</option>');
            }
            target.val(DataList.recordset.Fields(fld1));
            $('select[name='+fld1+']').on('change',function(){
                var target = $('select[name='+$(this).prop('name')+'related]');
                var val = $(this).val();
                var list = $(this).find('option:selected').attr('list');
                var row = $(this).find('option:selected').attr('row');
                $('option', target).remove();
                if(list&&row){
                    var arr = related[list].list.split("|")[row].split('^')[1].split('~');
                    for (let row = 0; row < arr.length; row++){
                        target.append('<option value="'+arr[row]+'">'+arr[row]+'</option>');
                    }
                }
                target.val(DataList.recordset.Fields(fld1+'related'));
            }).change();
        }
        $('div.htmlField').parents('b').children('span').hide();
    };
    window.returnValue = true;
</script>

<!-- PART for Jodit Editor -->
<style>
    div.editor_field {
        width:100%;
        height: 200px;
        border: 4px solid gray;
        padding: 10px;
        overflow: scroll;
    }
    textarea.editor_field {
        width:100%;
        height:100px;
    }
    .editor_title {
        text-align: left;
        padding-bottom:2px;
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
    }
    .editor_title .btn {
        border-radius: 3px;
    }
    .JoditModal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.75);
        z-index: 1000;
        align-items: center;
        justify-content: center;
    }
    .JoditModal .modal-content {
        background: #000;
        border-radius: 8px;
        width: 90%;
        overflow: auto;
        position: relative;
        padding: 2px;
    }
    .JoditModal .modal-footer {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        padding-top: 10px;
        border-top: 1px solid #ddd;
    }
    .JoditModal .modal-footer button {
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
    }
    .JoditModal .save-button {
        background: #28a745;
        color: #fff;
    }
    .JoditModal .save-button:hover {
        background: #218838;
    }    
    .JoditModal .cancel-button {
        background: #dc3545;
        color: #fff;
    }
    .JoditModal .cancel-button:hover {
        background: #c82333;
    }
    .editor_item {
        padding-left: 20px;
        padding-right: 20px;
    }
    #jodit-editor {
        min-height: 400px;
    }
</style>
<script>
    var joditEditor = null;
    var joditEditor_Field = null;
    var originalContent = null;
    var editorDataList;
    var joditModal;

    function initJoditEditor() {
        joditEditor = Jodit.make('#jodit-editor', {
            height: "80vh",
            toolbarButtonSize: 'middle',
            "useSearch": false,
            "toolbarAdaptive": false,
            "uploader": {
                insertImageAsBase64URI: true,
                url: "/Scripts/joditParser.asp",
                process: function (resp) {
                    return {
                        files: resp.files,
                        success: true,
                        isImages: [true],
                        baseurl: resp.url, 
                        path: ''
                    };
                }
            },
            "imageProcessor": { "replaceDataURIToBlobIdInView": false },
            "enter": "BR",
            "defaultActionOnPaste": "insert_clear_html",
            "disablePlugins": "about,ai-assistant,file,iframe,print,search,speech-recognize,spellcheck,symbols,video,add-new-line",
            "buttons": "source,bold,italic,underline,strikethrough,eraser,ul,ol,fontsize,image,hr,table,link,indent,outdent,align,brush,undo,redo"
        });
    }
        
    function openJoditModal(_field) {
        if("{{ID}}"=="new"){
            bootbox.alert("Save new Form before!!!")
            return false;
        }
        if (!joditEditor) {
            initJoditEditor();
        }
        $('#editorSaver').hide();
        joditModal.style.display = 'flex';
        joditEditor_Field = _field;
        let htmlContent = $("textarea.editor_field[data-field="+joditEditor_Field+"]").val();
        originalContent = htmlContent;
        joditEditor.value = htmlContent;
    }

    function cancelJoditModal() {
        if(joditEditor.value!=originalContent){
            bootbox.confirm('You will lost your changes. Are you sure?', function (result){ 
                if(result==true){
                    joditModal.style.display = 'none';
                    if (joditEditor) {
                        joditEditor.value = "";
                    }
                }else{
                    return true;
                }
            });
        }else{
            joditModal.style.display = 'none';
            if (joditEditor) {
                joditEditor.value = "";
            }
        }
    }
    
    function saveJoditModal() {
        if (joditEditor) {
            const newContent = joditEditor.value.replaceAll('’','`').replaceAll('—','-');
            $("div.editor_field[data-field="+joditEditor_Field+"]").html(newContent);
            $("textarea.editor_field[data-field="+joditEditor_Field+"]").val(newContent);
            $('#editorSaver').show();
            saveJoditChanges(newContent);
        }
        joditModal.style.display = 'none';
    }

    function saveJoditChanges(newContent){
        let data = new FormData();
        data.append("param", "{{ID}}");
        data.append("table", "{{TABLE}}");
        data.append(joditEditor_Field, newContent);
        axios.post("/Modules/EXTDB/default.asp?action=save&table={{TABLE}}&param={{ID}}", data, { 
            headers: { 'Content-Type': 'multipart/form-data' }
        }).then(res => {
            if(res.data.includes("Data saved")){
                bootbox.alert('Editor Changes Updated');
            }else{
                console.log(res.data);
                bootbox.alert('Internal Server Error');
            }
        }).catch(error =>{ 
            console.log(error);
            alert(error);
        });
        $('#editorSaver').hide();
    }
    
    $( document ).ready(function() {
        joditModal = document.getElementById('joditModal');

        $("div.form-title").each(function(idx){
            let td = $(this).closest('td');
            let _title = $(this).html();
            let tpl = "<div class='form-title'>"+ _title  +"<div>";
            td.html(tpl);
        });
        
        if($("div.editor_field").length>0){
            $("div.editor_field").each(function(idx){
                let td = $(this).closest('td');
                td.css('text-align','unset');
                let _title = $(this).data('title');
                let _field = $(this).data('field'); 
                let tpl = $('#tpl_failed').html().replace('_title_',_title).replaceAll('_field_',_field);
                td.html(tpl);
            });

            $('#LoadingLayer').show();
            editorDataList = new jsDataList("default.asp?action={{ACTION}}&table={{TABLE}}&part=editor&param={{ID}}");
            editorDataList.onload(function(){
                console.log('editorDataList-loaded');
                editorDataList.fields.forEach(function(fld){
                    if( $("div.editor_field[data-field="+fld+"]").length>0 ){
                        let _html = editorDataList.recordset.Fields(fld);
                        if(_html>''){
                            _html = atob(_html);
                        }else{
                            _html = '<p style="text-align: left;"></p>';
                        }
                        $("div.editor_field[data-field="+fld+"]").html(_html);
                        $("textarea.editor_field[data-field="+fld+"]").val(_html);
                    }
                })
                $('#LoadingLayer').hide();
            });
        }
    
    });	
</script>
<script id="tpl_failed" type="text/x-template">
    <div class='editor_item'>
        <div class='editor_title'>
            <b>_title_</b> <button onclick="openJoditModal('_field_')" class='btn btn-xs btn-success' style="padding: 4px 14px;font-size: 14px;">Edit</button>
        </div>
        <div class='editor_place'><div class='editor_field' data-field='_field_'><p style="text-align: left;"></p></div></div>
        <textarea class="editor_field" data-field='_field_' style="display:none;"></textarea>
    </div>
</script>
<div class="JoditModal" id="joditModal">
    <div class="modal-content">
        <div id="jodit-editor"></div>
        <div class="modal-footer">
            <img id="editorSaver" style="display:none;" src='/Template/images/await.gif'>
            <button class="save-button" onclick="saveJoditModal()">Save</button>
            <button class="cancel-button" onclick="cancelJoditModal()">Cancel</button>
        </div>
    </div>
</div>
    
{{POPUP_END}}
