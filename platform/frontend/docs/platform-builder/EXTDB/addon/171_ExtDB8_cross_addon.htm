<script>
     $(document).ready(function() {
        $('#FilesList').closest('tr').hide();
        if( $("input[name=param]").val()=='new' ){
            let btn = document.createElement('button')
            btn.className = 'btn btn-warning';
            btn.innerText = 'Save And Create New';
            btn.onclick = async e => {
                if( !validateForm($('form[name=editForm]').get(0),0,0,0,0) ){
                    return false;
                }else{
                    let param = $("input[name=param]").val();
                    let table = $("input[name=table]").val();
                    let ExtDB8_id = $("input[name=ExtDB8_id]").val();
                    let ExtDB8_Fld56 = $("input[name=ExtDB8_Fld56]").val();
                    let ExtDB8_ExtDB7_id = $("input[name=ExtDB8_ExtDB7_id]").val();
                    let formData = new FormData();
                        formData.append("param", param);
                        formData.append("table", table);
                        formData.append("ExtDB8_id", ExtDB8_id);
                        formData.append("ExtDB8_Fld56", ExtDB8_Fld56);
                        formData.append("ExtDB8_ExtDB7_id", ExtDB8_ExtDB7_id);
                    $.ajax({
                       url: `/Modules/EXTDB/default.asp?action=save&table=${table}&param=${param}`, 
                       type: 'POST', data: formData,
                       processData: false, contentType: false,
                       success: function(response) {
                           bootbox.alert("Record Added. <br>Please add another <b>Standard</b> or close the form");
                           $('#btnClearList').click();
                       },
                       error: function(xhr, status, error) {
                           bootbox.alert("Error: " + error.message);
                           console.log('Error:', error);
                       }
                    });
                }
            }
            $('#iframe-footer-btn').parent().append(btn)
        }
    })
</script>
