{{POPUP2_BEGIN}}

<SCRIPT LANGUAGE="JavaScript">
	function Print(){
		document.body.scroll = "yes";
		document.PrintItFrm.pageText.value = document.getElementById("ReportResult").innerHTML;
		document.PrintItFrm.submit();
		document.body.scroll = "no";
	}
	function MailIt(){
		document.sendMailFrm.message.value = document.getElementById("ReportResult").innerHTML.replace(/\#ReportResult/gi,'');
		document.sendMailFrm.submit();
	}
</SCRIPT>
<SCRIPT FOR="document" EVENT="onkeydown">
  if ( event.keyCode==27 ) {
    window.close();
  }
</SCRIPT>
<FORM ACTION="/Scripts/PrintIt.asp" NAME="PrintItFrm" style="display:none;margin:0px;padding:0px;" METHOD="POST"><TEXTAREA NAME="pageText" ROWS="0" COLS="0" style="display:none;margin:0px;padding:0px;"></TEXTAREA></FORM>

<DIV ID="ReportResult" style="text-align:left;padding:20px;margin:20px;background-color:white;border:1px solid silver;">

{{REPORT_TEXT}}

</DIV>

{{POPUP2_END}}
