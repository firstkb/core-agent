<div class="row mb-md-4 <% if (req == "Yes") { %>field-required<% } %>">
    <label class="col-sm-4 fs-6 fw-bold form-label mt-4"><%- title%>:</label>
    <div class="col-sm-8">
        <select class="form-select form-control <% if (subform === false) { %>fld<% } %>" name="<%- field %>" data-control="select2" data-placeholder="Select an option" data-value="<%- value %>" title="<%- title%>" <% if (req == "Yes") { %>required<% } %>>
            <option></option>
            <% var items = param.split('|'); %>
            <% for(var _key in items){ %>
                <% var item = items[_key] %>
                <% var nameid = item.split(':'); %>
            <option value="<%- nameid[0] %>"><%- nameid[1] %></option>
            <% } %>
        </select>
    </div>
</div>
