        </thead>
        <tbody id="listBody">
            <tr>

<div class="modal fade" tabindex="-1" id="img-big-sor">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Photo</h5>
                <div class="btn btn-icon btn-sm btn-active-light-primary ms-2" data-bs-dismiss="modal">
                    <i class="fas fa-times fs-2x"></i>
                </div>
            </div>
            <div class="modal-body">
            </div>
            <div class="modal-footer" style="justify-content:space-between;">
                <div>

                </div>
                <div>
                    <button type="button" class="btn btn-warning" data-bs-dismiss="modal">Close</button>
                    <button type="button" onclick="photo.openNewTab($(this))" class="btn btn-success">Open</button>
                </div>
            </div>
        </div>
    </div>
</div>
</div>

<script>
    var rec = '<%- rec %>';
    var parentTableId = '<%- table_id %>';
    var tableId = '<%- fields[0]["table_id"] %>';
    var field = '<%- fields[0]["field"] %>';
    var param = '<%- fields[0]["param"] %>';
    var fieldsResults = '<%- JSON.stringify(sor_lists) %>';
    var data = {
        rec, parentTableId, tableId, field, param, results: fieldsResults
    }

    var btnSOR = '';
    var sorLink = $('a:contains("Safety Observations")');
    if (app.system_id == 1047) {
        sorLink = $('a.menu-link').filter(function () {
            return $(this).text().trim() == 'SOR Archive';
        });
    }
    if (sorLink.length > 0) {
        var href = sorLink.attr('href');
        var urlParams = new URLSearchParams(href.split('?')[1]);
        var part = urlParams.get('part');
    }


    var btnCA = '';
    var CALink = $('a:contains("CA SOR")');
    if (app.system_id == 1047) {
        CALink = $('a:contains("SOR CA")');
    }
    if (CALink.length > 0) {
        var hrefCA = CALink.attr('href');
        var urlParamsCA = new URLSearchParams(hrefCA.split('?')[1]);
        var partCA = urlParamsCA.get('part');
    }

    app.ajaxPOST('/web/api/sor/', data, function (dataRes) {
        dataRes = JSON.parse(dataRes);
        $("#listBody").html('');
        if (dataRes.results) {
            $.each(dataRes.results, function (key, val) {
                if (typeof part != "undefined") {
                    btnSOR = '<a href="/web/?act=edit&part=' + part + '&rec=' + encode(val["id"]) + '" type="button" class="btn btn-sm btn-success ajaxify">edit</a>';
                }
                $("#listBody").append('<tr><td>' + btnSOR + '</td><td>' + val["item"] + '</td><td>' + val["type"] + '</td><td>' + val["status"] + '</td></tr>');

                var files = '';
                if (typeof val['files'] !== "undefined" && val['files'].length > 0) {
                    files += '<div style="text-align: right;">';
                    $.each(val['files'], function (keyf, f) {
                        if (f.ext == 'jpg' || f.ext == 'jpeg' || f.ext == 'png') {
                            files += '<a href="' + f.url + '" target="_blank" class="js-open-img-sor no-ajax" style="margin: 5px;"><img style="max-width:100px;max-height:100px;" src="' + f.url + '"></a>';
                        } else {
                            files += '<br><a href="' + f.url + '" class="no-ajax" target="_blank">' + f.name + '</a>';
                        }
                    });
                    files += '</div>';
                }

                if (val.childs.length > 0) {
                    var tbody = '';
                    $.each(val.childs, function (keyCA, valCA) {
                        if (typeof partCA != "undefined") {
                            btnCA = '<a href="/web/?act=edit&part=' + partCA + '&rec=' + encode(valCA["id"]) + '" type="button" class="btn btn-sm btn-warning ajaxify">edit</a>';
                        }
                        tbody += '<tr><td>' + (btnCA || '') + '</td>' +
                            '<td>' + (valCA["status"] && valCA["status"] !== "null" ? valCA["status"] : '') + '</td>' +
                            '<td>' + (valCA["name"] && valCA["name"] !== "null" ? valCA["name"] : '') + '</td>' +
                            '<!--<td>' + (valCA["req"] && valCA["req"] !== "null" ? valCA["req"] : '') + '</td>-->' +
                            '<td>' + (valCA["notes"] && valCA["notes"] !== "null" ? valCA["notes"] : '') + '</td></tr>';

                    });
                    var tableHTML = `<table class="table table-striped gs-7 gy-5 table table-row-bordered table-row-gray-300">
                        <thead><tr><td></td><td>CA Status</td><td>CA Assignee</td><!--<td>Verif. Req.</td>--><td>CA Description</td></tr></thead>
                        <tbody>${tbody}</tbody>
                        </table>`;
                    $("#listBody").append('<tr><td colspan="20">' + files + tableHTML + '</td></tr>');
                } else {
                    $("#listBody").append('<tr><td colspan="20" style="text-align:center; font-style:italic">' + files + 'No Corrective Actions</td></tr>');
                }

            });
            sorBigImg();
        } else {
            $("#listBody").html('<tr><td colspan="20" style="text-align:center; font-style:italic">No records found</td></tr>')
        }
    }), false, 'json';

    function sorBigImg() {
        $(".js-open-img-sor").off('click');
        $(".js-open-img-sor").on('click', function (e) {
            e.preventDefault();
            let href = $(this).attr("href");
            let name = $(this).find('img').attr("data-name");
            $("#img-big-sor .modal-body").html('<img src="' + href + '" style="max-width: 100%; max-height: 100%; margin-bottom: 0px;" data-name="' + name + '">');
            $("#img-big-sor").modal('show');

        });
    }

    var aiComment = {
        btn: null,
        textarea: null,
        init: function () {
            var label = $('label:contains("Comments")');
            aiComment.textarea = label.closest("div.row").find("textarea");
            //if (aiComment.textarea.text() == "") {
            label.closest("div.row").find("textarea").parent().prepend('<img src="/web/assets/media/ai-logo.svg" id="btn-comment-ai" onclick="aiComment.getRequestAi($(this))" style="height: 30px;cursor: pointer;"> ');
            aiComment.btn = $("#btn-comment-ai");
            //}
            var content = aiComment.textarea.val().trim();
            if (content.length > 0) {
                aiComment.textarea.animate({
                    height: '300px'
                }, 300);
            }
        },
        getRequestAi: function () {
            aiComment.getRequestAiDialog()
        },
        getRequestAiDialog: function () {
            if ($.trim(aiComment.textarea.val()) != "") {
                app.alert("You can only send one request per form!");
            } else {
                Swal.fire({
                    text: 'Do you want to request AI Assistant?',
                    icon: "info",
                    buttonsStyling: false,
                    showCancelButton: true,
                    confirmButtonText: "Request",
                    cancelButtonText: 'Cancel',
                    customClass: {
                        confirmButton: "btn btn-success",
                        cancelButton: 'btn btn-info'
                    }
                }).then((result) => {
                    if (result.isConfirmed) {
                        aiComment.getRequestAiStart();
                    }
                });
            }
        },
        getRequestAiStart: function () {
            aiComment.btn.prop("disabled", true);
            aiComment.textarea.val('Please Wait...');
            app.startPageLoading();
            aiComment.sendRequestAi(true);
        },
        sendRequestAiTimeout: null,
        textAI: "",
        sendRequestAi: function (first = false) {
            console.log("sendRequestAi", first);
            var first_text = first ? 'yes' : 'no';
            var last_response_len = false;
            aiComment.textAI = "";

            $.ajax('/web/api/?act=ai_request_comment&part=' + app.part + '&rec=' + app.rec + '&first=' + first_text, {
                xhrFields: {
                    onprogress: function (e) {
                        var this_response, response = e.currentTarget.response;
                        if (last_response_len === false) {
                            this_response = response;
                            last_response_len = response.length;
                        }
                        else {
                            this_response = response.substring(last_response_len);
                            last_response_len = response.length;
                        }
                        aiComment.textAI += this_response.replace(/\\n/g, "\n");
                        this_response_AI = aiComment.textAI;
                        aiComment.textarea.val(this_response_AI.replace(/\\n/g, "\n"));

                        aiComment.autoExpand(aiComment.textarea);

                    }
                }
            })
                .done(function (data) {
                    app.stopPageLoading();
                    aiComment.btn.css("display", "inline-block");
                    aiComment.textarea.trigger("change");
                })
                .fail(function (data) {
                    console.log('Error: ', data);
                });

        },
        autoExpand: function (textarea) {
            textarea.css('height', 'auto');
            textarea.css('height', textarea.prop('scrollHeight') + 'px');
        }
    }

    aiComment.init();
</script>
