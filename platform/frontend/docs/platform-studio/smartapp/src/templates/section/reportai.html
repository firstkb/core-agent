                        const { key, label } = normalizeGroupValue(raw, col, groupTimeUnit);
                        parts.push(key);
                        labels.push(label);
                    });
                    return { key: parts.join(' | '), label: labels.join(' | ') };
                }

                rows.forEach(function (r) {
                    const g = buildGroupKey(r);
                    if (!groups.has(g.key)) {
                        groups.set(g.key, { label: g.label || g.key || '—', rows: [] });
                    }
                    groups.get(g.key).rows.push(r);
                });

                // Sort groups by group size (desc) to approximate "order by count".
                // This keeps "full table" behavior (raw rows), but makes the grouped view more useful.
                function isEmptyGroupLabel(lbl) {
                    const s = String(lbl || '').trim();
                    return !s || s === '—' || s === '-' || s.toLowerCase() === 'null' || s.toLowerCase() === 'undefined';
                }

                const groupArr = Array.from(groups.entries()).map(function (kv) {
                    const k = kv[0];
                    const v = kv[1] || {};
                    const rr = Array.isArray(v.rows) ? v.rows : [];
                    return {
                        key: k,
                        label: v.label || k || '—',

                    const aEmpty = isEmptyGroupLabel(a.label);

                    if (aEmpty !== bEmpty) return aEmpty ? 1 : -1; // empty groups last

                    const ac = Number(a.count);
                    const bc = Number(b.count);
                    const aCount = Number.isFinite(ac) ? ac : 0;
                    const bCount = Number.isFinite(bc) ? bc : 0;
                    if (bCount !== aCount) return bCount - aCount;
                    return String(a.label || '').localeCompare(String(b.label || ''), 'en', { sensitivity: 'base' });

        const CHART_UI = {

        function formatSmartDate(value, opts) {
            const o = opts || {};
            const hideYear = !!o.hideYear;

            if (!value) return '';

            const d = new Date(value);
            if (isNaN(d.getTime())) return String(value);

            const day = d.getUTCDate();
            const yearFull = d.getUTCFullYear();
            const yearShort = String(yearFull).slice(-2);

            const month = new Intl.DateTimeFormat('en-US', {
                month: 'short',
                timeZone: 'UTC'
            }).format(d);

            if (day === 1) {
                return hideYear ? `${month}` : `${month} ${yearFull}`;
            }

            return hideYear ? `${month} ${day}` : `${month} ${day} ${yearShort}`;
        }

        function normalizeGroupValue(raw, col, groupTimeUnit) {
            let type = (col && col.type) ? String(col.type).toLowerCase() : '';
            let unit = (groupTimeUnit || '').toLowerCase();

            if (groupTimeUnit === 'none') {
                const d = new Date(raw || '');
                if (!isNaN(d.getTime())) {
                    type = 'date';
                    unit = 'day';
                }
            }
            if (type === 'date' && unit && unit !== 'none' && unit !== 'auto') {
                const d = new Date(raw);
                if (!isNaN(d.getTime())) {
                    const y = d.getUTCFullYear();
                    const m = d.getUTCMonth();
                    const day = d.getUTCDate();
                    let key = raw;
                    let label = formatDateValue(raw);

                    if (unit === 'year') {
                        key = String(y);
                        label = String(y);
                    } else if (unit === 'month') {
                        key = `${y}-${String(m + 1).padStart(2, '0')}`;
                        label = new Intl.DateTimeFormat('en-US', { month: 'short', year: 'numeric', timeZone: 'UTC' }).format(d);
                    } else if (unit === 'quarter') {
                        const q = Math.floor(m / 3) + 1;
                        key = `${y}-Q${q}`;
                        label = `Q${q} ${y}`;
                    } else if (unit === 'week') {
                        // Simple week bucket (ISO week not required)
                        const week = Math.ceil(((d - new Date(Date.UTC(y, 0, 1))) / 86400000 + d.getUTCDay() + 1) / 7);
                        key = `${y}-W${week}`;
                        label = `Week ${week} ${y}`;
                    } else if (unit === 'day') {
                        key = `${y}-${String(m + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                        label = formatDateValue(raw);
                    }
                    return { key, label };
                }
            }

            // default
            return { key: raw ?? '', label: raw ?? '' };
        }

        function scheduleChartRender(m, chartId) {

        // ========= FETCHING =========

        function fetchMessagesDelta(chatId, cb) {
            if (!window.app || !app.apiGET || !chatId) return;

            const after = state.lastMessageId || 0;
            const url = '/ezdata/chat/chats/' + chatId + '/messages?after_id=' + after;

            app.apiGET(url, function (resp) {
                const incoming = pickArray(resp);
                //console.log('[DQ] Delta incoming raw:', incoming);
                if (!incoming.length) {
                    if (typeof cb === 'function') cb(false);
                    return;
                }

                // Filter duplicates just in case
                const known = new Set(state.messages.map(m => String(getMsgId(m))));
                const fresh = incoming.filter(m => !known.has(String(getMsgId(m))));

                if (!fresh.length) {
                    if (typeof cb === 'function') cb(false);
                    return;
                }

                dropLocalEchoes(fresh);
                state.messages = state.messages.concat(fresh);

                // Update lastMessageId
                let gotFinal = false;
                fresh.forEach(function (m) {
                    const id = getMsgId(m);
                    if (id > state.lastMessageId) state.lastMessageId = id;
                    if (m.role === 'assistant' && m.type !== 'query_spec') {
                        stopPolling();
                        endWaitForAssistant();
                        removeRetryMessages();
                        gotFinal = true;
                    }
                });

                appendMessages(fresh);
                ensureScrollToBottom(true);
                if (typeof cb === 'function') cb(true, gotFinal);
            }, function () {
                if (typeof cb === 'function') cb(false);
            });

        function renderChartMessage(m) {

        function getChartMeta(m) {
            let meta = m.metadata || {};
            let content = m.content || {};

            if (typeof meta === 'string') {
                try { meta = JSON.parse(meta); } catch (_) { meta = {}; }
            }
            if (typeof content === 'string') {
                try { content = JSON.parse(content); } catch (_) { content = {}; }
            }

            const chartMeta = (meta && meta.chart) || (content && content.chart) || null;

            if (chartMeta && typeof chartMeta === 'object') {
                m.metadata = (meta && typeof meta === 'object') ? meta : (m.metadata || {});
                if (!m.metadata.chart) m.metadata.chart = chartMeta;
                return chartMeta;
            }

            return null;
        }
        function normalizeChartToApex(c) {
            if (!c || typeof c !== 'object') return null;

            // 1) Already Apex format
            if (c.type && Array.isArray(c.series)) {
                return {
                    type: String(c.type).toLowerCase(),
                    title: c.title || '',
                    categories: Array.isArray(c.categories) ? c.categories : null,
                    series: c.series
                };
            }

            // 2) New back-end format
            const chartTypeRaw = String(c.chartType || '').toLowerCase();
            const chartType = mapChartType(chartTypeRaw);

            const labels = Array.isArray(c.labels) ? c.labels : [];
            const rows = Array.isArray(c.rows) ? c.rows : [];

            if (!chartType || (!labels.length && !rows.length)) return null;

            const xKey = c.xKey;
            const valueKey = c.valueKey;
            const seriesKey = c.seriesKey;

            // helper: numeric value
            function num(v) {
                const n = Number(v);
                return Number.isFinite(n) ? n : 0;
            }

            // PIE / DONUT
            if (chartType === 'pie' || chartType === 'donut') {
                let values = [];

                if (rows.length && typeof rows[0] === 'number') {
                    values = rows.map(num);
                } else if (rows.length && typeof rows[0] === 'object' && valueKey) {
                    values = rows.map(r => num(r[valueKey]));
                } else if (labels.length && valueKey) {
                    // fallback: try to find by xKey -> label
                    values = labels.map(label => {
                        const row = rows.find(r => r && r[xKey] == label);
                        return row ? num(row[valueKey]) : 0;
                    });
                }

                return {
                    type: chartType,
                    title: c.title || '',
                    categories: labels.length ? labels : null,
                    series: values
                };
            }

            // LINE / BAR / AREA etc.
            // Variant 1: rows = [number,...]
            if (rows.length && typeof rows[0] === 'number') {
                return {
                    type: chartType,
                    title: c.title || '',
                    categories: labels.length ? labels : null,
                    series: [{
                        name: c.labels && c.labels['value'] ? c.labels['value'] : c.title || 'Series',
                        data: rows.map(num)
                    }]
                };
            }

            // Variant 2: rows = [{...}, {...}]
            if (rows.length && typeof rows[0] === 'object') {
                // multi-series
                if (seriesKey && valueKey) {
                    const seriesMap = {};

                    // determine categories
                    const categories = labels.length
                        ? labels
                        : (xKey ? Array.from(new Set(rows.map(r => r && r[xKey]).filter(Boolean))) : []);

                    rows.forEach(r => {
                        if (!r) return;
                        const sName = String(r[seriesKey] ?? 'Series');
                        if (!seriesMap[sName]) seriesMap[sName] = {};
                        const xVal = xKey ? r[xKey] : null;
                        if (xVal != null) {
                            seriesMap[sName][String(xVal)] = num(r[valueKey]);
                        }
                    });

                    const series = Object.keys(seriesMap).map(name => ({
                        name,
                        data: categories.map(cat => num(seriesMap[name][String(cat)]))
                    }));

                    return {
                        type: chartType,
                        title: c.title || '',
                        categories,
                        series
                    };
                }

                // single-series
                if (valueKey) {
                    const categories = labels.length
                        ? labels
                        : (xKey ? rows.map(r => r && r[xKey]).filter(v => v != null) : []);

                    const data = categories.length && xKey
                        ? categories.map(label => {
                            const row = rows.find(r => r && r[xKey] == label);
                            return row ? num(row[valueKey]) : 0;
                        })
                        : rows.map(r => num(r[valueKey]));

                    return {
                        type: chartType,
                        title: c.title || '',
                        categories,
                        series: [{
                            name: c.labels && c.labels['value'] ? c.labels['value'] : c.title || 'Series',
                            data
                        }]
                    };
                }
            }

            return null;
        }
        function mapChartType(t) {
            const v = String(t || '').toLowerCase().trim();

            // backend may send "none"
            if (!v || v === 'none') return null;

            // apex: column = bar (vertical)
            if (v === 'column') return 'bar';

            // allowed apex types
            if (v === 'line' || v === 'bar' || v === 'area' || v === 'pie' || v === 'donut' || v === 'scatter') {
                return v;
            }

            // fallback: unknown type
            return v;
        }
        function buildLinearTrend(yValues) {
            // x = 0..n-1
            const n = yValues.length;
            if (!n) return [];

            let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
            for (let i = 0; i < n; i++) {
                const x = i;
                const y = Number(yValues[i] ?? 0);

                sumX += x;
                sumY += y;
                sumXY += x * y;
                sumXX += x * x;
            }

            const denom = (n * sumXX - sumX * sumX);
            const slope = denom === 0 ? 0 : (n * sumXY - sumX * sumY) / denom;
            const intercept = (sumY - slope * sumX) / n;

            const trend = [];
            for (let i = 0; i < n; i++) {
                trend.push(Number((intercept + slope * i).toFixed(2)));
            }

            return trend;
        }

        function withTrendlines(series, rawChart, chartType) {
            if (!rawChart || !rawChart.trendline) return series;
            if (!Array.isArray(series) || !series.length) return series;

            const t = String(chartType || '').toLowerCase();
            if (t === 'pie' || t === 'donut') return series;

            const extra = [];

            series.forEach(function (s) {
                const data = Array.isArray(s.data) ? s.data : [];

                // support formats: [number] or [{x,y}]
                const y = data.map(function (v) {
                    if (v && typeof v === 'object') return Number(v.y ?? 0);
                    return Number(v ?? 0);
                });

                const trendY = buildLinearTrend(y);

                const trendData = data.map(function (v, i) {
                    if (v && typeof v === 'object') {
                        return { x: v.x, y: trendY[i] };
                    }
                    return trendY[i];
                });

                extra.push({
                    name: 'Trend Line: ' + (s.name ? s.name : 'Series'),
                    data: trendData,
                    type: 'line',
                    __isTrend: true
                });
            });

            return series.concat(extra);
        }

        function applyTrendStyles(options, series, rawChart) {
            if (!Array.isArray(series)) return;

            const base = Number((rawChart && rawChart.strokeWidth) || 2);

            const widths = [];
            const dash = [];
            const markerSizes = [];
            const curves = [];

            series.forEach(function (s) {
                if (s.__isTrend) {
                    widths.push(Math.max(1, Math.round(base * 1))); // can be 1 or 2
                    dash.push(6);
                    markerSizes.push(0);
                    curves.push('straight');
                } else {
                    widths.push(base);
                    dash.push(0);
                    markerSizes.push(3);
                    curves.push('smooth');
                }
            });

            options.stroke = options.stroke || {};

            // IMPORTANT: different curves for different series
            // ApexCharts usually supports this
            options.stroke.curve = curves;

            options.stroke.width = widths;
            options.stroke.dashArray = dash;

            options.markers = options.markers || {};
            options.markers.size = markerSizes;
            options.markers.hover = options.markers.hover || { size: 5 };

            // Fallback in case Apex version doesn't understand array of curves:
            try {
                // nothing
            } catch (_) {
                // if there are artifacts - can be forced:
                // options.stroke.curve = rawChart && rawChart.trendline ? 'straight' : 'smooth';
            }
        }
        // ========= POLLING =========
        function startPolling(chatId) {
            stopPolling();
            setTypingVisible(true);
            state.pollActive = true;
            state.pollStep = 0;

            function nextDelayMs() {
                // 4 attempts at ~2000ms, then ~4000ms
                const base = state.pollStep < 4 ? 2000 : 4000;
                // jitter: ±15–25% (approx 0.85..1.25)
                const jitter = 0.85 + Math.random() * 0.40;
                return Math.max(800, Math.round(base * jitter));
            }

            function tick() {
                if (!state.pollActive) return;
                if (!state.currentChatId) {
                    schedule();
                    return;
                }
                if (String(chatId) !== String(state.currentChatId)) {
                    stopPolling();
                    return;
                }

                fetchMessagesDelta(chatId, function () {
                    state.pollStep++;
                    schedule();
                });
            }

            function schedule() {
                if (!state.pollActive) return;
                if (state.pollTimer) {
                    clearTimeout(state.pollTimer);
                    state.pollTimer = null;
                }
                state.pollTimer = setTimeout(tick, nextDelayMs());
            }

            schedule();
        }

        function stopPolling() {
            setTypingVisible(false);
            state.pollActive = false;
            if (state.pollTimer) {
                clearTimeout(state.pollTimer);
                state.pollTimer = null;
            }
            state.pollStep = 0;
        }
        // ========= HELPERS =========
        function getMsgId(m) {
            const n = Number(m.id || m.message_id || 0);

        function recomputeLastId() {
            let maxId = 0;

        // ========= public API =========
        let isInitialized = false;

        return {

                cacheDom();
                bindEvents();
                resizeLayout();
                fetchChats();
            },
            unload() {
                if (!isInitialized) return;
                unbindEvents();
                isInitialized = false;
            }
        };
    })();

    jQuery(function () {
        if (window.page && page.init) {
            page.init();
        }
    });
</script>
