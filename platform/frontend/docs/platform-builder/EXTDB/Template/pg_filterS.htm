<script>
	var fld_name = "[{{FIELD_NAME}}]";
	var wObject = new Object();
	wObject = parent.wObject;
	window.returnValue = false;
	function setSelected(){
		var _compare = document.filterFrm.compare.value;
		if(document.filterFrm.field.value == "" && (_compare!="EMPTY" && _compare!="NOT EMPTY")){alert("Please fill Value.");return false;}
		var val = document.filterFrm.field.value;
		val = val.replace(/'/g,"`");
		val = val.replace(/"/g,"``");
		if(document.filterFrm.compare.value == "NOT LIKE"){val = "('"+val+"')";}
		else if(document.filterFrm.compare.value == "LIKE"){val = "('%"+val+"%')";}
		else if(document.filterFrm.compare.value == "IN"){val = "('"+val.split('|').join("','")+"')";}
		else if(document.filterFrm.compare.value == "EMPTY"){
			fld_name = "ISNULL("+fld_name+",'')";
			_compare = '=';
			val = "''";
		}
		else if(document.filterFrm.compare.value == "NOT EMPTY"){
			fld_name = "ISNULL("+fld_name+",'')";
			_compare = '>';
			val = "''";
		}
		else{val = "('"+val+"')";}
		wObject.FILTER = fld_name+" "+_compare+" "+val+" ";
		window.returnValue = wObject.FILTER;
	    window.dialogClose();
	}
</script>

<form name="filterFrm">
<br>
<b>{{FIELD_TITLE}}</b>
<p>

<br>
<INPUT TYPE="text" TITLE="Column" style="width:100px" VALUE="{{FIELD_TITLE}}" READONLY>
&nbsp;
<select name='compare' style="width:150px" align="absmiddle">
	<option value="=">EQUAL value</option>
	<option value="NOT LIKE">NOT EQUAL value</option>
	<option value="LIKE">CONTAIN value</option>
	<option value="IN">IN list</option>
	<option value="EMPTY">IS EMPTY</option>
	<option value="NOT EMPTY">NOT EMPTY</option>
</select>
&nbsp;
<INPUT TYPE="text" NAME="field" TITLE="Value" style="width:150px">
<div id="description1">enter search string (like: San Diego)</div>
<div id="description1">enter lis for IN (like: Open|Draft)</div>

<p><button class=Btn onclick="setSelected();">Set Selected</button>
</form>

{{POPUP2_END}}
