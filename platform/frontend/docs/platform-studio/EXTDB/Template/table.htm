<style>
    .subLink {
        color: #04c;
        text-decoration: underline;
        cursor:pointer;
        font-weight:bold;
    }
    .dropdown-menu {
        min-width: 150px;
    }
    #listTable tr.highlighted td {
        color: blue;
    }
    #listTable .dropdown-menu > li > a {
        font-size: 14px;

</style>

<script>
    function initSubRow(obj){
        if (listTable.readyState == "complete" && DataList.readyState == 4){
            $("tbody td span[dataFld$=_count]",listTable).each(function(index, value){
                var crossId = $(value).prop("dataFld").split('_')[1].replace('Fld','');  //ExtDB4_Fld16_count
                $(value).toggleClass("subLink");
                $(value).prop("title","Show List");
                $(value).click(function(event){
                    var recId = $(this).parent("td").parent("tr").find('input[dataFld={{TABLE}}_id]').val();
                    $('#ajaxDialog').dialog({
                        title: "List",
                        width: 750,
                        height: 500,
                        buttons: {
                            "Ok": function(){
                                $("#ajaxDialog").dialog("close");
                            }
                        },
                        modal:true,
                        open: function(event, ui){
                            $('#ajaxDialogContent').hide();
                            $('#ajaxDialogLoading').show();
                            $.get("default.asp",{
                                action: 'page',
                                page: 'crosslist',
                                from: '{{TABLE}}',
                                field: crossId
                            },function(data){
                                $('#ajaxDialogLoading').hide();
                                $('#ajaxDialogContent').html(data);
                                var crossTable = $('#ajaxDialogContent').find('#crossTable').val();
                                document.getElementById("DataListCross").dataURL = 'default.asp?action=list&table='+crossTable+"&usefilter="+crossTable+"_{{TABLE}}_id="+recId;
                                document.getElementById("DataListCross").Reset();
                                $('#ajaxDialogContent').show();
                            }).fail(function(xhr, status, error) { 
                                var msg = "Sorry but there was an error: ";    
                                alert(msg + xhr.status + ". " + error);  
                            });
                        }
                    });
                });
            });
        }
    }
</script>

<div id="ajaxDialog" style='display:none;width:600px;height:400px;'>
    <div id="ajaxDialogContent" style=''></div>
    <div id='ajaxDialogLoading' style='width:100%;text-align: center;border:0px solid red;margin: 0 auto;'><img src='/Template/images/preloader.gif'></div>
</div>

<script>
    var DataList = new jsDataList("default.asp?action=list&table={{TABLE}}&PAGESLIST=ON", "#listTable");
    DataList.onload(function(){
        if(actSet>""){
            let actList = [];
            let arr = actSet.split('^');
            arr.map(function(el,idx){
                actList.push( {
                    title: el.split('~')[0],
                    action: el.split('~')[1] 
                } );
            })
            $(".btn-action").each(function(){
                let button = $(this);
                button.addClass("dropdown-toggle");
                button.attr("data-toggle", "dropdown");
                button.attr("aria-haspopup", "true");
                button.attr("aria-expanded", "true");
                var dropdownMenu = $("<ul class='dropdown-menu' aria-labelledby='dropdownMenu'></ul>");
                $.each(actList, function (index, item) {
                    var listItem = $("<li><a href='#' data-action='"+index+"'>" + item.title + "</a></li>");
                    dropdownMenu.append(listItem);
                });
                button.wrap("<div class='dropdown'></div>");
                button.after(dropdownMenu);
                dropdownMenu.on("click", "a", function (event) {
                    event.preventDefault();
                    var rec_id = $(this).closest('td').find('input[name=RecID]').val();
                    var rec_key = $(this).closest('td').find('input[name=CryptID]').val();
                    var action = actList[ $(this).data("action") ].action;
                    var action_title = actList[ $(this).data("action") ].title;
                    action = action.replace("[_id]", rec_key);
                    let action_type = action.split('|')[0];
                    let action_link = action.split('|')[1];
                    if(action_type=='ASP'){
                        bootbox.confirm("Run: ["+action_title+"] for Record: "+rec_id+" ?", function(result){
                            if(result==true){
                                var obj = new Object; obj.opener = self;
                                win = new top.ModalDialog(action_link, obj, "dialogWidth:200px;dialogHeight:200px;edge:sunken;help:no;resizable:yes;scroll:no;status:no");
                            }
                        });
                    }
                    if(action_type=='PDF'){
                        var obj = new Object; obj.opener = self;
                        win = new top.ModalDialog("default.asp?page=ViewPDF&report="+btoa(action_link), obj, "dialogWidth:200px;dialogHeight:200px;edge:sunken;help:no;resizable:yes;scroll:no;status:no");
                    }
                });
            });
            
        }
        $('#listTable').on("show.bs.dropdown", function() {
            var clickedElement = $(event.target);
            clickedElement.parents('tr').addClass("highlighted");
        });
        $('#listTable').on("hide.bs.dropdown", function() {
           $("tr.highlighted").removeClass("highlighted");
        });
    });
</script>

<script>
    var page_actfilter = "{{ExtDBpg_prefilter}}";
    page_actfilter = page_actfilter.replace("{{"+"ExtDBpg_prefilter"+"}}","");
    
    function viewFiles(valTable,valParam){
        var obj = new Object; obj.opener = self;
        win = new top.ModalDialog("default.asp?action=page&page=Files&table="+valTable+"&param="+valParam, obj, "dialogWidth:"+varDialogWidth+";dialogHeight:"+varDialogHeight+";edge:Sunken;help:No;resizable:Yes;scroll:no;status:No");
    }

    function showContextMenu($button) {
        var index = $button.data('index');
        var menuItems = menuWithPlaceholder.map(function(item){
            return {
                title: item.title,
                action: item.action.replace(/\[_id\]/g, index)
            };
        });
        var dropdownMenu = $('<ul class="dropdown-menu" role="menu"></ul>');
        menuItems.forEach(function(item){
            var $menuItem = $('<li><a href="#">' + item.title + '</a></li>');
            $menuItem.find('a').on('click', function(e){
                e.preventDefault();
                try {
                    eval(item.action);
                } catch (err) {
                    console.error('Error executing action:', err);
                }
                dropdownMenu.remove();
            });
            dropdownMenu.append($menuItem);
        });
        var $dropdownWrapper = $button.parent();
        $dropdownWrapper.append(dropdownMenu);
        $dropdownWrapper.addClass('open');
        $(document).on('click.contextMenu', function(event){
            if(!$(event.target).closest($dropdownWrapper).length){
                dropdownMenu.remove();
                $dropdownWrapper.removeClass('open');
                $(document).off('click.contextMenu');
            }
        });
    }
</script>
